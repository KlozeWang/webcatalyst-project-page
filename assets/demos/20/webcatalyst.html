<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto Ninja Fighting Game - Judo & Boxing Techniques</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0a0a0a;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
font-family: 'Arial Black', Arial, sans-serif;
overflow: hidden;
}
#gameContainer {
position: relative;
width: 900px;
height: 600px;
border: 3px solid #ff6600;
border-radius: 10px;
overflow: hidden;
box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
}
canvas {
display: block;
background: #1a1a2e;
}
#uiOverlay {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
}
.healthBarContainer {
position: absolute;
top: 15px;
width: 350px;
height: 30px;
background: #333;
border: 2px solid #fff;
border-radius: 15px;
overflow: hidden;
}
#player1HealthContainer { left: 20px; }
#player2HealthContainer { right: 20px; }
.healthBar {
height: 100%;
transition: width 0.3s ease;
border-radius: 13px;
}
#player1Health {
background: linear-gradient(90deg, #ff6600, #ff9900);
width: 100%;
}
#player2Health {
background: linear-gradient(90deg, #ff0000, #cc0000);
width: 100%;
float: right;
}
.playerName {
position: absolute;
top: 50px;
font-size: 14px;
color: #fff;
text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}
#player1Name { left: 25px; }
#player2Name { right: 25px; text-align: right; }
#timer {
position: absolute;
top: 10px;
left: 50%;
transform: translateX(-50%);
font-size: 36px;
color: #ffcc00;
text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
z-index: 10;
}
#specialBarContainer {
position: absolute;
bottom: 15px;
width: 200px;
height: 15px;
background: #333;
border: 1px solid #fff;
border-radius: 8px;
overflow: hidden;
}
#player1SpecialContainer { left: 20px; }
#player2SpecialContainer { right: 20px; }
.specialBar {
height: 100%;
transition: width 0.2s ease;
border-radius: 6px;
}
#player1Special {
background: linear-gradient(90deg, #00ccff, #0066ff);
width: 0%;
}
#player2Special {
background: linear-gradient(90deg, #ff00cc, #cc00ff);
width: 0%;
float: right;
}
#controls {
position: absolute;
bottom: 40px;
left: 50%;
transform: translateX(-50%);
color: #fff;
font-size: 11px;
text-align: center;
background: rgba(0,0,0,0.7);
padding: 8px 15px;
border-radius: 8px;
pointer-events: auto;
}
#startScreen {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 100;
}
#startScreen h1 {
font-size: 48px;
color: #ff6600;
text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
margin-bottom: 10px;
animation: pulse 2s infinite;
}
#startScreen h2 {
font-size: 24px;
color: #ffcc00;
margin-bottom: 30px;
}
@keyframes pulse {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.05); }
}
.btn {
padding: 15px 40px;
font-size: 20px;
font-family: 'Arial Black', Arial, sans-serif;
border: none;
border-radius: 10px;
cursor: pointer;
margin: 10px;
transition: all 0.3s ease;
pointer-events: auto;
}
.btn:hover { transform: scale(1.1); }
#startBtn {
background: linear-gradient(90deg, #ff6600, #ff9900);
color: #fff;
}
#modeSelect {
display: flex;
gap: 15px;
margin-top: 20px;
}
.modeBtn {
padding: 10px 25px;
font-size: 16px;
font-family: 'Arial Black', Arial, sans-serif;
border: 2px solid #ff6600;
background: transparent;
color: #fff;
border-radius: 8px;
cursor: pointer;
transition: all 0.3s ease;
pointer-events: auto;
}
.modeBtn:hover, .modeBtn.active {
background: #ff6600;
color: #fff;
}
#gameOverScreen {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
display: none;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 100;
}
#gameOverScreen h1 {
font-size: 48px;
color: #ffcc00;
margin-bottom: 20px;
}
#restartBtn {
background: linear-gradient(90deg, #ff6600, #ff9900);
color: #fff;
padding: 15px 40px;
font-size: 20px;
font-family: 'Arial Black', Arial, sans-serif;
border: none;
border-radius: 10px;
cursor: pointer;
pointer-events: auto;
}
#restartBtn:hover { transform: scale(1.1); }
#comboDisplay {
position: absolute;
top: 80px;
left: 50%;
transform: translateX(-50%);
font-size: 28px;
color: #ffcc00;
text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
display: none;
z-index: 10;
}
#fightText {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
font-size: 72px;
color: #ff6600;
text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
display: none;
z-index: 50;
animation: fightAppear 1s ease-out;
}
@keyframes fightAppear {
0% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}
#techniqueDisplay {
position: absolute;
bottom: 60px;
left: 50%;
transform: translateX(-50%);
font-size: 16px;
color: #00ffcc;
text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
display: none;
z-index: 10;
}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas" width="900" height="600"></canvas>
<div id="uiOverlay">
<div class="healthBarContainer" id="player1HealthContainer">
<div class="healthBar" id="player1Health"></div>
</div>
<div class="healthBarContainer" id="player2HealthContainer">
<div class="healthBar" id="player2Health"></div>
</div>
<div class="playerName" id="player1Name">🍥 NARUTO</div>
<div class="playerName" id="player2Name">👊 OPPONENT</div>
<div id="timer">99</div>
<div id="specialBarContainer" id="player1SpecialContainer">
<div class="specialBar" id="player1Special"></div>
</div>
<div id="specialBarContainer" id="player2SpecialContainer">
<div class="specialBar" id="player2Special"></div>
</div>
<div id="comboDisplay"></div>
<div id="fightText">FIGHT!</div>
<div id="techniqueDisplay"></div>
<div id="controls">
<strong>Player 1:</strong> A/D Move | W Jump | J Punch | K Kick | L Rasengan | U Uppercut | I Judo Throw | Space Special<br>
<strong>Player 2 (AI):</strong> Auto fights with Boxing & Judo techniques
</div>
</div>
<div id="startScreen">
<h1>🍥 NARUTO FIGHTER 🍥</h1>
<h2>Ninja • Judo • Boxing</h2>
<div id="modeSelect">
<button class="modeBtn active" onclick="selectMode('ai')">vs AI</button>
<button class="modeBtn" onclick="selectMode('pvp')">2 Players</button>
</div>
<br>
<button class="btn" id="startBtn" onclick="startGame()">START FIGHT!</button>
</div>
<div id="gameOverScreen">
<h1 id="winnerText">PLAYER 1 WINS!</h1>
<button id="restartBtn" onclick="restartGame()">REMATCH</button>
</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

let gameMode = 'ai';
let gameRunning = false;
let timer = 99;
let timerInterval = null;
let particles = [];
let screenShake = 0;
let fightStarted = false;

// Audio context for sound effects
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = new AudioCtx();

function playSound(freq, duration, type = 'square') {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.type = type;
osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
osc.start();
osc.stop(audioCtx.currentTime + duration);
}

function playHitSound() {
playSound(200, 0.1, 'sawtooth');
playSound(150, 0.15, 'square');
}

function playSpecialSound() {
playSound(400, 0.3, 'sine');
playSound(600, 0.2, 'sine');
playSound(800, 0.15, 'sine');
}

function playKOSound() {
playSound(100, 0.5, 'sawtooth');
playSound(80, 0.6, 'square');
}

// Fighter class
class Fighter {
constructor(x, y, name, color, isPlayer1) {
this.x = x;
this.y = y;
this.width = 60;
this.height = 100;
this.name = name;
this.color = color;
this.isPlayer1 = isPlayer1;
this.health = 100;
this.maxHealth = 100;
this.special = 0;
this.maxSpecial = 100;
this.velocityX = 0;
this.velocityY = 0;
this.speed = 5;
this.jumpPower = 15;
this.grounded = true;
this.facing = isPlayer1 ? 1 : -1;
this.attacking = false;
this.attackType = '';
this.attackTimer = 0;
this.attackDuration = 0;
this.hitTimer = 0;
this.combo = 0;
this.comboTimer = 0;
this.blocking = false;
this.stunned = false;
this.stunTimer = 0;
this.animFrame = 0;
this.animTimer = 0;
this.state = 'idle';
this.throwTimer = 0;
this.cloneCount = 0;
this.clones = [];
this.dashTimer = 0;
this.dashCooldown = 0;
this.invincible = false;
this.invincibleTimer = 0;
}

update() {
this.animTimer++;
if (this.animTimer > 10) {
this.animTimer = 0;
this.animFrame = (this.animFrame + 1) % 4;
}

if (this.hitTimer > 0) this.hitTimer--;
if (this.stunTimer > 0) {
this.stunTimer--;
if (this.stunTimer <= 0) this.stunned = false;
}
if (this.attackTimer > 0) {
this.attackTimer--;
if (this.attackTimer <= 0) {
this.attacking = false;
this.attackType = '';
}
}
if (this.comboTimer > 0) {
this.comboTimer--;
if (this.comboTimer <= 0) this.combo = 0;
}
if (this.invincibleTimer > 0) {
this.invincibleTimer--;
if (this.invincibleTimer <= 0) this.invincible = false;
}
if (this.dashCooldown > 0) this.dashCooldown--;

// Physics
this.velocityY += 0.8;
this.x += this.velocityX;
this.y += this.velocityY;

// Ground collision
if (this.y + this.height >= H - 50) {
this.y = H - 50 - this.height;
this.velocityY = 0;
this.grounded = true;
}

// Wall collision
if (this.x < 0) this.x = 0;
if (this.x + this.width > W) this.x = W - this.width;

// Friction
this.velocityX *= 0.8;

// Update clones
this.clones = this.clones.filter(clone => {
clone.timer--;
clone.x += clone.velocityX;
clone.y += clone.velocityY;
if (clone.y + clone.height >= H - 50) {
clone.y = H - 50 - clone.height;
clone.velocityY = 0;
}
return clone.timer > 0;
});
}

draw() {
ctx.save();

// Draw clones
this.clones.forEach(clone => {
ctx.globalAlpha = 0.4;
this.drawCharacter(clone.x, clone.y, this.color, true);
});

ctx.globalAlpha = 1;

// Draw main character
if (this.invincible && Math.floor(this.invincibleTimer / 3) % 2 === 0) {
ctx.globalAlpha = 0.5;
}

this.drawCharacter(this.x, this.y, this.color, false);

ctx.restore();
}

drawCharacter(x, y, color, isClone) {
ctx.save();
ctx.translate(x + this.width / 2, y + this.height / 2);

const scale = this.facing;
ctx.scale(scale, 1);

// Body
const bodyColor = isClone ? '#ff9900' : color;

// Legs
ctx.fillStyle = '#333';
if (this.state === 'walking') {
const legOffset = Math.sin(this.animFrame * Math.PI / 2) * 10;
ctx.fillRect(-15, 20, 12, 30 + legOffset);
ctx.fillRect(3, 20, 12, 30 - legOffset);
} else if (this.state === 'kicking') {
ctx.fillRect(-15, 20, 12, 30);
ctx.fillRect(10, 10, 30, 10);
} else {
ctx.fillRect(-15, 20, 12, 30);
ctx.fillRect(3, 20, 12, 30);
}

// Body/Torso
ctx.fillStyle = bodyColor;
ctx.fillRect(-20, -20, 40, 45);

// Orange jacket detail
ctx.fillStyle = '#ff6600';
ctx.fillRect(-20, -20, 40, 45);
ctx.fillStyle = '#cc5500';
ctx.fillRect(-2, -20, 4, 45);

// Arms
ctx.fillStyle = '#ffcc99';
if (this.attacking && this.attackType === 'punch') {
ctx.fillRect(15, -15, 35, 10);
// Fist
ctx.fillStyle = '#ffcc99';
ctx.fillRect(45, -18, 12, 16);
} else if (this.attacking && this.attackType === 'uppercut') {
ctx.fillRect(15, -35, 10, 30);
ctx.fillRect(15, -45, 12, 15);
} else if (this.attacking && this.attackType === 'kick') {
ctx.fillRect(-25, -10, 10, 25);
} else if (this.blocking) {
ctx.fillRect(-10, -25, 10, 25);
ctx.fillRect(0, -25, 10, 25);
} else {
const armSwing = Math.sin(this.animFrame * Math.PI / 2) * 5;
ctx.fillRect(-25, -15 + armSwing, 10, 25);
ctx.fillRect(15, -15 - armSwing, 10, 25);
}

// Head
ctx.fillStyle = '#ffcc99';
ctx.fillRect(-12, -40, 24, 22);

// Hair (Naruto style - spiky)
ctx.fillStyle = '#ffcc00';
ctx.beginPath();
ctx.moveTo(-15, -35);
ctx.lineTo(-20, -55);
ctx.lineTo(-10, -42);
ctx.lineTo(-5, -58);
ctx.lineTo(0, -42);
ctx.lineTo(5, -58);
ctx.lineTo(10, -42);
ctx.lineTo(15, -55);
ctx.lineTo(20, -35);
ctx.closePath();
ctx.fill();

// Headband
ctx.fillStyle = '#3366cc';
ctx.fillRect(-14, -38, 28, 6);
ctx.fillStyle = '#cccccc';
ctx.fillRect(-8, -37, 16, 4);

// Eyes
ctx.fillStyle = '#fff';
ctx.fillRect(-8, -32, 6, 5);
ctx.fillRect(2, -32, 6, 5);
ctx.fillStyle = '#3366cc';
ctx.fillRect(-6, -31, 3, 3);
ctx.fillRect(4, -31, 3, 3);

// Mouth
if (this.attacking) {
ctx.fillStyle = '#cc0000';
ctx.fillRect(-5, -26, 10, 4);
} else {
ctx.fillStyle = '#cc6633';
ctx.fillRect(-3, -26, 6, 2);
}

// Whisker marks
ctx.strokeStyle = '#cc9966';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(-12, -28);
ctx.lineTo(-8, -26);
ctx.moveTo(-12, -24);
ctx.lineTo(-8, -22);
ctx.moveTo(8, -28);
ctx.lineTo(12, -26);
ctx.moveTo(8, -24);
ctx.lineTo(12, -22);
ctx.stroke();

// Special effect for rasengan
if (this.attacking && this.attackType === 'rasengan') {
ctx.fillStyle = '#00ccff';
ctx.globalAlpha = 0.6 + Math.sin(this.attackTimer * 0.5) * 0.3;
ctx.beginPath();
ctx.arc(30, -10, 20 + Math.sin(this.attackTimer * 0.3) * 5, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(30, -10, 10, 0, Math.PI * 2);
ctx.fill();
ctx.globalAlpha = 1;
}

// Judo throw effect
if (this.attacking && this.attackType === 'throw') {
ctx.strokeStyle = '#ffcc00';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(20, 0, 25, 0, Math.PI * 2);
ctx.stroke();
}

ctx.restore();
}

attack(type) {
if (this.attacking || this.stunned || this.hitTimer > 0) return;

this.attacking = true;
this.attackType = type;

switch (type) {
case 'punch':
this.attackDuration = 15;
this.attackTimer = this.attackDuration;
this.state = 'punching';
playSound(300, 0.05);
break;
case 'kick':
this.attackDuration = 20;
this.attackTimer = this.attackDuration;
this.state = 'kicking';
playSound(250, 0.05);
break;
case 'uppercut':
this.attackDuration = 25;
this.attackTimer = this.attackDuration;
this.state = 'uppercut';
this.velocityY = -5;
playSound(350, 0.08);
break;
case 'rasengan':
if (this.special >= 30) {
this.special -= 30;
this.attackDuration = 40;
this.attackTimer = this.attackDuration;
this.state = 'rasengan';
playSpecialSound();
screenShake = 10;
} else {
this.attacking = false;
return;
}
break;
case 'throw':
if (this.special >= 20) {
this.special -= 20;
this.attackDuration = 30;
this.attackTimer = this.attackDuration;
this.state = 'throwing';
playSound(200, 0.1);
} else {
this.attacking = false;
return;
}
break;
case 'jab':
this.attackDuration = 10;
this.attackTimer = this.attackDuration;
this.state = 'jabbing';
playSound(400, 0.03);
break;
case 'hook':
this.attackDuration = 18;
this.attackTimer = this.attackDuration;
this.state = 'hooking';
playSound(280, 0.06);
break;
case 'cross':
this.attackDuration = 22;
this.attackTimer = this.attackDuration;
this.state = 'crossing';
playSound(260, 0.07);
break;
}
}

takeDamage(amount, attacker) {
if (this.invincible) return;

if (this.blocking) {
amount *= 0.2;
this.special = Math.min(this.maxSpecial, this.special + 5);
} else {
this.hitTimer = 15;
this.stunned = true;
this.stunTimer = 10;
this.combo = 0;
screenShake = 5;
playHitSound();
}

this.health = Math.max(0, this.health - amount);
attacker.special = Math.min(attacker.maxSpecial, attacker.special + amount * 0.5);

// Spawn hit particles
for (let i = 0; i < 8; i++) {
particles.push({
x: this.x + this.width / 2,
y: this.y + this.height / 3,
vx: (Math.random() - 0.5) * 10,
vy: (Math.random() - 0.5) * 10,
life: 20,
color: '#ffcc00',
size: Math.random() * 5 + 2
});
}

if (this.health <= 0) {
playKOSound();
}
}

getAttackBox() {
if (!this.attacking) return null;

let box = { x: 0, y: 0, width: 0, height: 0, damage: 0 };

switch (this.attackType) {
case 'punch':
box = { x: this.x + this.width, y: this.y + 10, width: 40, height: 20, damage: 8 };
break;
case 'kick':
box = { x: this.x + this.width, y: this.y + 30, width: 50, height: 20, damage: 12 };
break;
case 'uppercut':
box = { x: this.x + this.width, y: this.y - 10, width: 35, height: 40, damage: 15 };
break;
case 'rasengan':
box = { x: this.x + this.width, y: this.y + 10, width: 60, height: 40, damage: 25 };
break;
case 'throw':
box = { x: this.x + this.width, y: this.y, width: 50, height: this.height, damage: 20 };
break;
case 'jab':
box = { x: this.x + this.width, y: this.y + 15, width: 30, height: 15, damage: 5 };
break;
case 'hook':
box = { x: this.x + this.width, y: this.y + 5, width: 45, height: 25, damage: 12 };
break;
case 'cross':
box = { x: this.x + this.width, y: this.y + 10, width: 50, height: 20, damage: 15 };
break;
}

if (this.facing === -1) {
box.x = this.x - box.width;
}

return box;
}

getHitBox() {
return {
x: this.x,
y: this.y,
width: this.width,
height: this.height
};
}
}

// Create fighters
let player1 = new Fighter(150, H - 150, 'NARUTO', '#ff6600', true);
let player2 = new Fighter(700, H - 150, 'OPPONENT', '#cc0000', false);

// Input handling
const keys = {};
document.addEventListener('keydown', (e) => {
keys[e.key.toLowerCase()] = true;
e.preventDefault();
});
document.addEventListener('keyup', (e) => {
keys[e.key.toLowerCase()] = false;
e.preventDefault();
});

// Touch controls for mobile
const touchControls = {
left: false,
right: false,
up: false,
punch: false,
kick: false,
special: false
};

canvas.addEventListener('touchstart', (e) => {
e.preventDefault();
const rect = canvas.getBoundingClientRect();
for (let touch of e.touches) {
const x = touch.clientX - rect.left;
const y = touch.clientY - rect.top;
if (x < W / 3) touchControls.left = true;
else if (x < W / 2) touchControls.punch = true;
else if (x < W * 2 / 3) touchControls.kick = true;
else touchControls.special = true;
}
});

canvas.addEventListener('touchend', (e) => {
e.preventDefault();
touchControls.left = false;
touchControls.right = false;
touchControls.up = false;
touchControls.punch = false;
touchControls.kick = false;
touchControls.special = false;
});

// AI logic
function updateAI() {
if (!fightStarted || player2.health <= 0 || player1.health <= 0) return;

const dx = player1.x - player2.x;
const dy = player1.y - player2.y;
const distance = Math.abs(dx);

// Face player
player2.facing = dx > 0 ? 1 : -1;

// Random decision making
const decision = Math.random();

if (player2.stunned || player2.hitTimer > 0) return;

// Approach player
if (distance > 100) {
player2.velocityX = player2.facing * player2.speed * 0.8;
player2.state = 'walking';
} else if (distance < 80) {
// Close range - attack
if (decision < 0.15) {
player2.attack('punch');
} else if (decision < 0.25) {
player2.attack('kick');
} else if (decision < 0.35) {
player2.attack('jab');
} else if (decision < 0.45) {
player2.attack('hook');
} else if (decision < 0.55) {
player2.attack('cross');
} else if (decision < 0.65 && player2.special >= 20) {
player2.attack('throw');
} else if (decision < 0.75 && player2.special >= 30) {
player2.attack('rasengan');
} else {
player2.blocking = true;
setTimeout(() => { player2.blocking = false; }, 500);
}
} else {
// Mid range
if (decision < 0.3) {
player2.velocityX = player2.facing * player2.speed;
player2.state = 'walking';
} else if (decision < 0.4 && player2.grounded) {
player2.velocityY = -player2.jumpPower;
player2.grounded = false;
} else if (decision < 0.5) {
player2.attack('uppercut');
} else if (decision < 0.6 && player2.special >= 30) {
player2.attack('rasengan');
}
}

// Jump over projectiles
if (player1.attacking && player1.attackType === 'rasengan' && distance < 200 && player2.grounded && Math.random() < 0.3) {
player2.velocityY = -player2.jumpPower;
player2.grounded = false;
}
}

// Collision detection
function checkCollision(box1, box2) {
return box1.x < box2.x + box2.width &&
box1.x + box1.width > box2.x &&
box1.y < box2.y + box2.height &&
box1.y + box1.height > box2.y;
}

// Handle attacks
function handleAttacks(attacker, defender) {
if (!attacker.attacking) return;

const attackBox = attacker.getAttackBox();
if (!attackBox) return;

const hitBox = defender.getHitBox();

if (checkCollision(attackBox, hitBox)) {
// Only hit once per attack
if (attacker.attackTimer === attacker.attackDuration - 1) {
defender.takeDamage(attackBox.damage, attacker);
attacker.combo++;
attacker.comboTimer = 60;

if (attacker.combo > 1) {
showCombo(attacker.combo);
}

// Show technique name
showTechnique(attacker.attackType);

// Extra particles for special moves
if (attacker.attackType === 'rasengan' || attacker.attackType === 'throw') {
for (let i = 0; i < 15; i++) {
particles.push({
x: defender.x + defender.width / 2,
y: defender.y + defender.height / 2,
vx: (Math.random() - 0.5) * 15,
vy: (Math.random() - 0.5) * 15,
life: 30,
color: attacker.attackType === 'rasengan' ? '#00ccff' : '#ffcc00',
size: Math.random() * 8 + 3
});
}
}
}
}
}

function showCombo(combo) {
const comboDisplay = document.getElementById('comboDisplay');
comboDisplay.textContent = `${combo} COMBO!`;
comboDisplay.style.display = 'block';
comboDisplay.style.color = combo > 5 ? '#ff0000' : combo > 3 ? '#ff6600' : '#ffcc00';
setTimeout(() => {
comboDisplay.style.display = 'none';
}, 1500);
}

function showTechnique(type) {
const techDisplay = document.getElementById('techniqueDisplay');
const names = {
'punch': '👊 JAB!',
'kick': '🦵 KICK!',
'uppercut': '⬆️ UPPERCUT!',
'rasengan': '🌀 RASENGAN!',
'throw': '🤼 JUDO THROW!',
'jab': '🥊 BOXING JAB!',
'hook': '🥊 HOOK!',
'cross': '🥊 CROSS!'
};
techDisplay.textContent = names[type] || type;
techDisplay.style.display = 'block';
setTimeout(() => {
techDisplay.style.display = 'none';
}, 800);
}

// Update player 1
function updatePlayer1() {
if (!fightStarted || player1.health <= 0 || player2.health <= 0) return;

player1.facing = player2.x > player1.x ? 1 : -1;

// Movement
if (keys['a']) {
player1.velocityX = -player1.speed;
player1.state = 'walking';
}
if (keys['d']) {
player1.velocityX = player1.speed;
player1.state = 'walking';
}

// Jump
if (keys['w'] && player1.grounded) {
player1.velocityY = -player1.jumpPower;
player1.grounded = false;
player1.state = 'jumping';
}

// Attacks
if (keys['j']) {
player1.attack('punch');
keys['j'] = false;
}
if (keys['k']) {
player1.attack('kick');
keys['k'] = false;
}
if (keys['u']) {
player1.attack('uppercut');
keys['u'] = false;
}
if (keys['l']) {
player1.attack('rasengan');
keys['l'] = false;
}
if (keys['i']) {
player1.attack('throw');
keys['i'] = false;
}
if (keys[' ']) {
player1.attack('rasengan');
keys[' '] = false;
}

// Boxing combos
if (keys['j'] && keys['k']) {
player1.attack('hook');
keys['j'] = false;
keys['k'] = false;
}

// Blocking
player1.blocking = keys['s'];

if (!player1.attacking && !player1.blocking) {
player1.state = 'idle';
}
}

// Update player 2 (or AI)
function updatePlayer2() {
if (gameMode === 'ai') {
updateAI();
} else {
// Player 2 controls (arrow keys)
if (!fightStarted || player2.health <= 0 || player1.health <= 0) return;

player2.facing = player1.x > player2.x ? 1 : -1;

if (keys['arrowleft']) {
player2.velocityX = -player2.speed;
player2.state = 'walking';
}
if (keys['arrowright']) {
player2.velocityX = player2.speed;
player2.state = 'walking';
}
if (keys['arrowup'] && player2.grounded) {
player2.velocityY = -player2.jumpPower;
player2.grounded = false;
}
if (keys['1']) { player2.attack('punch'); keys['1'] = false; }
if (keys['2']) { player2.attack('kick'); keys['2'] = false; }
if (keys['3']) { player2.attack('uppercut'); keys['3'] = false; }
if (keys['4']) { player2.attack('rasengan'); keys['4'] = false; }
if (keys['5']) { player2.attack('throw'); keys['5'] = false; }
player2.blocking = keys['arrowdown'];
}
}

// Update particles
function updateParticles() {
particles = particles.filter(p => {
p.x += p.vx;
p.y += p.vy;
p.vy += 0.3;
p.life--;
return p.life > 0;
});
}

// Draw particles
function drawParticles() {
particles.forEach(p => {
ctx.globalAlpha = p.life / 20;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
ctx.fill();
});
ctx.globalAlpha = 1;
}

// Draw background
function drawBackground() {
// Sky gradient
const gradient = ctx.createLinearGradient(0, 0, 0, H);
gradient.addColorStop(0, '#1a1a2e');
gradient.addColorStop(0.5, '#16213e');
gradient.addColorStop(1, '#0f3460');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, W, H);

// Stars
ctx.fillStyle = '#fff';
for (let i = 0; i < 50; i++) {
const x = (i * 137.5) % W;
const y = (i * 73.3) % (H * 0.5);
const size = (Math.sin(Date.now() * 0.001 + i) + 1) * 1.5;
ctx.beginPath();
ctx.arc(x, y, size, 0, Math.PI * 2);
ctx.fill();
}

// Mountains
ctx.fillStyle = '#0a0a1a';
ctx.beginPath();
ctx.moveTo(0, H - 100);
ctx.lineTo(100, H - 200);
ctx.lineTo(200, H - 150);
ctx.lineTo(350, H - 250);
ctx.lineTo(500, H - 180);
ctx.lineTo(650, H - 220);
ctx.lineTo(800, H - 160);
ctx.lineTo(900, H - 190);
ctx.lineTo(900, H);
ctx.lineTo(0, H);
ctx.closePath();
ctx.fill();

// Ground
ctx.fillStyle = '#2a2a3a';
ctx.fillRect(0, H - 50, W, 50);

// Ground line
ctx.strokeStyle = '#4a4a5a';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(0, H - 50);
ctx.lineTo(W, H - 50);
ctx.stroke();

// Dojo markings
ctx.strokeStyle = '#ff6600';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(W / 2, H - 50, 80, Math.PI, 0);
ctx.stroke();

// Naruto symbol on ground
ctx.fillStyle = '#ff6600';
ctx.font = '30px Arial';
ctx.textAlign = 'center';
ctx.fillText('🍥', W / 2, H - 20);
}

// Draw UI
function updateUI() {
document.getElementById('player1Health').style.width = `${player1.health}%`;
document.getElementById('player2Health').style.width = `${player2.health}%`;
document.getElementById('player1Special').style.width = `${player1.special}%`;
document.getElementById('player2Special').style.width = `${player2.special}%`;
document.getElementById('timer').textContent = timer;
}

// Game loop
function gameLoop() {
if (!gameRunning) return;

// Screen shake
if (screenShake > 0) {
ctx.save();
ctx.translate(
(Math.random() - 0.5) * screenShake,
(Math.random() - 0.5) * screenShake
);
screenShake *= 0.9;
if (screenShake < 0.5) screenShake = 0;
}

// Clear
ctx.clearRect(0, 0, W, H);

// Draw background
drawBackground();

// Update fighters
updatePlayer1();
updatePlayer2();
player1.update();
player2.update();

// Handle attacks
handleAttacks(player1, player2);
handleAttacks(player2, player1);

// Draw fighters
player1.draw();
player2.draw();

// Draw particles
updateParticles();
drawParticles();

// Draw shadows
ctx.fillStyle = 'rgba(0,0,0,0.3)';
ctx.beginPath();
ctx.ellipse(player1.x + player1.width / 2, H - 48, 30, 8, 0, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.ellipse(player2.x + player2.width / 2, H - 48, 30, 8, 0, 0, Math.PI * 2);
ctx.fill();

// Restore from screen shake
if (screenShake > 0) {
ctx.restore();
}

// Update UI
updateUI();

// Check win condition
if (player1.health <= 0 || player2.health <= 0) {
endGame();
return;
}

requestAnimationFrame(gameLoop);
}

// Start game
function startGame() {
document.getElementById('startScreen').style.display = 'none';
document.getElementById('gameOverScreen').style.display = 'none';

player1 = new Fighter(150, H - 150, 'NARUTO', '#ff6600', true);
player2 = new Fighter(700, H - 150, 'OPPONENT', '#cc0000', false);
particles = [];
timer = 99;
gameRunning = true;
fightStarted = false;

// Show FIGHT text
const fightText = document.getElementById('fightText');
fightText.style.display = 'block';
setTimeout(() => {
fightText.style.display = 'none';
fightStarted = true;
}, 1500);

// Start timer
if (timerInterval) clearInterval(timerInterval);
timerInterval = setInterval(() => {
if (fightStarted && gameRunning) {
timer--;
document.getElementById('timer').textContent = timer;
if (timer <= 0) {
endGame();
}
}
}, 1000);

gameLoop();
}

// End game
function endGame() {
gameRunning = false;
if (timerInterval) clearInterval(timerInterval);

const winnerText = document.getElementById('winnerText');
if (player1.health <= 0) {
winnerText.textContent = '👊 OPPONENT WINS!';
winnerText.style.color = '#ff0000';
} else if (player2.health <= 0) {
winnerText.textContent = '🍥 NARUTO WINS!';
winnerText.style.color = '#ff6600';
} else {
if (player1.health > player2.health) {
winnerText.textContent = '🍥 NARUTO WINS!';
winnerText.style.color = '#ff6600';
} else if (player2.health > player1.health) {
winnerText.textContent = '👊 OPPONENT WINS!';
winnerText.style.color = '#ff0000';
} else {
winnerText.textContent = '🤝 DRAW!';
winnerText.style.color = '#ffcc00';
}
}

document.getElementById('gameOverScreen').style.display = 'flex';
}

// Restart game
function restartGame() {
startGame();
}

// Select mode
function selectMode(mode) {
gameMode = mode;
document.querySelectorAll('.modeBtn').forEach(btn => {
btn.classList.remove('active');
});
event.target.classList.add('active');
}

// Initial draw
drawBackground();
</script>
</body>
</html>
