<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mini Battle Royale 3D</title>
<style>
  body { margin:0; overflow:hidden; font-family: Arial, sans-serif; background:#000; color:#fff; }
  #info { position:absolute; top:10px; left:10px; z-index:10; background:rgba(0,0,0,.5); padding:10px; border-radius:8px; }
  #crosshair { position:absolute; top:50%; left:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border:2px solid #0f0; border-radius:50%; pointer-events:none; z-index:10; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:#0f0; }
  #crosshair::before { left:8px; top:-6px; width:2px; height:30px; }
  #crosshair::after { top:8px; left:-6px; height:2px; width:30px; }
  #overlay { position:absolute; inset:0; background:rgba(0,0,0,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; text-align:center; padding:20px; }
  #overlay h1 { font-size:48px; margin:0 0 10px; color:#ffcc00; text-shadow:2px 2px 8px #f60; }
  #overlay button { padding:14px 30px; font-size:20px; background:#ffcc00; border:none; border-radius:6px; cursor:pointer; margin-top:18px; font-weight:bold; }
  #overlay button:hover { background:#ffaa00; }
  #hp { width:200px; height:18px; background:#333; border:2px solid #000; border-radius:4px; margin-top:6px; overflow:hidden; }
  #hpFill { height:100%; background:linear-gradient(90deg,#0f0,#cf0); width:100%; transition:width .2s; }
  .stat { margin:4px 0; }
  #hitMark { position:absolute; top:50%; left:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border:4px solid #f00; border-radius:50%; opacity:0; pointer-events:none; z-index:9; }
</style>
</head>
<body>
<div id="overlay">
  <h1>BATTLE ROYALE 3D</h1>
  <p>WASD to move • Mouse to aim • Click to shoot • Shift to sprint • Space to jump</p>
  <p>Survive and eliminate all <b>9 enemies</b> to win!</p>
  <button id="startBtn">DROP IN</button>
</div>
<div id="info" style="display:none">
  <div class="stat">❤️ Health: <span id="hpVal">100</span></div>
  <div id="hp"><div id="hpFill"></div></div>
  <div class="stat">💀 Kills: <span id="kills">0</span> / 9</div>
  <div class="stat">🔫 Ammo: <span id="ammo">30</span></div>
  <div class="stat">👥 Alive: <span id="alive">10</span></div>
</div>
<div id="crosshair" style="display:none"></div>
<div id="hitMark"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

let scene, camera, renderer, controls, clock;
const enemies = [];
const bullets = [];
const obstacles = [];
let player = { hp: 100, kills: 0, ammo: 30, vy: 0, onGround: true };
let keys = {};
let gameActive = false;
let audioCtx;

function playSound(freq, dur, type='square', vol=0.1) {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x88bbdd);
  scene.fog = new THREE.Fog(0x88bbdd, 50, 300);

  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0, 1.7, 0);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // lights
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.position.set(50,100,50); sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-100; sun.shadow.camera.right=100;
  sun.shadow.camera.top=100; sun.shadow.camera.bottom=-100;
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));

  // procedural ground texture
  const cnv = document.createElement('canvas'); cnv.width=cnv.height=512;
  const ctx = cnv.getContext('2d');
  ctx.fillStyle='#4a7c3a'; ctx.fillRect(0,0,512,512);
  for(let i=0;i<3000;i++){
    ctx.fillStyle=`rgba(${30+Math.random()*60},${80+Math.random()*80},${30+Math.random()*60},1)`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 2+Math.random()*4, 2+Math.random()*4);
  }
  const groundTex = new THREE.CanvasTexture(cnv);
  groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
  groundTex.repeat.set(40,40);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    new THREE.MeshLambertMaterial({ map: groundTex })
  );
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
  scene.add(ground);

  // buildings/obstacles
  for (let i=0;i<40;i++){
    const w=3+Math.random()*8, h=3+Math.random()*10, d=3+Math.random()*8;
    const color = new THREE.Color().setHSL(Math.random()*0.1+0.05, 0.4, 0.4+Math.random()*0.2);
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      new THREE.MeshLambertMaterial({ color })
    );
    b.position.set((Math.random()-0.5)*200, h/2, (Math.random()-0.5)*200);
    if (b.position.length()<10) continue;
    b.castShadow = b.receiveShadow = true;
    b.userData.bbox = new THREE.Box3().setFromObject(b);
    scene.add(b); obstacles.push(b);
  }

  // trees
  for (let i=0;i<60;i++){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,3), new THREE.MeshLambertMaterial({color:0x5a3a1a}));
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(2,8,6), new THREE.MeshLambertMaterial({color:0x2d6a2d}));
    leaves.position.y=3;
    const tree = new THREE.Group(); tree.add(trunk); tree.add(leaves);
    tree.position.set((Math.random()-0.5)*240, 1.5, (Math.random()-0.5)*240);
    if (tree.position.length()<8) continue;
    tree.castShadow=true;
    scene.add(tree);
    trunk.userData.bbox = new THREE.Box3().setFromObject(trunk);
    obstacles.push(trunk);
  }

  // enemies
  for (let i=0;i<9;i++) spawnEnemy();

  controls = new PointerLockControls(camera, renderer.domElement);
  scene.add(controls.getObject());
  controls.getObject().position.set(0, 1.7, 0);

  clock = new THREE.Clock();

  document.addEventListener('keydown', e=> keys[e.code]=true);
  document.addEventListener('keyup', e=> keys[e.code]=false);
  document.addEventListener('mousedown', e=>{ if(gameActive && controls.isLocked) shoot(); });
  window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function spawnEnemy() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8,1.4,0.5), new THREE.MeshLambertMaterial({color:0x884422}));
  body.position.y=0.7;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshLambertMaterial({color:0xddaa88}));
  head.position.y=1.7;
  g.add(body); g.add(head);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  let pos;
  do { pos = new THREE.Vector3((Math.random()-0.5)*180, 0, (Math.random()-0.5)*180); } while(pos.length()<20);
  g.position.copy(pos);
  g.userData = { hp:100, alive:true, vel:new THREE.Vector3(), shootCD:Math.random()*3 };
  scene.add(g); enemies.push(g);
}

function shoot() {
  if (player.ammo<=0) { playSound(200,0.05,'square',0.05); return; }
  player.ammo--;
  playSound(800,0.08,'square',0.15);
  playSound(150,0.1,'sawtooth',0.1);

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
  // check enemies
  const targets = [];
  enemies.forEach(e=>{ if(e.userData.alive) e.children.forEach(c=> targets.push({mesh:c,enemy:e})); });
  const meshes = targets.map(t=>t.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length){
    const hit = hits[0];
    const t = targets.find(t=>t.mesh===hit.object);
    if (t) {
      t.enemy.userData.hp -= 35;
      flashHit();
      if (t.enemy.userData.hp<=0){
        t.enemy.userData.alive=false;
        scene.remove(t.enemy);
        player.kills++;
        player.ammo = Math.min(30, player.ammo+10);
        playSound(400,0.3,'triangle',0.2);
      }
    }
  }
  updateHUD();
}

function flashHit() {
  const m = document.getElementById('hitMark');
  m.style.opacity=1;
  setTimeout(()=> m.style.opacity=0, 150);
}

function enemyShoot(e) {
  // bullet from enemy toward player
  const dir = new THREE.Vector3().subVectors(camera.position, e.position).normalize();
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6), new THREE.MeshBasicMaterial({color:0xff3300}));
  b.position.copy(e.position).y += 1.5;
  b.userData = { dir, life:3, fromEnemy:true };
  scene.add(b); bullets.push(b);
  playSound(600,0.06,'square',0.06);
}

function updateHUD(){
  document.getElementById('hpVal').textContent = Math.max(0,Math.floor(player.hp));
  document.getElementById('hpFill').style.width = Math.max(0,player.hp)+'%';
  document.getElementById('kills').textContent = player.kills;
  document.getElementById('ammo').textContent = player.ammo;
  document.getElementById('alive').textContent = 1 + enemies.filter(e=>e.userData.alive).length;
}

function checkCollision(pos, radius=0.5){
  for (const o of obstacles){
    o.userData.bbox.setFromObject(o);
    const bb = o.userData.bbox;
    if (pos.x > bb.min.x-radius && pos.x < bb.max.x+radius &&
        pos.z > bb.min.z-radius && pos.z < bb.max.z+radius &&
        pos.y < bb.max.y) return true;
  }
  return false;
}

function update(dt){
  if (!gameActive) return;
  const obj = controls.getObject();
  const speed = (keys['ShiftLeft']?12:6)*dt;
  const dir = new THREE.Vector3();
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0));

  if (keys['KeyW']) dir.add(fwd);
  if (keys['KeyS']) dir.sub(fwd);
  if (keys['KeyD']) dir.add(right);
  if (keys['KeyA']) dir.sub(right);
  dir.normalize().multiplyScalar(speed);

  const newPos = obj.position.clone().add(dir);
  if (!checkCollision(newPos)) obj.position.copy(newPos);

  // jump
  if (keys['Space'] && player.onGround){ player.vy = 6; player.onGround=false; }
  player.vy -= 15*dt;
  obj.position.y += player.vy*dt;
  if (obj.position.y <= 1.7){ obj.position.y=1.7; player.vy=0; player.onGround=true; }

  // boundary
  obj.position.x = THREE.MathUtils.clamp(obj.position.x,-240,240);
  obj.position.z = THREE.MathUtils.clamp(obj.position.z,-240,240);

  // enemies AI
  enemies.forEach(e=>{
    if (!e.userData.alive) return;
    const toPlayer = new THREE.Vector3().subVectors(camera.position, e.position);
    const dist = toPlayer.length();
    if (dist<60){
      e.lookAt(camera.position.x, e.position.y, camera.position.z);
      if (dist>8){
        toPlayer.y=0; toPlayer.normalize();
        const step = toPlayer.multiplyScalar(2*dt);
        const np = e.position.clone().add(step);
        if (!checkCollision(np)) e.position.copy(np);
      }
      e.userData.shootCD -= dt;
      if (e.userData.shootCD<=0 && dist<40){
        enemyShoot(e); e.userData.shootCD = 1.5+Math.random()*1.5;
      }
    }
  });

  // bullets
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.position.add(b.userData.dir.clone().multiplyScalar(40*dt));
    b.userData.life -= dt;
    if (b.userData.life<=0){ scene.remove(b); bullets.splice(i,1); continue; }
    if (b.userData.fromEnemy && b.position.distanceTo(camera.position)<1){
      player.hp -= 8; flashHit();
      scene.remove(b); bullets.splice(i,1);
      if (player.hp<=0) endGame(false);
      updateHUD();
    }
  }

  // ammo reload
  if (keys['KeyR']) player.ammo = 30;

  if (enemies.every(e=>!e.userData.alive)) endGame(true);
}

function endGame(won){
  gameActive=false;
  controls.unlock();
  const ov = document.getElementById('overlay');
  ov.style.display='flex';
  ov.querySelector('h1').textContent = won? '🏆 WINNER WINNER!' : '☠️ ELIMINATED';
  ov.querySelector('h1').style.color = won? '#ffcc00':'#ff3333';
  const btn = document.getElementById('startBtn');
  btn.textContent = 'PLAY AGAIN';
  btn.onclick = ()=> location.reload();
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene,camera);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').style.display='none';
  document.getElementById('info').style.display='block';
  document.getElementById('crosshair').style.display='block';
  controls.lock();
  gameActive=true;
  updateHUD();
});

init();
animate();
</script>
</body>
</html>
