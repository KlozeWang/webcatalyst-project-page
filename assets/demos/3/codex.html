<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senpai Royal</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: rgba(16, 20, 36, 0.8);
      --text: #f4f7ff;
      --accent: #ff4d8d;
      --accent2: #63e6ff;
      --danger: #ff5c5c;
      --ok: #6bff8a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1b2340 0%, #12172c 60%, #0d1120 100%);
      cursor: crosshair;
    }
    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #topBar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 8px 12px;
      backdrop-filter: blur(4px);
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 1px 1px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    #healthWrap {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: min(360px, 55vw);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 8px;
    }
    #healthBar {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
    }
    #healthFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff4f72, #ff8a5b);
      transition: width 0.1s linear;
    }
    #healthText {
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.95;
    }
    #killFeed {
      position: absolute;
      right: 12px;
      top: 56px;
      width: min(320px, 42vw);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }
    .feedItem {
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #centerScreen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    #card {
      pointer-events: auto;
      background: rgba(12,16,28,0.9);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      width: min(540px, 90vw);
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 6vw, 58px);
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 8px 30px rgba(255,77,141,0.35);
    }
    .sub {
      margin: 0 0 16px;
      opacity: 0.9;
      line-height: 1.45;
    }
    .controls {
      font-size: 14px;
      opacity: 0.95;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: linear-gradient(90deg, var(--accent), #ff7eb5);
      color: white;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(255,77,141,0.35);
    }
    button:hover { filter: brightness(1.08); }
    #stormWarn {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffd3d3;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 10px;
      border: 1px solid rgba(255,100,100,0.5);
      border-radius: 9px;
      background: rgba(120,0,0,0.35);
      display: none;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255,0,0,0.45);
    }
    #crosshair {
      position: absolute;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="overlay">
    <div id="topBar">
      <div class="panel" id="leftInfo">Senpai Royal</div>
      <div class="panel" id="rightInfo">Players: 0</div>
    </div>

    <div id="stormWarn">⚠ Outside the safe zone!</div>

    <div id="killFeed"></div>

    <div id="healthWrap">
      <div id="healthBar"><div id="healthFill"></div></div>
      <div id="healthText">HP: 100</div>
    </div>

    <div id="centerScreen">
      <div id="card">
        <h1>Senpai Royal</h1>
        <p class="sub">Drop in. Survive the shrinking zone. Become the last Senpai standing.</p>
        <p class="controls">
          <b>Move:</b> WASD / Arrow Keys &nbsp;•&nbsp;
          <b>Aim:</b> Mouse &nbsp;•&nbsp;
          <b>Shoot:</b> Left Click / Space<br />
          <b>Heal:</b> Pick up pink medkits
        </p>
        <button id="playBtn">DROP IN</button>
      </div>
    </div>

    <div id="crosshair"></div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      const playBtn = document.getElementById("playBtn");
      const card = document.getElementById("card");
      const centerScreen = document.getElementById("centerScreen");
      const leftInfo = document.getElementById("leftInfo");
      const rightInfo = document.getElementById("rightInfo");
      const healthFill = document.getElementById("healthFill");
      const healthText = document.getElementById("healthText");
      const killFeed = document.getElementById("killFeed");
      const stormWarn = document.getElementById("stormWarn");
      const crosshair = document.getElementById("crosshair");

      let w = innerWidth, h = innerHeight;
      function resize() {
        w = innerWidth; h = innerHeight;
        canvas.width = Math.floor(w * devicePixelRatio);
        canvas.height = Math.floor(h * devicePixelRatio);
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      addEventListener("resize", resize);
      resize();

      const WORLD = 3200;
      const START_RADIUS = 1350;
      const END_RADIUS = 140;
      const MATCH_TIME = 220;
      const STORM_DPS = 9;

      const keys = {};
      const mouse = { x: w/2, y: h/2, down: false };
      let shootHeldBySpace = false;

      addEventListener("keydown", e => {
        keys[e.key.toLowerCase()] = true;
        if (e.code === "Space") { shootHeldBySpace = true; e.preventDefault(); }
      });
      addEventListener("keyup", e => {
        keys[e.key.toLowerCase()] = false;
        if (e.code === "Space") shootHeldBySpace = false;
      });
      addEventListener("mousemove", e => {
        mouse.x = e.clientX; mouse.y = e.clientY;
        crosshair.style.left = mouse.x + "px";
        crosshair.style.top = mouse.y + "px";
      });
      addEventListener("mousedown", (e) => { if (e.button === 0) mouse.down = true; });
      addEventListener("mouseup", (e) => { if (e.button === 0) mouse.down = false; });

      let state = "menu";
      let tPrev = performance.now();
      let gameTime = 0;

      let player, bots, bullets, medkits, obstacles, feed;
      let zoneStart, zoneEnd;
      let camera = { x: WORLD/2, y: WORLD/2 };
      let winnerText = "";

      const names = [
        "KawaiiKiller","TsundereSniper","NekoRush","YandereByte","MochiBlaster","FoxMask",
        "SushiStorm","PixelRonin","AoiBlade","SakuraRush","MangaMarauder","MoonSenpai",
        "BentoBoom","NightOtaku","RamenRaider","KitsuneVolt","HikariDash","ChibiChaos",
        "SenkoFire","KumaStrike","TeaTime","KanpaiShot","NinjaPocky","AkiraAim","ZenArc"
      ];

      function rnd(a,b){ return Math.random()*(b-a)+a; }
      function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
      function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
      function ang(ax,ay,bx,by){ return Math.atan2(by-ay,bx-ax); }

      function spawnActor(x,y,isPlayer,name) {
        return {
          x,y,vx:0,vy:0,r: isPlayer ? 16 : 14,
          hp:100,maxHp:100,alive:true,
          speed: isPlayer ? 235 : rnd(175,210),
          cooldown: 0,
          fireRate: isPlayer ? 0.14 : rnd(0.24,0.42),
          bulletSpeed: isPlayer ? 760 : rnd(620,700),
          bulletDmg: isPlayer ? 16 : 11,
          color: isPlayer ? "#63e6ff" : "#ff6ea8",
          name,
          kills:0,
          aiTimer:0, wanderDir:rnd(-Math.PI,Math.PI),
          target:null
        };
      }

      function initGame() {
        gameTime = 0;
        winnerText = "";
        feed = [];
        bullets = [];
        medkits = [];
        obstacles = [];
        bots = [];

        const pSpawn = {x:rnd(500,WORLD-500), y:rnd(500,WORLD-500)};
        player = spawnActor(pSpawn.x,pSpawn.y,true,"You");
        camera.x = player.x; camera.y = player.y;

        const used = new Set();
        for (let i=0;i<24;i++) {
          let nx, ny;
          do {
            nx = rnd(200, WORLD-200);
            ny = rnd(200, WORLD-200);
          } while (Math.hypot(nx-player.x, ny-player.y) < 360);

          let nm;
          do { nm = names[(Math.random()*names.length)|0] + (Math.random()<0.18 ? ("#" + ((Math.random()*99)|0)) : ""); }
          while (used.has(nm));
          used.add(nm);

          bots.push(spawnActor(nx, ny, false, nm));
        }

        for(let i=0;i<65;i++){
          obstacles.push({
            x:rnd(120,WORLD-120), y:rnd(120,WORLD-120),
            r:rnd(24,58),
            type: Math.random()<0.6 ? "tree":"rock"
          });
        }

        for(let i=0;i<24;i++){
          medkits.push({x:rnd(100,WORLD-100), y:rnd(100,WORLD-100), r:10, val:28, alive:true});
        }

        zoneStart = { x: WORLD/2 + rnd(-260,260), y: WORLD/2 + rnd(-260,260), r: START_RADIUS };
        zoneEnd   = { x: WORLD/2 + rnd(-740,740), y: WORLD/2 + rnd(-740,740), r: END_RADIUS };
      }

      function addFeed(txt){
        feed.unshift({txt, ttl: 5.0});
        if(feed.length>6) feed.pop();
      }

      function currentZone(){
        const t = clamp(gameTime/MATCH_TIME,0,1);
        const ease = t*t*(3-2*t);
        return {
          x: zoneStart.x + (zoneEnd.x-zoneStart.x)*ease,
          y: zoneStart.y + (zoneEnd.y-zoneStart.y)*ease,
          r: zoneStart.r + (zoneEnd.r-zoneStart.r)*ease
        };
      }

      function collidesObstacle(ent){
        for(const o of obstacles){
          const dx = ent.x - o.x, dy = ent.y - o.y;
          const min = ent.r + o.r;
          const d2 = dx*dx + dy*dy;
          if(d2 < min*min){
            const d = Math.sqrt(d2) || 0.001;
            const push = (min - d) + 0.2;
            ent.x += (dx/d)*push;
            ent.y += (dy/d)*push;
          }
        }
      }

      function moveEntity(ent, dx, dy, dt){
        ent.x += dx * dt;
        ent.y += dy * dt;
        ent.x = clamp(ent.x, ent.r, WORLD-ent.r);
        ent.y = clamp(ent.y, ent.r, WORLD-ent.r);
        collidesObstacle(ent);
      }

      function shoot(shooter, angle, spread = 0){
        if (!shooter.alive) return;
        if (shooter.cooldown > 0) return;
        shooter.cooldown = shooter.fireRate;
        const a = angle + rnd(-spread, spread);
        bullets.push({
          x: shooter.x + Math.cos(a)*(shooter.r+5),
          y: shooter.y + Math.sin(a)*(shooter.r+5),
          vx: Math.cos(a)*shooter.bulletSpeed,
          vy: Math.sin(a)*shooter.bulletSpeed,
          r: 3.2,
          life: 1.3,
          dmg: shooter.bulletDmg,
          owner: shooter
        });
      }

      function damage(victim, amount, attacker){
        if(!victim.alive) return;
        victim.hp -= amount;
        if(victim.hp <= 0){
          victim.hp = 0;
          victim.alive = false;
          if(attacker && attacker !== victim){
            attacker.kills++;
            addFeed(`${attacker.name} eliminated ${victim.name}`);
          } else addFeed(`${victim.name} was eliminated`);
          if(Math.random() < 0.68){
            medkits.push({x:victim.x+rnd(-18,18), y:victim.y+rnd(-18,18), r:10, val:30, alive:true});
          }
        }
      }

      function livingActors() {
        const arr = [];
        if(player.alive) arr.push(player);
        for(const b of bots) if(b.alive) arr.push(b);
        return arr;
      }

      function updateBots(dt, zone){
        const actors = livingActors();
        for(const b of bots){
          if(!b.alive) continue;
          b.cooldown = Math.max(0, b.cooldown-dt);
          b.aiTimer -= dt;
          if(b.aiTimer <= 0){
            b.aiTimer = rnd(0.2,0.5);
            let best = null, bd = Infinity;
            for(const a of actors){
              if(a===b || !a.alive) continue;
              const d = dist(a,b);
              if(d < bd){ bd = d; best = a; }
            }
            b.target = best;
            b.wanderDir += rnd(-0.7,0.7);
          }

          let mx=0, my=0;
          const dz = Math.hypot(b.x-zone.x, b.y-zone.y);
          if(dz > zone.r - 40){
            const a = ang(b.x,b.y,zone.x,zone.y);
            mx += Math.cos(a)*1.3;
            my += Math.sin(a)*1.3;
          }

          if(b.target && b.target.alive){
            const d = dist(b,b.target);
            const a = ang(b.x,b.y,b.target.x,b.target.y);
            if(d > 210){ mx += Math.cos(a); my += Math.sin(a); }
            if(d < 140){ mx -= Math.cos(a)*0.8; my -= Math.sin(a)*0.8; }
            if(d < 470){
              shoot(b, a, 0.16);
            }
          } else {
            mx += Math.cos(b.wanderDir)*0.5;
            my += Math.sin(b.wanderDir)*0.5;
          }

          const m = Math.hypot(mx,my)||1;
          moveEntity(b, (mx/m)*b.speed, (my/m)*b.speed, dt);
        }
      }

      function update(dt){
        if(state !== "playing") return;
        gameTime += dt;

        const zone = currentZone();

        // Player move
        if(player.alive){
          let mx = 0, my = 0;
          if(keys["w"] || keys["arrowup"]) my -= 1;
          if(keys["s"] || keys["arrowdown"]) my += 1;
          if(keys["a"] || keys["arrowleft"]) mx -= 1;
          if(keys["d"] || keys["arrowright"]) mx += 1;
          const m = Math.hypot(mx,my) || 1;
          moveEntity(player, (mx/m)*player.speed, (my/m)*player.speed, dt);
          player.cooldown = Math.max(0, player.cooldown-dt);

          const aimX = player.x + (mouse.x - w/2);
          const aimY = player.y + (mouse.y - h/2);
          if(mouse.down || shootHeldBySpace){
            shoot(player, ang(player.x,player.y,aimX,aimY), 0.05);
          }

          const dToZone = Math.hypot(player.x-zone.x, player.y-zone.y);
          if(dToZone > zone.r){
            damage(player, STORM_DPS*dt, null);
          }

          for(const m of medkits){
            if(!m.alive) continue;
            if(Math.hypot(player.x-m.x, player.y-m.y) < player.r + m.r + 4){
              m.alive = false;
              player.hp = Math.min(player.maxHp, player.hp + m.val);
            }
          }
        }

        updateBots(dt, zone);

        // Storm damage + medkits for bots
        for(const b of bots){
          if(!b.alive) continue;
          const dToZone = Math.hypot(b.x-zone.x, b.y-zone.y);
          if(dToZone > zone.r) damage(b, STORM_DPS*0.85*dt, null);

          for(const m of medkits){
            if(!m.alive) continue;
            if(Math.hypot(b.x-m.x, b.y-m.y) < b.r + m.r + 3 && b.hp < 90){
              m.alive = false;
              b.hp = Math.min(b.maxHp, b.hp + m.val);
              break;
            }
          }
        }

        // Bullets
        for(let i=bullets.length-1;i>=0;i--){
          const bl = bullets[i];
          bl.life -= dt;
          if(bl.life <= 0){ bullets.splice(i,1); continue; }
          bl.x += bl.vx*dt;
          bl.y += bl.vy*dt;
          if(bl.x < 0 || bl.y < 0 || bl.x > WORLD || bl.y > WORLD){ bullets.splice(i,1); continue; }

          let hitObstacle = false;
          for(const o of obstacles){
            if(Math.hypot(bl.x-o.x, bl.y-o.y) < o.r + bl.r){
              hitObstacle = true; break;
            }
          }
          if(hitObstacle){ bullets.splice(i,1); continue; }

          const candidates = [player, ...bots];
          for(const a of candidates){
            if(!a.alive || a === bl.owner) continue;
            if(Math.hypot(bl.x-a.x, bl.y-a.y) < a.r + bl.r){
              damage(a, bl.dmg, bl.owner);
              bullets.splice(i,1);
              break;
            }
          }
        }

        // feed ttl
        for(let i=feed.length-1;i>=0;i--){
          feed[i].ttl -= dt;
          if(feed[i].ttl <= 0) feed.splice(i,1);
        }

        // camera
        camera.x += (player.x - camera.x) * Math.min(1, dt*10);
        camera.y += (player.y - camera.y) * Math.min(1, dt*10);

        // Win/Lose
        const aliveCount = livingActors().length;
        if(state==="playing"){
          if(!player.alive){
            state = "over";
            winnerText = "You were eliminated!";
            showEnd("DEFEAT", `Placement: #${aliveCount+1}`);
          } else if(aliveCount === 1 && player.alive){
            state = "over";
            winnerText = "You are the last Senpai standing!";
            showEnd("VICTORY", `Kills: ${player.kills}`);
          }
        }

        // UI update
        healthFill.style.width = `${(player.hp/player.maxHp)*100}%`;
        healthText.textContent = `HP: ${Math.ceil(player.hp)}   •   Kills: ${player.kills}`;
        rightInfo.textContent = `Players Left: ${aliveCount}`;
        leftInfo.textContent = `Senpai Royal • Zone ${Math.max(0, Math.ceil(MATCH_TIME - gameTime))}s`;
        stormWarn.style.display = (Math.hypot(player.x-zone.x, player.y-zone.y) > zone.r && player.alive) ? "block" : "none";

        killFeed.innerHTML = "";
        for(const f of feed){
          const d = document.createElement("div");
          d.className = "feedItem";
          d.textContent = f.txt;
          killFeed.appendChild(d);
        }
      }

      function drawGrid(){
        const step = 120;
        ctx.strokeStyle = "rgba(255,255,255,0.045)";
        ctx.lineWidth = 1;
        const startX = Math.floor((camera.x - w/2) / step) * step;
        const endX = Math.ceil((camera.x + w/2) / step) * step;
        const startY = Math.floor((camera.y - h/2) / step) * step;
        const endY = Math.ceil((camera.y + h/2) / step) * step;
        ctx.beginPath();
        for(let x=startX; x<=endX; x+=step){ ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
        for(let y=startY; y<=endY; y+=step){ ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
        ctx.stroke();
      }

      function drawEntity(a){
        if(!a.alive) return;
        // body
        ctx.fillStyle = a.color;
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();

        // outline
        ctx.strokeStyle = "rgba(0,0,0,0.45)";
        ctx.lineWidth = 2;
        ctx.stroke();

        // HP bar
        const bw = 28, bh = 4;
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(a.x-bw/2, a.y-a.r-13, bw, bh);
        ctx.fillStyle = a===player ? "#71ffcd" : "#ffc1d9";
        ctx.fillRect(a.x-bw/2, a.y-a.r-13, bw*(a.hp/a.maxHp), bh);

        // name
        ctx.font = "11px Inter, Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        if(a !== player) ctx.fillText(a.name, a.x, a.y-a.r-18);
      }

      function renderMinimap(zone){
        const mw = 152, mh = 152;
        const px = w - mw - 14;
        const py = h - mh - 14;
        ctx.save();
        ctx.resetTransform();
        ctx.fillStyle = "rgba(10,12,22,0.72)";
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 1;
        roundRect(px,py,mw,mh,10,true,true);

        const sx = mw / WORLD, sy = mh / WORLD;
        // zone
        ctx.strokeStyle = "rgba(99,230,255,0.9)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(px + zone.x*sx, py + zone.y*sy, zone.r*sx, 0, Math.PI*2);
        ctx.stroke();

        // player
        if(player.alive){
          ctx.fillStyle = "#63e6ff";
          ctx.beginPath();
          ctx.arc(px + player.x*sx, py + player.y*sy, 3.3,0,Math.PI*2);
          ctx.fill();
        }
        // bots
        ctx.fillStyle = "rgba(255,110,168,0.8)";
        for(const b of bots){
          if(!b.alive) continue;
          ctx.fillRect(px + b.x*sx - 1, py + b.y*sy - 1, 2, 2);
        }

        ctx.restore();
      }

      function roundRect(x,y,w,h,r,fill,stroke){
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.arcTo(x+w,y,x+w,y+h,r);
        ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);
        ctx.arcTo(x,y,x+w,y,r);
        if(fill) ctx.fill();
        if(stroke) ctx.stroke();
      }

      function render(){
        ctx.clearRect(0,0,w,h);

        if(state === "menu"){
          return;
        }

        const zone = currentZone();

        ctx.save();
        ctx.translate(w/2 - camera.x, h/2 - camera.y);

        // map bounds
        ctx.fillStyle = "rgba(255,255,255,0.02)";
        ctx.fillRect(0,0,WORLD,WORLD);

        drawGrid();

        // dark storm overlay around safe zone
        ctx.save();
        ctx.fillStyle = "rgba(84, 12, 36, 0.24)";
        ctx.beginPath();
        ctx.rect(camera.x-w, camera.y-h, w*2, h*2);
        ctx.arc(zone.x, zone.y, zone.r, 0, Math.PI*2, true);
        ctx.fill("evenodd");
        ctx.restore();

        // obstacles
        for(const o of obstacles){
          if(o.type==="tree"){
            ctx.fillStyle = "#1f7a58";
            ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = "#2aa876";
            ctx.beginPath(); ctx.arc(o.x-6,o.y-8,o.r*0.55,0,Math.PI*2); ctx.fill();
          } else {
            ctx.fillStyle = "#5a6278";
            ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.18)";
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }

        // medkits
        for(const m of medkits){
          if(!m.alive) continue;
          ctx.fillStyle = "#ff89bd";
          ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.fillRect(m.x-2,m.y-6,4,12);
          ctx.fillRect(m.x-6,m.y-2,12,4);
        }

        // zone ring
        ctx.strokeStyle = "rgba(99,230,255,0.95)";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2); ctx.stroke();

        // bullets
        for(const b of bullets){
          ctx.fillStyle = b.owner===player ? "#9bf2ff" : "#ffb3d0";
          ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
        }

        // entities
        for(const b of bots) drawEntity(b);
        drawEntity(player);

        // aim line
        if(player.alive){
          const ax = player.x + (mouse.x - w/2);
          const ay = player.y + (mouse.y - h/2);
          const a = ang(player.x,player.y,ax,ay);
          ctx.strokeStyle = "rgba(99,230,255,0.45)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(player.x,player.y);
          ctx.lineTo(player.x + Math.cos(a)*28, player.y + Math.sin(a)*28);
          ctx.stroke();
        }

        ctx.restore();

        renderMinimap(zone);

        if(state === "over"){
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.fillRect(0,0,w,h);
          ctx.restore();
        }
      }

      function showEnd(title, subtitle){
        centerScreen.style.display = "grid";
        card.innerHTML = `
          <h1 style="font-size:clamp(28px,5vw,48px);margin-bottom:8px;">${title}</h1>
          <p class="sub">${winnerText}</p>
          <p class="controls">${subtitle}<br/>Press <b>DROP IN</b> to play again.</p>
          <button id="playBtn2">DROP IN AGAIN</button>
        `;
        const b = document.getElementById("playBtn2");
        b.onclick = () => startGame();
      }

      function startGame(){
        initGame();
        state = "playing";
        centerScreen.style.display = "none";
      }

      playBtn.onclick = () => startGame();

      function loop(tNow){
        const dt = Math.min(0.033, (tNow - tPrev) / 1000);
        tPrev = tNow;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
