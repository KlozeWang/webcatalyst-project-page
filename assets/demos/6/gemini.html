<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80s Arcade Tic-Tac-Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #FF1493;
            --neon-yellow: #FFFF00;
            --neon-cyan: #00FFFF;
            --neon-green: #39FF14;
            --bg-color: #050505;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Scanline effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .neon-title {
            color: var(--neon-cyan);
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan), 0 0 80px var(--neon-cyan);
            animation: pulsate 1.5s infinite alternate;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .neon-status {
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green);
            margin-bottom: 2rem;
            height: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background-color: var(--neon-cyan);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            position: relative;
            z-index: 10;
        }

        .cell {
            width: 80px;
            height: 80px;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        @media (min-width: 640px) {
            .cell {
                width: 120px;
                height: 120px;
                font-size: 5rem;
            }
        }

        .cell:hover:empty {
            background-color: #111;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }

        .player-x {
            color: var(--neon-pink);
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .player-o {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-yellow), 0 0 40px var(--neon-yellow);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .win-cell {
            animation: blink 0.5s infinite alternate;
        }

        .btn {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            text-transform: uppercase;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
        }

        #start-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        @keyframes pulsate {
            100% {
                text-shadow: 0 0 4px #fff, 0 0 11px #fff, 0 0 19px var(--neon-cyan), 0 0 40px var(--neon-cyan), 0 0 80px var(--neon-cyan);
            }
            0% {
                text-shadow: 0 0 2px #fff, 0 0 4px #fff, 0 0 6px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 45px var(--neon-cyan);
            }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes blink {
            0% { opacity: 1; background-color: rgba(255,255,255,0.2); }
            100% { opacity: 0.2; background-color: transparent; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 class="text-3xl md:text-5xl neon-title">TIC<br>TAC<br>TOE</h1>
        <p class="text-sm md:text-base text-gray-400 mb-8 mt-4 text-center px-4">INSERT COIN TO PLAY</p>
        <button id="start-btn" class="btn text-xl">START GAME</button>
    </div>

    <h1 class="text-2xl md:text-4xl neon-title hidden md:block">ARCADE TIC-TAC-TOE</h1>
    
    <div id="status" class="neon-status text-sm md:text-xl">PLAYER X TURN</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button id="reset-btn" class="btn text-sm md:text-base" style="display: none;">PLAY AGAIN</button>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('reset-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = false;
        
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // Web Audio API Context
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'moveX') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'moveO') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(660, audioCtx.currentTime); // E5
                oscillator.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                oscillator.type = 'sawtooth';
                const now = audioCtx.currentTime;
                oscillator.frequency.setValueAtTime(440, now);
                oscillator.frequency.setValueAtTime(554.37, now + 0.1); // C#
                oscillator.frequency.setValueAtTime(659.25, now + 0.2); // E
                oscillator.frequency.setValueAtTime(880, now + 0.3); // A
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
                oscillator.start();
                oscillator.stop(now + 0.6);
            } else if (type === 'draw') {
                oscillator.type = 'triangle';
                const now = audioCtx.currentTime;
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.linearRampToValueAtTime(100, now + 0.5);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                oscillator.start();
                oscillator.stop(now + 0.5);
            }
        }

        function handleCellClick(e) {
            const cell = e.target;
            const index = cell.getAttribute('data-index');

            if (board[index] !== '' || !gameActive) return;

            updateCell(cell, index);
            checkWinner();
        }

        function updateCell(cell, index) {
            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            
            if (currentPlayer === 'X') {
                cell.classList.add('player-x');
                playSound('moveX');
            } else {
                cell.classList.add('player-o');
                playSound('moveO');
            }
        }

        function changePlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusText.textContent = `PLAYER ${currentPlayer} TURN`;
            
            // Adjust color of status based on player
            if(currentPlayer === 'X') {
                statusText.style.color = 'var(--neon-pink)';
                statusText.style.textShadow = '0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink)';
            } else {
                statusText.style.color = 'var(--neon-yellow)';
                statusText.style.textShadow = '0 0 5px var(--neon-yellow), 0 0 10px var(--neon-yellow)';
            }
        }

        function checkWinner() {
            let roundWon = false;
            let winningCells = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningCells = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `PLAYER ${currentPlayer} WINS!`;
                statusText.style.color = 'var(--neon-green)';
                statusText.style.textShadow = '0 0 5px var(--neon-green), 0 0 10px var(--neon-green), 0 0 20px var(--neon-green)';
                gameActive = false;
                playSound('win');
                resetBtn.style.display = 'block';
                
                // Highlight winning cells
                winningCells.forEach(index => {
                    cells[index].classList.add('win-cell');
                });
                return;
            }

            if (!board.includes('')) {
                statusText.textContent = 'DRAW!';
                statusText.style.color = 'white';
                statusText.style.textShadow = '0 0 5px white, 0 0 10px white';
                gameActive = false;
                playSound('draw');
                resetBtn.style.display = 'block';
                return;
            }

            changePlayer();
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            statusText.textContent = `PLAYER X TURN`;
            statusText.style.color = 'var(--neon-pink)';
            statusText.style.textShadow = '0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink)';
            resetBtn.style.display = 'none';

            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell'; // Reset classes
            });
        }

        startBtn.addEventListener('click', () => {
            initAudio();
            startScreen.style.display = 'none';
            resetGame();
        });

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', resetGame);

    </script>
</body>
</html>
