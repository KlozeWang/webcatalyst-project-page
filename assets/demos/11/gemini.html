<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow of Time: Echo Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050508; overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #e0e0e0;
            touch-action: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        canvas {
            display: block; width: 100%; height: 100%;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, rgba(5,5,8,0.8) 0%, rgba(0,0,0,1) 100%);
            z-index: 10; transition: opacity 0.5s;
        }

        h1 { font-family: 'Cinzel', serif; text-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
        
        .cinematic-bars::before, .cinematic-bars::after {
            content: ''; position: absolute; left: 0; width: 100%; height: 8vh;
            background: black; z-index: 5; pointer-events: none;
        }
        .cinematic-bars::before { top: 0; }
        .cinematic-bars::after { bottom: 0; }

        .btn {
            background: transparent; border: 1px solid #0ff; color: #0ff;
            padding: 10px 30px; margin: 10px; font-size: 1.2rem; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .btn:hover { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }

        /* CRT/Vignette Effect */
        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 4; pointer-events: none; opacity: 0.4;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: 0 0 200px rgba(0,0,0,0.9) inset; z-index: 4; pointer-events: none;
        }

        #ui-layer {
            position: absolute; top: 10vh; left: 20px; z-index: 5; pointer-events: none;
            text-shadow: 0 0 5px #0ff;
        }

        #mobile-controls {
            position: absolute; bottom: 10vh; left: 0; width: 100%; display: none;
            justify-content: space-between; padding: 0 20px; z-index: 20; box-sizing: border-box;
        }
        .d-pad, .action-pad { display: flex; gap: 10px; }
        .m-btn {
            width: 60px; height: 60px; background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.5); border-radius: 50%;
            color: #0ff; font-weight: bold; display: flex; justify-content: center; align-items: center;
            user-select: none;
        }
        .m-btn:active { background: rgba(0, 255, 255, 0.4); }

        @media (max-width: 768px) { #mobile-controls { display: flex; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container" class="cinematic-bars">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div id="crt-overlay"></div>
    <div id="vignette"></div>

    <div id="ui-layer">
        <div id="level-display" class="text-xl font-bold tracking-widest text-cyan-400">LEVEL 1</div>
        <div id="instruction-display" class="text-sm mt-2 text-gray-400">W,A,S,D to move. SPACE to jump.</div>
        <div id="clone-display" class="text-sm mt-1 text-purple-400 hidden">SHIFT to create Echo. Shadows follow past actions.</div>
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div class="m-btn" id="btn-left">←</div>
            <div class="m-btn" id="btn-right">→</div>
        </div>
        <div class="action-pad">
            <div class="m-btn" id="btn-clone" style="border-color:#a855f7; color:#a855f7;">ECHO</div>
            <div class="m-btn" id="btn-jump">↑</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1 class="text-6xl mb-4 text-center">SHADOW OF TIME<br><span class="text-3xl text-cyan-500 tracking-widest">ECHO RUNNER</span></h1>
        <p class="mb-8 text-gray-400 italic text-center max-w-md">You are caught in a fractured timeline. Your past actions are the key to your future.</p>
        <button class="btn" id="start-btn">Enter the Void</button>
        <p class="mt-4 text-xs text-gray-600">Sound ON recommended</p>
    </div>

    <!-- Transition Screen -->
    <div id="transition-screen" class="overlay hidden bg-black">
        <h2 id="transition-text" class="text-4xl font-serif text-cyan-400 tracking-widest"></h2>
    </div>
</div>

<script>
/**
 * Audio Engine - Web Audio API
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const SoundEngine = {
    init: function() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        this.playAmbience();
    },
    playTone: function(freq, type, duration, vol, sweep) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (sweep) osc.frequency.exponentialRampToValueAtTime(sweep, audioCtx.currentTime + duration);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    },
    jump: () => SoundEngine.playTone(150, 'sine', 0.3, 0.1, 300),
    land: () => SoundEngine.playTone(50, 'square', 0.1, 0.05),
    echo: () => SoundEngine.playTone(400, 'sine', 1.0, 0.1, 100),
    buttonPress: () => SoundEngine.playTone(600, 'triangle', 0.2, 0.1),
    goal: () => {
        SoundEngine.playTone(440, 'sine', 1, 0.1);
        setTimeout(() => SoundEngine.playTone(554, 'sine', 1, 0.1), 100);
        setTimeout(() => SoundEngine.playTone(659, 'sine', 2, 0.1), 200);
    },
    death: () => SoundEngine.playTone(100, 'sawtooth', 0.5, 0.2, 20),
    playAmbience: function() {
        if(this.bgmOsc) return;
        this.bgmOsc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        this.bgmOsc.type = 'sine';
        this.bgmOsc.frequency.value = 55; // Deep drone
        gain.gain.value = 0.02;
        
        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.1;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 5;
        lfo.connect(lfoGain);
        lfoGain.connect(this.bgmOsc.frequency);
        
        this.bgmOsc.connect(gain);
        gain.connect(audioCtx.destination);
        this.bgmOsc.start();
        lfo.start();
    }
};

/**
 * Game Engine & Logic
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let GAME_WIDTH = 1280;
let GAME_HEIGHT = 720;

// Input Handling
const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
window.addEventListener('keydown', (e) => {
    if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
    if(e.code === 'Space') keys.space = true;
    if(e.code === 'ShiftLeft' || e.code === 'KeyE') {
        if(!keys.shift && Game.state === 'PLAYING') Game.createEcho();
        keys.shift = true;
    }
});
window.addEventListener('keyup', (e) => {
    if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
    if(e.code === 'Space') keys.space = false;
    if(e.code === 'ShiftLeft' || e.code === 'KeyE') keys.shift = false;
});

// Mobile Controls
const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; 
        if(key==='shift' && Game.state === 'PLAYING') Game.createEcho();
    });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
};
bindTouch('btn-left', 'a'); bindTouch('btn-right', 'd'); bindTouch('btn-jump', 'space'); bindTouch('btn-clone', 'shift');

// Utility Collision
function AABB(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

// Entities
class Player {
    constructor(x, y) {
        this.startX = x; this.startY = y;
        this.w = 20; this.h = 40;
        this.reset();
        this.color = '#0ff';
        this.shadowColor = 'rgba(0, 255, 255, 0.5)';
        this.particles = [];
    }
    reset() {
        this.x = this.startX; this.y = this.startY;
        this.vx = 0; this.vy = 0;
        this.speed = 5; this.jumpForce = -12;
        this.grounded = false;
    }
    update(level) {
        // Horizontal Movement
        if (keys.a) this.vx -= 1;
        if (keys.d) this.vx += 1;
        this.vx *= 0.8; // Friction

        this.x += this.vx;
        this.checkCollisions(level, true);

        // Vertical Movement (Gravity)
        this.vy += 0.6; // Gravity
        if (this.vy > 15) this.vy = 15; // Terminal velocity
        
        if ((keys.w || keys.space) && this.grounded) {
            this.vy = this.jumpForce;
            this.grounded = false;
            SoundEngine.jump();
            this.createDust();
        }

        this.y += this.vy;
        this.grounded = false;
        this.checkCollisions(level, false);

        // Particles
        this.particles.forEach((p, i) => {
            p.life--; p.y -= 1; p.alpha -= 0.05;
            if (p.life <= 0) this.particles.splice(i, 1);
        });

        // Death bounds
        if (this.y > GAME_HEIGHT) Game.death();
    }
    checkCollisions(level, isHorizontal) {
        const bounds = { x: this.x, y: this.y, w: this.w, h: this.h };
        for (let wall of level.walls) {
            if (wall.active !== false && AABB(bounds, wall)) {
                if (isHorizontal) {
                    if (this.vx > 0) this.x = wall.x - this.w;
                    else if (this.vx < 0) this.x = wall.x + wall.w;
                    this.vx = 0;
                } else {
                    if (this.vy > 0) {
                        this.y = wall.y - this.h;
                        if (!this.grounded && this.vy > 5) {
                            SoundEngine.land();
                            this.createDust();
                        }
                        this.grounded = true;
                    }
                    else if (this.vy < 0) this.y = wall.y + wall.h;
                    this.vy = 0;
                }
                bounds.x = this.x; bounds.y = this.y;
            }
        }
    }
    createDust() {
        for(let i=0; i<5; i++) {
            this.particles.push({
                x: this.x + Math.random() * this.w, y: this.y + this.h,
                life: 20, alpha: 0.5, size: Math.random() * 3 + 1
            });
        }
    }
    draw(ctx) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.shadowBlur = 0;

        ctx.fillStyle = `rgba(255,255,255,0.8)`;
        ctx.fillRect(this.x + (this.vx>0?12:this.vx<0?4:8), this.y + 10, 4, 4);

        this.particles.forEach(p => {
            ctx.fillStyle = `rgba(0, 255, 255, ${p.alpha})`;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
    }
}

class Echo {
    constructor(recordData) {
        this.data = recordData;
        this.frame = 0;
        this.w = 20; this.h = 40;
        if(this.data.length > 0) {
            this.x = this.data[0].x; this.y = this.data[0].y;
        }
    }
    update() {
        if (this.frame < this.data.length) {
            this.x = this.data[this.frame].x;
            this.y = this.data[this.frame].y;
            this.frame++;
        }
    }
    draw(ctx) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#a855f7';
        ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.shadowBlur = 0;
    }
}

// Level Data Generation
const Levels = [
    { // Level 1: Intro
        start: {x: 100, y: 500},
        goal: {x: 1100, y: 500, w: 50, h: 100},
        walls: [
            {x: 0, y: 600, w: 1280, h: 120, type: 'ground'},
            {x: 500, y: 500, w: 100, h: 100, type: 'wall'}
        ],
        buttons: [], doors: [], hazards: [],
        msg: "W,A,S,D to move. SPACE to jump."
    },
    { // Level 2: Introduce Echo
        start: {x: 100, y: 500},
        goal: {x: 1100, y: 500, w: 50, h: 100},
        walls: [
            {x: 0, y: 600, w: 1280, h: 120, type: 'ground'},
            {x: 600, y: 0, w: 20, h: 600, type: 'wall', id: 'door1'}
        ],
        buttons: [{x: 300, y: 590, w: 40, h: 10, target: 'door1'}],
        doors: ['door1'], hazards: [],
        msg: "Stand on switch. Press SHIFT to leave an ECHO repeating your past. Run to the door."
    },
    { // Level 3: Platforming & Timing
        start: {x: 50, y: 200},
        goal: {x: 1100, y: 100, w: 50, h: 100},
        walls: [
            {x: 0, y: 300, w: 200, h: 420, type: 'ground'},
            {x: 350, y: 400, w: 100, h: 20, type: 'ground'},
            {x: 600, y: 500, w: 100, h: 20, type: 'ground'},
            {x: 850, y: 400, w: 100, h: 20, type: 'ground'},
            {x: 1000, y: 200, w: 280, h: 520, type: 'ground'},
            {x: 1000, y: 0, w: 20, h: 200, type: 'wall', id: 'door2'}
        ],
        buttons: [{x: 630, y: 490, w: 40, h: 10, target: 'door2'}],
        doors: ['door2'], 
        hazards: [{x: 200, y: 680, w: 800, h: 40}], // Spikes
        msg: "Echoes interact with the world exactly as you did."
    }
];

// Procedural generator to fulfill 200 level requirement concept
function generateProceduralLevel(levelNum) {
    let walls = [ {x: 0, y: 600, w: 1280, h: 120, type: 'ground'} ];
    let buttons = [];
    let doors = [];
    let hazards = [];
    
    // Create random platforms
    let numPlatforms = Math.floor(Math.random() * 5) + 3;
    let lastX = 200;
    for(let i=0; i<numPlatforms; i++) {
        let w = Math.random() * 100 + 50;
        let x = lastX + Math.random() * 150 + 50;
        let y = Math.random() * 300 + 200;
        walls.push({x, y, w, h: 20, type: 'ground'});
        lastX = x;
    }

    // Goal at end
    let goal = {x: Math.min(lastX + 100, 1150), y: 100, w: 50, h: 100};
    
    // Random Door and Button
    let doorX = goal.x - 50;
    walls.push({x: doorX, y: 0, w: 20, h: 600, type: 'wall', id: 'pDoor'});
    doors.push('pDoor');
    
    let btnPlatform = walls[Math.floor(Math.random() * (walls.length-2)) + 1];
    buttons.push({x: btnPlatform.x + btnPlatform.w/2 - 20, y: btnPlatform.y - 10, w: 40, h: 10, target: 'pDoor'});

    return {
        start: {x: 50, y: 500}, goal, walls, buttons, doors, hazards,
        msg: `FRACTURE ${levelNum}: Echoes of the Void`
    };
}

const Game = {
    state: 'START', // START, PLAYING, TRANSITION, GAMEOVER
    levelIdx: 0,
    currentLevel: null,
    player: null,
    echoes: [],
    recording: [],
    frameCounter: 0,
    maxEchoes: 3,

    init: function() {
        document.getElementById('start-btn').addEventListener('click', () => {
            SoundEngine.init();
            document.getElementById('start-screen').classList.add('hidden');
            this.loadLevel(0);
        });
        this.loop();
    },

    loadLevel: function(idx) {
        this.state = 'TRANSITION';
        this.levelIdx = idx;
        
        let levelData = idx < Levels.length ? Levels[idx] : generateProceduralLevel(idx + 1);
        
        // Deep copy level data so mutations don't persist on restart
        this.currentLevel = JSON.parse(JSON.stringify(levelData));
        
        this.player = new Player(this.currentLevel.start.x, this.currentLevel.start.y);
        this.echoes = [];
        this.recording = [];
        this.frameCounter = 0;

        document.getElementById('level-display').innerText = `FRACTURE ${idx + 1}`;
        document.getElementById('instruction-display').innerText = this.currentLevel.msg || "";
        
        if(idx >= 1) document.getElementById('clone-display').classList.remove('hidden');

        let transScreen = document.getElementById('transition-screen');
        let transText = document.getElementById('transition-text');
        transText.innerText = `FRACTURE ${idx + 1}`;
        transScreen.classList.remove('hidden');
        
        setTimeout(() => {
            transScreen.classList.add('hidden');
            this.state = 'PLAYING';
        }, 1500);
    },

    createEcho: function() {
        if(this.recording.length === 0) return;
        SoundEngine.echo();
        
        // Store current recording as an Echo
        if (this.echoes.length >= this.maxEchoes) this.echoes.shift();
        this.echoes.push(new Echo([...this.recording]));
        
        // Reset world for time loop
        this.player.reset();
        this.recording = [];
        this.frameCounter = 0;
        
        // Reset doors
        this.currentLevel.walls.forEach(w => {
            if(this.currentLevel.doors.includes(w.id)) w.active = true;
        });

        // Flash effect
        ctx.fillStyle = 'rgba(168, 85, 247, 0.5)';
        ctx.fillRect(0,0,GAME_WIDTH, GAME_HEIGHT);
    },

    death: function() {
        if(this.state !== 'PLAYING') return;
        SoundEngine.death();
        this.state = 'GAMEOVER';
        setTimeout(() => this.loadLevel(this.levelIdx), 1000);
    },

    winLevel: function() {
        if(this.state !== 'PLAYING') return;
        SoundEngine.goal();
        this.state = 'WIN';
        setTimeout(() => this.loadLevel(this.levelIdx + 1), 1000);
    },

    update: function() {
        if (this.state !== 'PLAYING') return;

        // Record Player
        this.recording.push({x: this.player.x, y: this.player.y});

        // Update Player
        this.player.update(this.currentLevel);

        // Update Echoes
        this.echoes.forEach(echo => echo.update());

        // Interaction Logic
        let pressedButtons = new Set();
        
        // Check Buttons against Player and Echoes
        this.currentLevel.buttons.forEach((btn, i) => {
            let isPressed = false;
            let bounds = {x: btn.x, y: btn.y - 5, w: btn.w, h: btn.h + 5}; // extended height for detection
            
            if (AABB(this.player, bounds)) isPressed = true;
            this.echoes.forEach(echo => {
                if (echo.frame < echo.data.length && AABB(echo, bounds)) isPressed = true;
            });

            if (isPressed) {
                pressedButtons.add(btn.target);
                if(!btn.wasPressed) SoundEngine.buttonPress();
            }
            btn.wasPressed = isPressed;
        });

        // Handle Doors based on Buttons
        this.currentLevel.walls.forEach(w => {
            if (this.currentLevel.doors.includes(w.id)) {
                w.active = !pressedButtons.has(w.id); // Deactivate (open) if targeted by pressed button
            }
        });

        // Hazards
        this.currentLevel.hazards.forEach(h => {
            if (AABB(this.player, h)) this.death();
        });

        // Goal
        if (AABB(this.player, this.currentLevel.goal)) {
            this.winLevel();
        }

        this.frameCounter++;
    },

    draw: function() {
        // Motion blur / Trail effect by not fully clearing canvas
        ctx.fillStyle = 'rgba(5, 5, 8, 0.4)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        if (this.state === 'START') return;

        // Draw Scenery (Atmospheric)
        // Neon grid lines back
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for(let i=0; i<GAME_WIDTH; i+=100) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,GAME_HEIGHT); ctx.stroke(); }
        for(let i=0; i<GAME_HEIGHT; i+=100) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(GAME_WIDTH,i); ctx.stroke(); }

        // Level Elements
        if(this.currentLevel) {
            // Goal
            let g = this.currentLevel.goal;
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#fff';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(g.x, g.y, g.w, g.h);
            
            // Pulse goal
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(Date.now()*0.005))*0.3})`;
            ctx.fillRect(g.x-10, g.y-10, g.w+20, g.h+20);
            ctx.shadowBlur = 0;

            // Walls & Floors
            this.currentLevel.walls.forEach(w => {
                if (w.active === false) {
                    // Open door outline
                    ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)';
                    ctx.strokeRect(w.x, w.y, w.w, w.h);
                    return;
                }
                if (w.type === 'ground' || w.type === 'wall') {
                    ctx.fillStyle = '#111';
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    // Neon Edge
                    ctx.strokeStyle = w.id ? '#f0f' : '#0ff'; // Pink for doors, Cyan for normal
                    ctx.lineWidth = 2;
                    ctx.strokeRect(w.x, w.y, w.w, w.h);
                }
            });

            // Hazards
            this.currentLevel.hazards.forEach(h => {
                ctx.fillStyle = '#f00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f00';
                // Draw Spikes
                for(let i=0; i<h.w; i+=20) {
                    ctx.beginPath();
                    ctx.moveTo(h.x + i, h.y + h.h);
                    ctx.lineTo(h.x + i + 10, h.y);
                    ctx.lineTo(h.x + i + 20, h.y + h.h);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            });

            // Buttons
            this.currentLevel.buttons.forEach(btn => {
                ctx.fillStyle = btn.wasPressed ? '#0f0' : '#f00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.fillStyle;
                let h = btn.wasPressed ? 4 : btn.h;
                ctx.fillRect(btn.x, btn.y + (btn.h - h), btn.w, h);
                ctx.shadowBlur = 0;
            });
        }

        // Draw Entities
        this.echoes.forEach(echo => {
            if(echo.frame < echo.data.length) echo.draw(ctx);
        });
        
        if (this.player && this.state !== 'GAMEOVER') {
            this.player.draw(ctx);
        }

        // HUD - Echo charges
        if(this.levelIdx >= 1) {
            for(let i=0; i<this.maxEchoes; i++) {
                ctx.fillStyle = i < this.echoes.length ? '#a855f7' : 'rgba(168, 85, 247, 0.2)';
                ctx.fillRect(GAME_WIDTH/2 - 45 + (i*30), 20, 20, 5);
            }
        }
    },

    loop: function() {
        Game.update();
        Game.draw();
        requestAnimationFrame(() => Game.loop());
    }
};

// Start
window.onload = () => Game.init();

// Resize handling
function resizeCanvas() {
    const ratio = GAME_WIDTH / GAME_HEIGHT;
    const windowRatio = window.innerWidth / window.innerHeight;
    let newW, newH;

    if (windowRatio > ratio) {
        newH = window.innerHeight;
        newW = newH * ratio;
    } else {
        newW = window.innerWidth;
        newH = newW / ratio;
    }

    canvas.style.width = newW + 'px';
    canvas.style.height = newH + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

</script>
