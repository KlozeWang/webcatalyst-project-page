<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Block Bros</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #5c94fc; /* Mario Sky Blue */
            font-family: 'Press Start 2P', monospace;
            touch-action: none;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 40px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #e52521;
            text-shadow: 4px 4px 0 white;
            font-size: 40px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 12px;
            line-height: 1.5;
            color: #f8d820;
            margin-bottom: 30px;
        }

        button {
            background-color: #e52521;
            color: white;
            border: 4px solid white;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0 #000;
            transition: transform 0.1s;
        }

        button:hover {
            background-color: #b01c18;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .d-pad, .action-pad {
            display: flex;
            gap: 10px;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            h1 { font-size: 24px; }
            p { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>SCORE <br><span id="score">000000</span></div>
        <div>COINS <br><span id="coins">00</span></div>
    </div>

    <div id="start-screen" class="screen">
        <h1>SUPER BLOCK BROS</h1>
        <p>ARROWS / WASD to Move<br>SPACE / UP to Jump<br><br>Stomp enemies, collect coins,<br>reach the green flag!</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1 id="game-over-title">GAME OVER</h1>
        <p id="game-over-desc">You lost a life.</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="action-pad">
            <div class="btn" id="btn-jump">▲</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiScore = document.getElementById('score');
    const uiCoins = document.getElementById('coins');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const gameOverTitle = document.getElementById('game-over-title');
    const gameOverDesc = document.getElementById('game-over-desc');

    let animationId;
    let gameState = 'START'; // START, PLAY, OVER
    let camera = { x: 0 };
    
    // Audio Context (simple synths)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if(type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, now); // B5
            osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'stomp') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'death') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'win') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554.37, now + 0.1);
            osc.frequency.setValueAtTime(659.25, now + 0.2);
            osc.frequency.setValueAtTime(880, now + 0.4);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 1);
            osc.start(now);
            osc.stop(now + 1);
        }
    }

    // Input Handling
    const keys = { left: false, right: false, up: false };
    
    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
    });

    // Mobile Input
    const bindTouch = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    };
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'up');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game Constants & Variables
    const TILE_SIZE = 40;
    const GRAVITY = 0.6;
    const FRICTION = 0.8;
    
    let score = 0;
    let coins = 0;
    let entities = [];
    let platforms = [];

    // Classes
    class Entity {
        constructor(x, y, w, h, color) {
            this.x = x; this.y = y;
            this.w = w; this.h = h;
            this.vx = 0; this.vy = 0;
            this.color = color;
            this.dead = false;
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.fillRect(Math.round(this.x), Math.round(this.y), this.w, this.h);
        }
        getBounds() {
            return { l: this.x, r: this.x + this.w, t: this.y, b: this.y + this.h };
        }
    }

    class Player extends Entity {
        constructor(x, y) {
            super(x, y, TILE_SIZE * 0.8, TILE_SIZE * 0.8, '#e52521'); // Red
            this.speed = 5;
            this.jumpForce = -12;
            this.grounded = false;
            this.facingRight = true;
        }

        update() {
            if (keys.left) { this.vx -= 1; this.facingRight = false; }
            if (keys.right) { this.vx += 1; this.facingRight = true; }
            
            // Limit speed
            if (this.vx > this.speed) this.vx = this.speed;
            if (this.vx < -this.speed) this.vx = -this.speed;
            
            // Friction
            if (!keys.left && !keys.right) this.vx *= FRICTION;
            if (Math.abs(this.vx) < 0.1) this.vx = 0;

            // Jump
            if (keys.up && this.grounded) {
                this.vy = this.jumpForce;
                this.grounded = false;
                playSound('jump');
            }

            // Apply gravity
            this.vy += GRAVITY;

            // Move X and collide
            this.x += this.vx;
            this.handleCollisions('x');

            // Move Y and collide
            this.y += this.vy;
            this.grounded = false;
            this.handleCollisions('y');

            // Screen bounds / Death pit
            if (this.x < 0) this.x = 0;
            if (this.y > canvas.height + TILE_SIZE) {
                die();
            }
        }

        handleCollisions(axis) {
            for (let p of platforms) {
                if (rectIntersect(this, p)) {
                    if (axis === 'x') {
                        if (this.vx > 0) { this.x = p.x - this.w; }
                        else if (this.vx < 0) { this.x = p.x + p.w; }
                        this.vx = 0;
                    } else if (axis === 'y') {
                        if (this.vy > 0) { 
                            this.y = p.y - this.h; 
                            this.grounded = true; 
                        } else if (this.vy < 0) { 
                            this.y = p.y + p.h; 
                        }
                        this.vy = 0;
                    }
                }
            }
        }

        draw(ctx) {
            // Draw body
            ctx.fillStyle = this.color;
            ctx.fillRect(Math.round(this.x), Math.round(this.y), this.w, this.h);
            
            // Draw face (simple detail)
            ctx.fillStyle = '#ffcc99'; // Skin
            ctx.fillRect(Math.round(this.x + (this.facingRight ? this.w/2 : 0)), Math.round(this.y), this.w/2, this.h/2);
            // Hat brim
            ctx.fillStyle = '#e52521';
            ctx.fillRect(Math.round(this.x + (this.facingRight ? this.w/2 : -this.w/4)), Math.round(this.y), this.w*0.75, this.h/4);
        }
    }

    class Enemy extends Entity {
        constructor(x, y) {
            super(x, y, TILE_SIZE * 0.8, TILE_SIZE * 0.8, '#852100'); // Brown (Goomba-like)
            this.vx = -1.5;
            this.startVx = this.vx;
        }
        update() {
            this.vy += GRAVITY;
            
            this.x += this.vx;
            this.handleCollisions('x');
            
            this.y += this.vy;
            this.handleCollisions('y');

            // Simple ai: turn around at edges of platforms (simplified) or walls
        }
        handleCollisions(axis) {
            let hit = false;
            for (let p of platforms) {
                if (rectIntersect(this, p)) {
                    hit = true;
                    if (axis === 'x') {
                        if (this.vx > 0) this.x = p.x - this.w;
                        else if (this.vx < 0) this.x = p.x + p.w;
                        this.vx *= -1; // Turn around
                    } else if (axis === 'y') {
                        if (this.vy > 0) this.y = p.y - this.h;
                        this.vy = 0;
                    }
                }
            }
            
            // Check edge drop
            if(axis === 'y' && this.vy === 0) {
                let onEdge = true;
                for (let p of platforms) {
                    if (this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h === p.y) {
                        onEdge = false;
                    }
                }
            }
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.fillRect(Math.round(this.x), Math.round(this.y), this.w, this.h);
            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(Math.round(this.x + 4), Math.round(this.y + 8), 8, 8);
            ctx.fillRect(Math.round(this.x + this.w - 12), Math.round(this.y + 8), 8, 8);
            ctx.fillStyle = 'black';
            ctx.fillRect(Math.round(this.x + 6), Math.round(this.y + 10), 4, 4);
            ctx.fillRect(Math.round(this.x + this.w - 10), Math.round(this.y + 10), 4, 4);
        }
    }

    class Coin extends Entity {
        constructor(x, y) {
            super(x + TILE_SIZE*0.25, y + TILE_SIZE*0.25, TILE_SIZE * 0.5, TILE_SIZE * 0.6, '#f8d820');
            this.baseY = this.y;
            this.time = Math.random() * Math.PI * 2;
        }
        update() {
            this.time += 0.1;
            this.y = this.baseY + Math.sin(this.time) * 4;
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.ellipse(Math.round(this.x + this.w/2), Math.round(this.y + this.h/2), this.w/2, this.h/2, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(Math.round(this.x + this.w/2 - 2), Math.round(this.y + 4), 4, this.h - 8);
        }
    }

    class Flag extends Entity {
        constructor(x, y) {
            super(x, y, TILE_SIZE, TILE_SIZE * 8, '#fff');
            this.flagY = y + TILE_SIZE;
        }
        draw(ctx) {
            // Pole
            ctx.fillStyle = '#ccc';
            ctx.fillRect(this.x + TILE_SIZE/2 - 4, this.y, 8, this.h);
            // Flag
            ctx.fillStyle = '#43b047'; // Green
            ctx.beginPath();
            ctx.moveTo(this.x + TILE_SIZE/2 + 4, this.flagY);
            ctx.lineTo(this.x + TILE_SIZE/2 + 40, this.flagY + 15);
            ctx.lineTo(this.x + TILE_SIZE/2 + 4, this.flagY + 30);
            ctx.fill();
            // Finial
            ctx.fillStyle = '#f8d820';
            ctx.beginPath();
            ctx.arc(this.x + TILE_SIZE/2, this.y, 10, 0, Math.PI*2);
            ctx.fill();
        }
    }

    class Platform {
        constructor(x, y, w, h, type) {
            this.x = x; this.y = y;
            this.w = w; this.h = h;
            this.type = type; // 'ground', 'brick', 'question'
        }
        draw(ctx) {
            if (this.type === 'ground') {
                ctx.fillStyle = '#c84c0c';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Grass top
                ctx.fillStyle = '#43b047';
                ctx.fillRect(this.x, this.y, this.w, 10);
            } else if (this.type === 'brick') {
                ctx.fillStyle = '#852100';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(this.x, this.y, this.w, this.h);
                ctx.beginPath();
                ctx.moveTo(this.x + this.w/2, this.y); ctx.lineTo(this.x + this.w/2, this.y + this.h);
                ctx.moveTo(this.x, this.y + this.h/2); ctx.lineTo(this.x + this.w, this.y + this.h/2);
                ctx.stroke();
            }
        }
    }

    let player;
    let goal;

    function rectIntersect(r1, r2) {
        return !(r2.x > r1.x + r1.w || 
                 r2.x + r2.w < r1.x || 
                 r2.y > r1.y + r1.h ||
                 r2.y + r2.h < r1.y);
    }

    // Level Design Map
    const levelData = [
        "                                                                                      F     ",
        "                                                                                      |     ",
        "                                                                                      |     ",
        "                                                                                      |     ",
        "                                     C C C                                            |     ",
        "                                    BBBBBBB                                           |     ",
        "                                                                                      |     ",
        "            C  C                                          E                           |     ",
        "           BB  BB                  E                    BBBB                          |     ",
        "                                 BBBBB                 BBBBBB                         |     ",
        "                                BBBBBBB               BBBBBBBB     C                  |     ",
        " P  E                          BBBBBBBBB             BBBBBBBBBB   BBB                 |     ",
        "GGGGGGGGGGGGGGGG    GGGGGGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
        "GGGGGGGGGGGGGGGG    GGGGGGGGGGGGGGGGGGGGGGGGGGGGG   GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG"
    ];

    function buildLevel() {
        platforms = [];
        entities = [];
        let startY = canvas.height - (levelData.length * TILE_SIZE);
        
        // Ground baseline correction if screen is tall
        if(startY > 0) startY = canvas.height / 2; 

        for (let row = 0; row < levelData.length; row++) {
            for (let col = 0; col < levelData[row].length; col++) {
                let char = levelData[row][col];
                let x = col * TILE_SIZE;
                let y = startY + (row * TILE_SIZE);

                if (char === 'G') platforms.push(new Platform(x, y, TILE_SIZE, TILE_SIZE, 'ground'));
                if (char === 'B') platforms.push(new Platform(x, y, TILE_SIZE, TILE_SIZE, 'brick'));
                if (char === 'C') entities.push(new Coin(x, y));
                if (char === 'E') entities.push(new Enemy(x, y));
                if (char === 'P') player = new Player(x, y);
                if (char === 'F') {
                    goal = new Flag(x, y);
                    entities.push(goal);
                }
            }
        }
        
        // Merge adjacent ground blocks for better performance & collision
        let mergedPlatforms = [];
        let currentGrp = null;
        for(let p of platforms) {
            if(p.type === 'ground') {
                if(!currentGrp) {
                    currentGrp = {...p};
                } else if(currentGrp.y === p.y && currentGrp.x + currentGrp.w === p.x) {
                    currentGrp.w += p.w;
                } else {
                    mergedPlatforms.push(new Platform(currentGrp.x, currentGrp.y, currentGrp.w, currentGrp.h, 'ground'));
                    currentGrp = {...p};
                }
            } else {
                mergedPlatforms.push(p);
            }
        }
        if(currentGrp) mergedPlatforms.push(new Platform(currentGrp.x, currentGrp.y, currentGrp.w, currentGrp.h, 'ground'));
        platforms = mergedPlatforms;
    }

    function addScore(points) {
        score += points;
        uiScore.innerText = score.toString().padStart(6, '0');
    }

    function addCoin() {
        coins++;
        uiCoins.innerText = coins.toString().padStart(2, '0');
        addScore(100);
        playSound('coin');
    }

    function die() {
        gameState = 'OVER';
        playSound('death');
        gameOverTitle.innerText = "GAME OVER";
        gameOverDesc.innerText = "You lost a life.";
        gameOverTitle.style.color = "#e52521";
        gameOverScreen.classList.remove('hidden');
    }

    function win() {
        gameState = 'OVER';
        playSound('win');
        gameOverTitle.innerText = "LEVEL CLEAR!";
        gameOverDesc.innerText = `Final Score: ${score}`;
        gameOverTitle.style.color = "#f8d820";
        addScore(1000); // Win bonus
        gameOverScreen.classList.remove('hidden');
    }

    function update() {
        if (gameState !== 'PLAY') return;

        player.update();

        // Camera follow
        let targetCamX = player.x - canvas.width / 3;
        if (targetCamX < 0) targetCamX = 0;
        camera.x += (targetCamX - camera.x) * 0.1; // Smooth follow

        // Entity updates and player-entity collisions
        for (let i = entities.length - 1; i >= 0; i--) {
            let ent = entities[i];
            
            if (ent instanceof Enemy) {
                // Only update if near screen
                if(ent.x > camera.x - canvas.width && ent.x < camera.x + canvas.width*2) {
                    ent.update();
                }

                if (rectIntersect(player, ent)) {
                    // Stomp
                    if (player.vy > 0 && player.y + player.h < ent.y + ent.h/2) {
                        ent.dead = true;
                        player.vy = player.jumpForce * 0.8; // Bounce
                        addScore(200);
                        playSound('stomp');
                    } else {
                        die();
                    }
                }
            } else if (ent instanceof Coin) {
                ent.update();
                if (rectIntersect(player, ent)) {
                    ent.dead = true;
                    addCoin();
                }
            } else if (ent instanceof Flag) {
                if(rectIntersect(player, ent)) {
                    win();
                }
            }

            if (ent.dead || ent.y > canvas.height + TILE_SIZE) {
                entities.splice(i, 1);
            }
        }
    }

    function draw() {
        // Clear
        ctx.fillStyle = '#5c94fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if(gameState === 'START') return;

        ctx.save();
        ctx.translate(-Math.round(camera.x), 0);

        // Scenery (Clouds/Hills could go here)

        for (let p of platforms) {
            // Culling
            if(p.x + p.w > camera.x && p.x < camera.x + canvas.width) {
                p.draw(ctx);
            }
        }

        for (let ent of entities) {
             if(ent.x + ent.w > camera.x && ent.x < camera.x + canvas.width) {
                ent.draw(ctx);
             }
        }

        player.draw(ctx);

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }

    function startGame() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        startScreen.classList.add('hidden');
        resetGameLogic();
        gameState = 'PLAY';
    }

    function resetGame() {
        gameOverScreen.classList.add('hidden');
        resetGameLogic();
        gameState = 'PLAY';
    }

    function resetGameLogic() {
        score = 0;
        coins = 0;
        addScore(0);
        addCoin(); // updates UI
        coins=0; uiCoins.innerText = "00"; // hacky reset
        camera.x = 0;
        buildLevel();
        keys.left = keys.right = keys.up = false;
    }

    // Initial draw
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    loop();

</script>
</body>
</html>
