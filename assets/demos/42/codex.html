<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Super Mario - Browser Edition</title>
<style>
  :root {
    --bg: #5cc8ff;
    --panel: rgba(0,0,0,0.35);
    --text: #fff;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101820;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  canvas {
    background: var(--bg);
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    border-radius: 10px;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    background: var(--panel);
    color: #fff;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: .2px;
    user-select: none;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>
<div id="hint">Move: ← → / A D &nbsp; Jump: Space / ↑ / W &nbsp; Restart: R</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const W = canvas.width;
  const H = canvas.height;
  const GRAVITY = 0.65;
  const WORLD_WIDTH = 6200;
  const GROUND_Y = 480;

  const keys = Object.create(null);
  const justPressed = Object.create(null);

  let gameState = "start"; // start, playing, won, gameover
  let cameraX = 0;
  let time = 0;
  let score = 0;
  let coinsCollected = 0;

  const solids = [];
  const coins = [];
  const enemies = [];
  let flag = null;
  let player = null;

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function addSolid(x, y, w, h, type = "ground", color = null) {
    solids.push({ x, y, w, h, type, color });
  }

  function addCoin(x, y) {
    coins.push({ x, y, r: 10, taken: false, bob: Math.random() * Math.PI * 2 });
  }

  function addEnemy(x, y, minX, maxX) {
    enemies.push({
      x, y, w: 34, h: 30,
      vx: -1.3,
      vy: 0,
      alive: true,
      onGround: false,
      minX, maxX
    });
  }

  function createWorld() {
    solids.length = 0;
    coins.length = 0;
    enemies.length = 0;

    // Ground segments (gaps create pits)
    const groundSegments = [
      [0, 1400],
      [1500, 2500],
      [2700, 3600],
      [3800, 4700],
      [4900, WORLD_WIDTH]
    ];
    for (const [a, b] of groundSegments) addSolid(a, GROUND_Y, b - a, H - GROUND_Y, "ground", "#4CAF50");

    // Blocks & platforms
    const blocks = [
      [420, 380, 60, 20], [480, 380, 60, 20], [540, 380, 60, 20],
      [860, 320, 60, 20], [920, 320, 60, 20], [980, 320, 60, 20],
      [1180, 270, 60, 20], [1240, 270, 60, 20], [1300, 270, 60, 20],
      [1650, 360, 70, 20], [1730, 320, 70, 20], [1810, 280, 70, 20],
      [2200, 350, 80, 20], [2290, 350, 80, 20], [2380, 350, 80, 20],
      [2870, 300, 80, 20], [2960, 260, 80, 20], [3050, 220, 80, 20],
      [3320, 360, 80, 20], [3400, 360, 80, 20],
      [4040, 320, 70, 20], [4110, 280, 70, 20], [4180, 240, 70, 20],
      [4480, 350, 90, 20], [4580, 350, 90, 20],
      [5200, 320, 70, 20], [5270, 280, 70, 20], [5340, 240, 70, 20],
    ];
    for (const b of blocks) addSolid(...b, "block", "#b5651d");

    // Pipes
    const pipes = [
      [700, 400, 70, 80],
      [1560, 370, 70, 110],
      [2120, 340, 70, 140],
      [3190, 360, 70, 120],
      [4370, 330, 70, 150],
      [5520, 350, 70, 130]
    ];
    for (const p of pipes) addSolid(...p, "pipe", "#2d9c45");

    // Coins
    for (let i = 0; i < 10; i++) addCoin(450 + i * 60, 330);
    for (let i = 0; i < 7; i++) addCoin(1180 + i * 55, 220 + (i % 2) * 20);
    for (let i = 0; i < 12; i++) addCoin(2150 + i * 55, 290 - Math.sin(i)*25);
    for (let i = 0; i < 8; i++) addCoin(4050 + i * 55, 190 + (i%3)*18);
    for (let i = 0; i < 10; i++) addCoin(5150 + i * 55, 180 + Math.cos(i)*20);

    // Enemies
    addEnemy(930, 450, 840, 1180);
    addEnemy(1850, 450, 1650, 2450);
    addEnemy(2330, 320, 2200, 2460);
    addEnemy(2920, 450, 2720, 3560);
    addEnemy(3460, 330, 3320, 3490);
    addEnemy(4140, 450, 3820, 4680);
    addEnemy(5400, 450, 4920, 6140);

    // Flag
    flag = { x: WORLD_WIDTH - 180, y: 150, w: 10, h: 330 };
  }

  function resetGame() {
    createWorld();
    player = {
      x: 120, y: 380, w: 34, h: 44,
      vx: 0, vy: 0,
      speed: 4.2,
      jump: 13.5,
      onGround: false,
      facing: 1
    };
    score = 0;
    coinsCollected = 0;
    cameraX = 0;
    gameState = "start";
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function resolveX(entity) {
    for (const s of solids) {
      if (overlap(entity, s)) {
        if (entity.vx > 0) entity.x = s.x - entity.w;
        else if (entity.vx < 0) entity.x = s.x + s.w;
        entity.vx = 0;
      }
    }
  }

  function resolveY(entity) {
    entity.onGround = false;
    for (const s of solids) {
      if (overlap(entity, s)) {
        if (entity.vy > 0) {
          entity.y = s.y - entity.h;
          entity.vy = 0;
          entity.onGround = true;
        } else if (entity.vy < 0) {
          entity.y = s.y + s.h;
          entity.vy = 0;
        }
      }
    }
  }

  function updatePlayer() {
    const left = keys.ArrowLeft || keys.KeyA;
    const right = keys.ArrowRight || keys.KeyD;
    const jump = keys.Space || keys.ArrowUp || keys.KeyW;

    player.vx = 0;
    if (left) { player.vx = -player.speed; player.facing = -1; }
    if (right) { player.vx = player.speed; player.facing = 1; }

    if ((justPressed.Space || justPressed.ArrowUp || justPressed.KeyW) && player.onGround) {
      player.vy = -player.jump;
      player.onGround = false;
    }

    player.vy += GRAVITY;
    player.vy = Math.min(player.vy, 16);

    player.x += player.vx;
    resolveX(player);

    player.y += player.vy;
    resolveY(player);

    player.x = clamp(player.x, 0, WORLD_WIDTH - player.w);

    // Coins
    for (const c of coins) {
      if (c.taken) continue;
      const dx = (player.x + player.w * 0.5) - c.x;
      const dy = (player.y + player.h * 0.5) - c.y;
      if (dx * dx + dy * dy < (c.r + 16) * (c.r + 16)) {
        c.taken = true;
        coinsCollected++;
        score += 100;
      }
    }

    // Enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      if (overlap(player, e)) {
        const playerBottom = player.y + player.h;
        const enemyTop = e.y;
        if (player.vy > 2 && playerBottom - enemyTop < 24) {
          e.alive = false;
          player.vy = -9.5;
          score += 250;
        } else {
          gameState = "gameover";
        }
      }
    }

    // Pits/fall
    if (player.y > H + 180) gameState = "gameover";

    // Flag / win
    if (player.x + player.w > flag.x - 12 && player.y + player.h > flag.y) {
      gameState = "won";
      score += 1000;
    }
  }

  function updateEnemies() {
    for (const e of enemies) {
      if (!e.alive) continue;
      e.vy += GRAVITY;
      e.vy = Math.min(e.vy, 14);

      e.x += e.vx;
      // Horizontal collisions with solids
      for (const s of solids) {
        if (overlap(e, s)) {
          if (e.vx > 0) e.x = s.x - e.w;
          else e.x = s.x + s.w;
          e.vx *= -1;
        }
      }

      // Patrol bounds
      if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }

      e.y += e.vy;
      e.onGround = false;
      for (const s of solids) {
        if (overlap(e, s)) {
          if (e.vy > 0) {
            e.y = s.y - e.h;
            e.vy = 0;
            e.onGround = true;
          } else if (e.vy < 0) {
            e.y = s.y + s.h;
            e.vy = 0;
          }
        }
      }

      if (e.y > H + 200) e.alive = false;
    }
  }

  function updateCamera() {
    cameraX = clamp(player.x - W * 0.35, 0, WORLD_WIDTH - W);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#7fd8ff");
    g.addColorStop(1, "#e2f5ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Parallax hills
    const p1 = -(cameraX * 0.2) % 600;
    ctx.fillStyle = "#9ddf8c";
    for (let i = -1; i < 4; i++) {
      const x = p1 + i * 600;
      ctx.beginPath();
      ctx.moveTo(x, H);
      ctx.quadraticCurveTo(x + 150, 300, x + 300, H);
      ctx.quadraticCurveTo(x + 450, 330, x + 600, H);
      ctx.closePath();
      ctx.fill();
    }

    // Clouds
    const p2 = -(cameraX * 0.1) % 500;
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    for (let i = -1; i < 5; i++) {
      const x = p2 + i * 500 + 120;
      const y = 80 + (i % 2) * 35;
      drawCloud(x, y);
    }
  }

  function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 10, 24, 0, Math.PI * 2);
    ctx.arc(x + 45, y, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawWorld() {
    for (const s of solids) {
      const sx = s.x - cameraX;
      if (sx + s.w < -20 || sx > W + 20) continue;

      if (s.type === "ground") {
        ctx.fillStyle = "#64b85d";
        ctx.fillRect(sx, s.y, s.w, s.h);
        ctx.fillStyle = "#4a8f45";
        for (let x = 0; x < s.w; x += 24) {
          ctx.fillRect(sx + x, s.y + 8, 14, 6);
        }
      } else if (s.type === "pipe") {
        ctx.fillStyle = s.color || "#2f9e44";
        ctx.fillRect(sx, s.y, s.w, s.h);
        ctx.fillStyle = "#3fb85b";
        ctx.fillRect(sx - 4, s.y - 10, s.w + 8, 12);
      } else {
        ctx.fillStyle = s.color || "#b5651d";
        ctx.fillRect(sx, s.y, s.w, s.h);
        ctx.strokeStyle = "#8a4711";
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 1, s.y + 1, s.w - 2, s.h - 2);
        ctx.beginPath();
        ctx.moveTo(sx + s.w / 2, s.y);
        ctx.lineTo(sx + s.w / 2, s.y + s.h);
        ctx.stroke();
      }
    }

    // Flag pole
    const fx = flag.x - cameraX;
    ctx.fillStyle = "#e8e8e8";
    ctx.fillRect(fx, flag.y, flag.w, flag.h);
    ctx.fillStyle = "#ff3b30";
    ctx.fillRect(fx + flag.w, flag.y + 10, 46, 28);
  }

  function drawCoins() {
    for (const c of coins) {
      if (c.taken) continue;
      const x = c.x - cameraX;
      if (x < -30 || x > W + 30) continue;
      const bob = Math.sin(time * 0.08 + c.bob) * 3.5;
      ctx.save();
      ctx.translate(x, c.y + bob);
      const squish = 0.65 + Math.abs(Math.sin(time * 0.16 + c.bob)) * 0.35;
      ctx.scale(squish, 1);
      ctx.fillStyle = "#ffd43b";
      ctx.beginPath();
      ctx.arc(0, 0, c.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath();
      ctx.arc(-3, -3, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawEnemies() {
    for (const e of enemies) {
      if (!e.alive) continue;
      const x = e.x - cameraX;
      if (x + e.w < -20 || x > W + 20) continue;

      // Body
      ctx.fillStyle = "#8d5524";
      ctx.fillRect(x, e.y + 8, e.w, e.h - 8);
      // Face
      ctx.fillStyle = "#c68642";
      ctx.fillRect(x + 4, e.y, e.w - 8, 13);
      // Eyes
      ctx.fillStyle = "#111";
      ctx.fillRect(x + 10, e.y + 4, 4, 4);
      ctx.fillRect(x + 20, e.y + 4, 4, 4);
      // Feet
      ctx.fillStyle = "#5a3518";
      ctx.fillRect(x + 3, e.y + e.h - 4, 10, 4);
      ctx.fillRect(x + e.w - 13, e.y + e.h - 4, 10, 4);
    }
  }

  function drawPlayer() {
    const x = player.x - cameraX;
    const y = player.y;

    // Overalls
    ctx.fillStyle = "#1f6feb";
    ctx.fillRect(x + 7, y + 18, 20, 26);

    // Shirt
    ctx.fillStyle = "#ff3b30";
    ctx.fillRect(x + 4, y + 15, 26, 12);

    // Head
    ctx.fillStyle = "#f1c27d";
    ctx.fillRect(x + 8, y + 4, 18, 14);

    // Hat
    ctx.fillStyle = "#d7261e";
    ctx.fillRect(x + 6, y, 22, 8);

    // Mustache
    ctx.fillStyle = "#4a2e14";
    ctx.fillRect(x + 11, y + 12, 12, 3);

    // Eye
    ctx.fillStyle = "#111";
    const eyeX = player.facing === 1 ? x + 20 : x + 12;
    ctx.fillRect(eyeX, y + 8, 3, 3);

    // Shoes
    ctx.fillStyle = "#5a3518";
    ctx.fillRect(x + 6, y + 40, 10, 4);
    ctx.fillRect(x + 18, y + 40, 10, 4);
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(14, 14, 270, 58);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px Trebuchet MS";
    ctx.fillText("MARIO", 28, 38);
    ctx.font = "18px Trebuchet MS";
    ctx.fillText("Score: " + score, 28, 62);
    ctx.fillText("Coins: " + coinsCollected, 160, 62);

    if (gameState === "start") {
      drawCenterMessage("SUPER MARIO", "Press Enter to Start");
    } else if (gameState === "gameover") {
      drawCenterMessage("GAME OVER", "Press R to Restart");
    } else if (gameState === "won") {
      drawCenterMessage("YOU WIN!", "Press R to Play Again");
    }
  }

  function drawCenterMessage(title, sub) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(W/2 - 220, H/2 - 80, 440, 160);
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.strokeRect(W/2 - 220, H/2 - 80, 440, 160);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 48px Trebuchet MS";
    ctx.fillText(title, W/2, H/2 - 10);
    ctx.font = "22px Trebuchet MS";
    ctx.fillText(sub, W/2, H/2 + 36);
    ctx.textAlign = "left";
  }

  function update() {
    time++;
    if (gameState === "playing") {
      updatePlayer();
      updateEnemies();
      updateCamera();
    }

    for (const k in justPressed) delete justPressed[k];
  }

  function render() {
    drawBackground();
    drawWorld();
    drawCoins();
    drawEnemies();
    drawPlayer();
    drawHUD();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    if (!keys[e.code]) justPressed[e.code] = true;
    keys[e.code] = true;

    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) {
      e.preventDefault();
    }

    if (e.code === "Enter" && gameState === "start") gameState = "playing";
    if (e.code === "KeyR" && (gameState === "gameover" || gameState === "won" || gameState === "start")) {
      resetGame();
      gameState = "playing";
    }
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  resetGame();
  loop();
})();
</script>
</body>
</html>
