<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Retro Platformer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(#7ec8ff, #dff6ff);
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: linear-gradient(#7ec8ff, #dff6ff);
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      color: #fff;
      font-weight: 700;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 18px;
      z-index: 10;
    }
    .msg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.45);
      font-weight: 800;
      font-size: clamp(20px, 4vw, 44px);
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
      z-index: 12;
    }
    .msg.show { opacity: 1; }
    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 11;
    }
    .pad, .btns {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    button {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      border: none;
      background: rgba(255,255,255,0.25);
      color: white;
      font-size: 20px;
      font-weight: 800;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15), 0 6px 16px rgba(0,0,0,0.18);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    button:active, button.active {
      transform: translateY(2px);
      background: rgba(255,255,255,0.4);
    }
    @media (pointer:fine) {
      .controls { display:none; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div id="score">SCORE 0</div>
    <div id="lives">LIVES 3</div>
  </div>
  <div id="message" class="msg">PRESS SPACE OR TAP TO START</div>
  <div class="controls">
    <div class="pad">
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
    <div class="btns">
      <button id="jump">JUMP</button>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const msgEl = document.getElementById('message');

      let W = 0, H = 0, DPR = 1;
      const world = { w: 3600, h: 900 };

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.floor(innerWidth);
        H = Math.floor(innerHeight);
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR,0,0,DPR,0,0);
      }
      window.addEventListener('resize', resize);
      resize();

      const keys = { left:false, right:false, jump:false };
      const state = { started:false, gameOver:false, win:false, score:0, lives:3, time:0 };

      const player = {
        x: 120, y: 200, w: 28, h: 34, vx: 0, vy: 0, onGround: false, facing: 1, inv: 0
      };

      const gravity = 0.7;
      const moveSpeed = 0.9;
      const maxSpeed = 5.2;
      const jumpPower = 12.8;

      const platforms = [
        {x:0, y:830, w:3600, h:70},
        {x:180, y:720, w:220, h:24},
        {x:500, y:650, w:220, h:24},
        {x:850, y:760, w:200, h:24},
        {x:1150, y:690, w:260, h:24},
        {x:1520, y:620, w:230, h:24},
        {x:1880, y:740, w:260, h:24},
        {x:2280, y:680, w:240, h:24},
        {x:2660, y:600, w:240, h:24},
        {x:2980, y:720, w:260, h:24},
        {x:3320, y:660, w:220, h:24},
      ];

      const coins = [
        {x:240,y:680,r:10,got:false},{x:560,y:610,r:10,got:false},{x:920,y:720,r:10,got:false},
        {x:1230,y:650,r:10,got:false},{x:1600,y:580,r:10,got:false},{x:1970,y:700,r:10,got:false},
        {x:2360,y:640,r:10,got:false},{x:2740,y:560,r:10,got:false},{x:3060,y:680,r:10,got:false},
        {x:3400,y:620,r:10,got:false}
      ];

      const enemies = [
        {x:620,y:620,w:30,h:24,vx:1.2,min:520,max:700,alive:true},
        {x:1290,y:660,w:30,h:24,vx:-1.3,min:1180,max:1380,alive:true},
        {x:2010,y:710,w:30,h:24,vx:1.1,min:1900,max:2100,alive:true},
        {x:2790,y:570,w:30,h:24,vx:-1.4,min:2680,max:2900,alive:true},
        {x:3380,y:630,w:30,h:24,vx:1.0,min:3300,max:3480,alive:true},
      ];

      const goal = { x: 3500, y: 560, w: 20, h: 270 };

      function reset() {
        state.started = false;
        state.gameOver = false;
        state.win = false;
        state.score = 0;
        state.lives = 3;
        state.time = 0;
        player.x = 120; player.y = 200; player.vx = 0; player.vy = 0; player.inv = 0; player.facing = 1;
        coins.forEach(c => c.got = false);
        enemies.forEach((e,i) => { e.alive = true; });
        msgEl.textContent = 'PRESS SPACE OR TAP TO START';
        msgEl.classList.add('show');
        updateHUD();
      }

      function updateHUD() {
        scoreEl.textContent = 'SCORE ' + state.score;
        livesEl.textContent = 'LIVES ' + state.lives;
      }

      function rects(a,b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

      function startGame() {
        if (!state.started && !state.gameOver && !state.win) {
          state.started = true;
          msgEl.classList.remove('show');
        }
      }

      function loseLife() {
        if (player.inv > 0 || state.gameOver || state.win) return;
        state.lives--;
        updateHUD();
        player.inv = 120;
        player.x = 120; player.y = 200; player.vx = 0; player.vy = 0;
        if (state.lives <= 0) {
          state.gameOver = true;
          msgEl.textContent = 'GAME OVER - PRESS R TO RESTART';
          msgEl.classList.add('show');
        }
      }

      function winGame() {
        state.win = true;
        msgEl.textContent = 'YOU WIN! PRESS R TO RESTART';
        msgEl.classList.add('show');
      }

      function inputPressed() {
        if (!state.started) startGame();
        if (state.gameOver || state.win) reset();
      }

      function addScore(n) {
        state.score += n;
        updateHUD();
      }

      window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
          keys.jump = true;
          if (!state.started) startGame();
        }
        if (e.code === 'KeyR') reset();
      });
      window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
      });

      function bindButton(id, onDown, onUp) {
        const el = document.getElementById(id);
        const down = (e) => { e.preventDefault(); onDown(); };
        const up = (e) => { e.preventDefault(); onUp && onUp(); };
        el.addEventListener('mousedown', down);
        el.addEventListener('mouseup', up);
        el.addEventListener('mouseleave', up);
        el.addEventListener('touchstart', down, {passive:false});
        el.addEventListener('touchend', up, {passive:false});
      }
      bindButton('left', () => { keys.left = true; inputPressed(); }, () => { keys.left = false; });
      bindButton('right', () => { keys.right = true; inputPressed(); }, () => { keys.right = false; });
      bindButton('jump', () => { keys.jump = true; inputPressed(); }, () => { keys.jump = false; });
      canvas.addEventListener('pointerdown', inputPressed);

      function resolvePlatformCollision(prevY) {
        player.onGround = false;
        for (const p of platforms) {
          if (rects(player, p)) {
            const prevBottom = prevY + player.h;
            const top = p.y;
            const bottom = p.y + p.h;
            if (prevBottom <= top && player.vy >= 0) {
              player.y = top - player.h;
              player.vy = 0;
              player.onGround = true;
            } else if (prevY >= bottom && player.vy < 0) {
              player.y = bottom;
              player.vy = 0;
            } else {
              if (player.x + player.w/2 < p.x + p.w/2) player.x = p.x - player.w;
              else player.x = p.x + p.w;
              player.vx = 0;
            }
          }
        }
      }

      function update() {
        if (!state.started || state.gameOver || state.win) return;
        state.time++;

        const prevY = player.y;

        if (keys.left) { player.vx -= moveSpeed; player.facing = -1; }
        if (keys.right) { player.vx += moveSpeed; player.facing = 1; }
        if (!keys.left && !keys.right) player.vx *= 0.82;

        player.vx = clamp(player.vx, -maxSpeed, maxSpeed);

        if (keys.jump && player.onGround) {
          player.vy = -jumpPower;
          player.onGround = false;
        }

        player.vy += gravity;
        player.vx *= 0.99;

        player.x += player.vx;
        player.y += player.vy;

        if (player.x < 0) player.x = 0;
        if (player.x + player.w > world.w) player.x = world.w - player.w;

        resolvePlatformCollision(prevY);

        if (player.y > world.h + 100) loseLife();
        if (player.inv > 0) player.inv--;

        for (const c of coins) {
          if (!c.got) {
            const dx = (player.x + player.w/2) - c.x;
            const dy = (player.y + player.h/2) - c.y;
            if (dx*dx + dy*dy < 34*34) {
              c.got = true;
              addScore(100);
            }
          }
        }

        for (const e of enemies) {
          if (!e.alive) continue;
          e.x += e.vx;
          if (e.x < e.min || e.x > e.max) e.vx *= -1;
          const ex = {x:e.x, y:e.y, w:e.w, h:e.h};
          if (rects(player, ex)) {
            if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 4) {
              e.alive = false;
              player.vy = -8.5;
              addScore(200);
            } else {
              loseLife();
            }
          }
        }

        if (rects(player, goal)) {
          winGame();
        }
      }

      function drawBackground(camX) {
        const skyGrad = ctx.createLinearGradient(0,0,0,H);
        skyGrad.addColorStop(0, '#7ec8ff');
        skyGrad.addColorStop(1, '#dff6ff');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0,0,W,H);

        const hillOffset = -camX * 0.25;
        ctx.fillStyle = '#7ac95f';
        for (let i = -1; i < 10; i++) {
          const x = (i * 420 + hillOffset) % 1200 - 200;
          ctx.beginPath();
          ctx.ellipse(x + 180, H - 95, 140, 70, 0, 0, Math.PI*2);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        for (let i = 0; i < 8; i++) {
          const x = ((i * 520) - (camX * 0.12)) % (W + 600) - 150;
          const y = 70 + (i % 3) * 38;
          cloud(x, y, 1.0 + (i%2)*0.2);
        }
      }

      function cloud(x, y, s) {
        ctx.beginPath();
        ctx.ellipse(x, y, 34*s, 18*s, 0, 0, Math.PI*2);
        ctx.ellipse(x + 28*s, y - 10*s, 28*s, 16*s, 0, 0, Math.PI*2);
        ctx.ellipse(x + 56*s, y, 36*s, 20*s, 0, 0, Math.PI*2);
        ctx.ellipse(x + 28*s, y + 8*s, 40*s, 18*s, 0, 0, Math.PI*2);
        ctx.fill();
      }

      function draw() {
        const camX = clamp(player.x - W * 0.42, 0, world.w - W);
        drawBackground(camX);

        ctx.save();
        ctx.translate(-camX, 0);

        for (const p of platforms) {
          ctx.fillStyle = '#8b5a2b';
          ctx.fillRect(p.x, p.y, p.w, p.h);
          ctx.fillStyle = '#4ecb58';
          ctx.fillRect(p.x, p.y, p.w, 8);
        }

        ctx.fillStyle = '#f4d03f';
        for (const c of coins) {
          if (c.got) continue;
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
          ctx.fill();
          ctx.strokeStyle = '#d39b00';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        for (const e of enemies) {
          if (!e.alive) continue;
          ctx.fillStyle = '#8e2f2f';
          ctx.fillRect(e.x, e.y, e.w, e.h);
          ctx.fillStyle = '#ffcf99';
          ctx.fillRect(e.x + 6, e.y + 5, 6, 6);
          ctx.fillRect(e.x + 18, e.y + 5, 6, 6);
          ctx.fillStyle = '#5b1e1e';
          ctx.fillRect(e.x + 7, e.y + 16, 16, 4);
        }

        ctx.fillStyle = '#d12d2d';
        ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(goal.x + 20, goal.y + 18, 60, 38);
        ctx.fillStyle = '#444';
        ctx.fillRect(goal.x + 20, goal.y + 18, 60, 38);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(goal.x + 20, goal.y + 18);
        ctx.lineTo(goal.x + 80, goal.y + 37);
        ctx.lineTo(goal.x + 20, goal.y + 56);
        ctx.closePath();
        ctx.fill();

        const blink = player.inv > 0 && Math.floor(player.inv / 6) % 2 === 0;
        if (!blink) {
          ctx.fillStyle = '#ff4b4b';
          ctx.fillRect(player.x, player.y, player.w, player.h);
          ctx.fillStyle = '#fff';
          ctx.fillRect(player.x + 5, player.y + 6, 8, 8);
          ctx.fillRect(player.x + 15, player.y + 6, 8, 8);
          ctx.fillStyle = '#1f1f1f';
          ctx.fillRect(player.x + (player.facing > 0 ? 18 : 4), player.y + 15, 6, 3);
          ctx.fillStyle = '#2c6ee6';
          ctx.fillRect(player.x, player.y + 22, player.w, 12);
        }

        ctx.restore();

        ctx.fillStyle = '#3ea34d';
        ctx.fillRect(0, H - 18, W, 18);
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      reset();
      loop();
    })();
  </script>
</body>
</html>
