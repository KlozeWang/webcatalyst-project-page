<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific & Logical Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0f172a; /* Slate 900 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #f8fafc;
        }

        .calc-btn {
            transition: all 0.1s ease-in-out;
            user-select: none;
        }
        
        .calc-btn:active {
            transform: scale(0.95);
        }

        /* Hide scrollbar for display */
        #display::-webkit-scrollbar {
            display: none;
        }
        #display {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-sm sm:max-w-md bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700 p-2">
        
        <!-- Display Screen -->
        <div class="bg-slate-900 rounded-2xl p-4 mb-2 flex flex-col justify-end items-end h-32 border border-slate-700 shadow-inner overflow-hidden relative">
            <div id="history" class="text-slate-400 text-sm absolute top-4 right-4 max-w-[90%] truncate"></div>
            <div id="display" class="text-4xl sm:text-5xl font-semibold tracking-wider text-right w-full overflow-x-auto whitespace-nowrap pb-1">0</div>
        </div>

        <!-- Keypad Grid -->
        <div class="grid grid-cols-5 gap-2">
            
            <!-- Row 1: Logical & Clear -->
            <button onclick="appendOp(' AND ')" class="calc-btn bg-indigo-900 hover:bg-indigo-800 text-indigo-200 text-sm font-medium py-3 rounded-xl shadow-sm border border-indigo-700">AND</button>
            <button onclick="appendOp(' OR ')" class="calc-btn bg-indigo-900 hover:bg-indigo-800 text-indigo-200 text-sm font-medium py-3 rounded-xl shadow-sm border border-indigo-700">OR</button>
            <button onclick="appendOp(' XOR ')" class="calc-btn bg-indigo-900 hover:bg-indigo-800 text-indigo-200 text-sm font-medium py-3 rounded-xl shadow-sm border border-indigo-700">XOR</button>
            <button onclick="clearAll()" class="calc-btn bg-red-900 hover:bg-red-800 text-red-200 font-bold py-3 rounded-xl shadow-sm border border-red-700">AC</button>
            <button onclick="deleteLast()" class="calc-btn bg-red-900 hover:bg-red-800 text-red-200 font-bold py-3 rounded-xl shadow-sm border border-red-700">DEL</button>

            <!-- Row 2: Scientific -->
            <button onclick="appendFunc('sin(')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">sin</button>
            <button onclick="appendFunc('cos(')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">cos</button>
            <button onclick="appendFunc('tan(')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">tan</button>
            <button onclick="appendVal('(')" class="calc-btn bg-slate-600 hover:bg-slate-500 py-3 rounded-xl shadow-sm">(</button>
            <button onclick="appendVal(')')" class="calc-btn bg-slate-600 hover:bg-slate-500 py-3 rounded-xl shadow-sm">)</button>

            <!-- Row 3: Scientific -->
            <button onclick="appendFunc('log(')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">log</button>
            <button onclick="appendFunc('ln(')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">ln</button>
            <button onclick="appendFunc('sqrt(')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">√</button>
            <button onclick="appendOp('^')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">xⁿ</button>
            <button onclick="appendOp('/')" class="calc-btn bg-orange-600 hover:bg-orange-500 font-bold text-xl py-3 rounded-xl shadow-sm border border-orange-500">÷</button>

            <!-- Row 4: Numbers -->
            <button onclick="appendVal('7')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">7</button>
            <button onclick="appendVal('8')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">8</button>
            <button onclick="appendVal('9')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">9</button>
            <button onclick="appendVal('pi')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">π</button>
            <button onclick="appendOp('*')" class="calc-btn bg-orange-600 hover:bg-orange-500 font-bold text-xl py-3 rounded-xl shadow-sm border border-orange-500">×</button>

            <!-- Row 5: Numbers -->
            <button onclick="appendVal('4')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">4</button>
            <button onclick="appendVal('5')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">5</button>
            <button onclick="appendVal('6')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">6</button>
            <button onclick="appendVal('e')" class="calc-btn bg-slate-700 hover:bg-slate-600 text-sm py-3 rounded-xl shadow-sm">e</button>
            <button onclick="appendOp('-')" class="calc-btn bg-orange-600 hover:bg-orange-500 font-bold text-xl py-3 rounded-xl shadow-sm border border-orange-500">−</button>

            <!-- Row 6: Numbers -->
            <button onclick="appendVal('1')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">1</button>
            <button onclick="appendVal('2')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">2</button>
            <button onclick="appendVal('3')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm">3</button>
            <button onclick="appendOp('<<')" class="calc-btn bg-indigo-900 hover:bg-indigo-800 text-indigo-200 text-sm font-medium py-3 rounded-xl shadow-sm border border-indigo-700">LSH</button>
            <button onclick="appendOp('+')" class="calc-btn bg-orange-600 hover:bg-orange-500 font-bold text-xl py-3 rounded-xl shadow-sm border border-orange-500">+</button>

            <!-- Row 7: Bottom -->
            <button onclick="appendVal('0')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-medium text-xl py-3 rounded-xl shadow-sm col-span-2">0</button>
            <button onclick="appendVal('.')" class="calc-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 font-bold text-xl py-3 rounded-xl shadow-sm">.</button>
            <button onclick="appendOp('>>')" class="calc-btn bg-indigo-900 hover:bg-indigo-800 text-indigo-200 text-sm font-medium py-3 rounded-xl shadow-sm border border-indigo-700">RSH</button>
            <button onclick="calculate()" class="calc-btn bg-emerald-600 hover:bg-emerald-500 font-bold text-2xl py-3 rounded-xl shadow-sm border border-emerald-500">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const historyDisplay = document.getElementById('history');
        let currentExpression = '';
        let isEvaluated = false;

        function updateDisplay() {
            // Replace internal symbols with visual ones for display
            let visualStr = currentExpression
                .replace(/pi/g, 'π')
                .replace(/\*/g, '×')
                .replace(/\//g, '÷');
            
            display.innerText = visualStr === '' ? '0' : visualStr;
            // Scroll to end
            display.scrollLeft = display.scrollWidth;
        }

        function appendVal(val) {
            if (isEvaluated) {
                currentExpression = '';
                isEvaluated = false;
            }
            currentExpression += val;
            updateDisplay();
        }

        function appendOp(op) {
            isEvaluated = false;
            currentExpression += op;
            updateDisplay();
        }

        function appendFunc(func) {
            if (isEvaluated) {
                currentExpression = '';
                isEvaluated = false;
            }
            currentExpression += func;
            updateDisplay();
        }

        function clearAll() {
            currentExpression = '';
            historyDisplay.innerText = '';
            isEvaluated = false;
            updateDisplay();
        }

        function deleteLast() {
            if (isEvaluated) return;
            // Handle deleting functions like 'sin(' as one block if possible, but character by character is simpler and robust
            if (currentExpression.endsWith(' AND ') || currentExpression.endsWith(' XOR ')) {
                currentExpression = currentExpression.slice(0, -5);
            } else if (currentExpression.endsWith(' OR ')) {
                currentExpression = currentExpression.slice(0, -4);
            } else if (currentExpression.endsWith('<<') || currentExpression.endsWith('>>')) {
                currentExpression = currentExpression.slice(0, -2);
            } else {
                currentExpression = currentExpression.slice(0, -1);
            }
            updateDisplay();
        }

        function calculate() {
            if (currentExpression === '') return;

            try {
                // Keep original for history
                let visualStr = currentExpression
                    .replace(/pi/g, 'π')
                    .replace(/\*/g, '×')
                    .replace(/\//g, '÷');
                historyDisplay.innerText = visualStr + ' =';

                // Prepare string for evaluation
                let evalStr = currentExpression
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/pi/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/\^/g, '**') // Power
                    .replace(/ AND /g, '&') // Bitwise AND
                    .replace(/ OR /g, '|')  // Bitwise OR
                    .replace(/ XOR /g, '^'); // Bitwise XOR

                // Evaluate using Function for slightly better security than raw eval, though still executes code.
                // Wrapped in Math.round to handle floating point precision issues (e.g., 0.1 + 0.2)
                let result = new Function('return ' + evalStr)();
                
                if (typeof result === 'number') {
                    // Fix precision for display, up to 10 decimal places
                    result = parseFloat(result.toFixed(10));
                }

                if (isNaN(result) || !isFinite(result)) {
                    throw new Error("Invalid calculation");
                }

                currentExpression = result.toString();
                isEvaluated = true;
                updateDisplay();

            } catch (error) {
                display.innerText = "Error";
                currentExpression = "";
                isEvaluated = true;
            }
        }

        // Keyboard Support
        document.addEventListener('keydown', (event) => {
            const key = event.key;
            if (/[0-9]/.test(key) || key === '.') {
                appendVal(key);
            } else if (['+', '-', '*', '/', '(', ')'].includes(key)) {
                appendOp(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === '^') {
                appendOp('^');
            }
        });
    </script>
</body>
</html>
