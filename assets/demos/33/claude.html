<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SciLogic Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298, #6a11cb);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }
  .calc {
    background: rgba(20, 20, 35, 0.95);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 520px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .title {
    color: #fff;
    text-align: center;
    margin-bottom: 12px;
    font-size: 18px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00d4ff, #ff00ea);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .modes {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, #00d4ff, #ff00ea);
    color: #fff;
    border-color: transparent;
  }
  .display {
    background: #0a0a18;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: right;
    min-height: 100px;
    border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
  }
  .expr {
    color: #888;
    font-size: 16px;
    min-height: 20px;
    word-wrap: break-word;
    word-break: break-all;
  }
  .result {
    color: #fff;
    font-size: 32px;
    font-weight: 300;
    margin-top: 8px;
    word-wrap: break-word;
    word-break: break-all;
  }
  .keys {
    display: grid;
    gap: 8px;
  }
  .row {
    display: grid;
    gap: 8px;
  }
  button.k {
    padding: 14px 6px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: #2a2a40;
    transition: all 0.15s;
    user-select: none;
  }
  button.k:hover { transform: translateY(-2px); filter: brightness(1.2); }
  button.k:active { transform: scale(0.95); }
  .k.op { background: #3a3a5c; color: #00d4ff; }
  .k.fn { background: #2d2d48; color: #ffb86c; font-size: 13px; }
  .k.eq { background: linear-gradient(135deg, #00d4ff, #ff00ea); }
  .k.clr { background: #b13a4b; }
  .k.num { background: #393956; }
  .hidden { display: none; }
  @media(max-width:480px){
    .result{font-size:24px;}
    button.k{padding:12px 4px; font-size:14px;}
    .k.fn{font-size:11px;}
  }
</style>
</head>
<body>
<div class="calc">
  <div class="title">⚡ SCI / LOGIC CALC ⚡</div>
  <div class="modes">
    <button class="mode-btn active" data-mode="sci">Scientific</button>
    <button class="mode-btn" data-mode="logic">Logical</button>
  </div>
  <div class="display">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <!-- Scientific keys -->
  <div class="keys" id="sciKeys">
    <div class="row" style="grid-template-columns: repeat(5, 1fr);">
      <button class="k fn" data-i="sin(">sin</button>
      <button class="k fn" data-i="cos(">cos</button>
      <button class="k fn" data-i="tan(">tan</button>
      <button class="k fn" data-i="log(">log</button>
      <button class="k fn" data-i="ln(">ln</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(5, 1fr);">
      <button class="k fn" data-i="asin(">sin⁻¹</button>
      <button class="k fn" data-i="acos(">cos⁻¹</button>
      <button class="k fn" data-i="atan(">tan⁻¹</button>
      <button class="k fn" data-i="sqrt(">√</button>
      <button class="k fn" data-i="^">x^y</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(5, 1fr);">
      <button class="k fn" data-i="π">π</button>
      <button class="k fn" data-i="e">e</button>
      <button class="k fn" data-i="(">(</button>
      <button class="k fn" data-i=")">)</button>
      <button class="k fn" data-i="!">n!</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k clr" id="clear">AC</button>
      <button class="k clr" id="back">⌫</button>
      <button class="k op" data-i="%">%</button>
      <button class="k op" data-i="/">÷</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k num" data-i="7">7</button>
      <button class="k num" data-i="8">8</button>
      <button class="k num" data-i="9">9</button>
      <button class="k op" data-i="*">×</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k num" data-i="4">4</button>
      <button class="k num" data-i="5">5</button>
      <button class="k num" data-i="6">6</button>
      <button class="k op" data-i="-">−</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k num" data-i="1">1</button>
      <button class="k num" data-i="2">2</button>
      <button class="k num" data-i="3">3</button>
      <button class="k op" data-i="+">+</button>
    </div>
    <div class="row" style="grid-template-columns: 2fr 1fr 1fr 1fr;">
      <button class="k num" data-i="0">0</button>
      <button class="k num" data-i=".">.</button>
      <button class="k op" data-i="ans">Ans</button>
      <button class="k eq" id="equals">=</button>
    </div>
  </div>

  <!-- Logical keys -->
  <div class="keys hidden" id="logicKeys">
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k fn" data-i="AND">AND</button>
      <button class="k fn" data-i="OR">OR</button>
      <button class="k fn" data-i="XOR">XOR</button>
      <button class="k fn" data-i="NOT">NOT</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k fn" data-i="NAND">NAND</button>
      <button class="k fn" data-i="NOR">NOR</button>
      <button class="k fn" data-i="<<">&lt;&lt;</button>
      <button class="k fn" data-i=">>">&gt;&gt;</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k fn base-btn active" data-base="10">DEC</button>
      <button class="k fn base-btn" data-base="2">BIN</button>
      <button class="k fn base-btn" data-base="16">HEX</button>
      <button class="k fn base-btn" data-base="8">OCT</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k clr" id="clear2">AC</button>
      <button class="k clr" id="back2">⌫</button>
      <button class="k op" data-i="(">(</button>
      <button class="k op" data-i=")">)</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k num hex" data-i="D">D</button>
      <button class="k num hex" data-i="E">E</button>
      <button class="k num hex" data-i="F">F</button>
      <button class="k op" data-i="/">÷</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k num hex" data-i="A">A</button>
      <button class="k num hex" data-i="B">B</button>
      <button class="k num hex" data-i="C">C</button>
      <button class="k op" data-i="*">×</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k num" data-i="7">7</button>
      <button class="k num" data-i="8">8</button>
      <button class="k num" data-i="9">9</button>
      <button class="k op" data-i="-">−</button>
    </div>
    <div class="row" style="grid-template-columns: repeat(4, 1fr);">
      <button class="k num" data-i="4">4</button>
      <button class="k num" data-i="5">5</button>
      <button class="k num" data-i="6">6</button>
      <button class="k op" data-i="+">+</button>
    </div>
    <div class="row" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
      <button class="k num" data-i="1">1</button>
      <button class="k num" data-i="2">2</button>
      <button class="k num" data-i="3">3</button>
      <button class="k eq" id="equals2">=</button>
    </div>
    <div class="row" style="grid-template-columns: 1fr 1fr;">
      <button class="k num" data-i="0">0</button>
      <button class="k op" data-i="ans">Ans</button>
    </div>
  </div>
</div>

<script>
let mode = 'sci';
let expr = '';
let lastAns = 0;
let base = 10;

const exprEl = document.getElementById('expr');
const resultEl = document.getElementById('result');

// Audio click
let audioCtx;
function beep(freq=600){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq;
    o.type='sine';
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.08);
    o.start(); o.stop(audioCtx.currentTime+0.08);
  } catch(e){}
}

function updateDisplay(){
  exprEl.textContent = expr || '\u00A0';
}

function factorial(n){
  n = Math.floor(n);
  if(n<0) return NaN;
  if(n>170) return Infinity;
  let r=1; for(let i=2;i<=n;i++) r*=i; return r;
}

function evalScientific(s){
  // Replace symbols
  let js = s
    .replace(/π/g, 'Math.PI')
    .replace(/(?<![a-zA-Z])e(?![a-zA-Z])/g, 'Math.E')
    .replace(/ans/g, '('+lastAns+')')
    .replace(/sin\(/g,'Math.sin(')
    .replace(/cos\(/g,'Math.cos(')
    .replace(/tan\(/g,'Math.tan(')
    .replace(/asin\(/g,'Math.asin(')
    .replace(/acos\(/g,'Math.acos(')
    .replace(/atan\(/g,'Math.atan(')
    .replace(/sqrt\(/g,'Math.sqrt(')
    .replace(/log\(/g,'Math.log10(')
    .replace(/ln\(/g,'Math.log(')
    .replace(/\^/g,'**')
    .replace(/(\d+(?:\.\d+)?|\))!/g, 'factorial($1)')
    .replace(/%/g,'/100');
  return eval(js);
}

function evalLogic(s){
  // Parse with current base for raw numbers, support A-F always as hex digits in HEX mode
  // Convert tokens
  let tokens = s.match(/NAND|NOR|AND|OR|XOR|NOT|<<|>>|[0-9A-Fa-f]+|[+\-*/()]|ans/g) || [];
  let js = tokens.map(t=>{
    if(/^(AND|OR|XOR|NOT|NAND|NOR|<<|>>)$/.test(t)){
      return {AND:'&',OR:'|',XOR:'^',NOT:'~',NAND:'NAND',NOR:'NOR','<<':'<<','>>':'>>'}[t];
    }
    if(t==='ans') return '('+lastAns+')';
    if(/^[+\-*/()]$/.test(t)) return t;
    // number
    let n = parseInt(t, base);
    if(isNaN(n)) throw new Error('bad digit');
    return n.toString();
  }).join(' ');
  // handle NAND/NOR by wrapping
  // simple replace: a NAND b -> (~(a & b)); but precedence... do scan
  // For simplicity: replace " NAND " with combo via wrap whole expression isn't trivial; use a regex with operands
  js = js.replace(/(\d+|\([^()]*\))\s*NAND\s*(\d+|\([^()]*\))/g, '(~(($1)&($2)))');
  js = js.replace(/(\d+|\([^()]*\))\s*NOR\s*(\d+|\([^()]*\))/g, '(~(($1)|($2)))');
  // remaining NAND/NOR after parentheses changes - loop
  for(let i=0;i<5;i++){
    js = js.replace(/(\d+|\([^()]*\))\s*NAND\s*(\d+|\([^()]*\))/g, '(~(($1)&($2)))');
    js = js.replace(/(\d+|\([^()]*\))\s*NOR\s*(\d+|\([^()]*\))/g, '(~(($1)|($2)))');
  }
  let val = eval(js);
  return val;
}

function compute(){
  if(!expr) return;
  try {
    let v;
    if(mode==='sci') v = evalScientific(expr);
    else v = evalLogic(expr);
    if(v===undefined||v===null||(typeof v==='number'&&isNaN(v))) throw new Error('err');
    lastAns = v;
    if(mode==='logic'){
      let intV = Math.trunc(v);
      resultEl.textContent = formatBase(intV, base);
    } else {
      resultEl.textContent = Number.isFinite(v) ? +v.toPrecision(12) : 'Error';
    }
    beep(800);
  } catch(e){
    resultEl.textContent = 'Error';
    beep(200);
  }
}

function formatBase(n, b){
  if(n<0) return '-'+ Math.abs(n).toString(b).toUpperCase();
  return n.toString(b).toUpperCase();
}

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    expr=''; lastAns=0;
    resultEl.textContent='0';
    updateDisplay();
    document.getElementById('sciKeys').classList.toggle('hidden', mode!=='sci');
    document.getElementById('logicKeys').classList.toggle('hidden', mode!=='logic');
    beep(500);
  };
});

document.querySelectorAll('.base-btn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.base-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    let newBase = parseInt(b.dataset.base);
    // convert current ans
    base = newBase;
    if(typeof lastAns === 'number') resultEl.textContent = formatBase(Math.trunc(lastAns), base);
    expr=''; updateDisplay();
    beep(500);
  };
});

document.body.addEventListener('click', (e)=>{
  const t = e.target.closest('button.k');
  if(!t) return;
  beep(600);
  if(t.id==='clear'||t.id==='clear2'){ expr=''; resultEl.textContent='0'; updateDisplay(); return; }
  if(t.id==='back'||t.id==='back2'){ 
    // remove last token (multi-char for functions)
    expr = expr.replace(/(sin\(|cos\(|tan\(|asin\(|acos\(|atan\(|sqrt\(|log\(|ln\(|ans|AND|OR|XOR|NOT|NAND|NOR|<<|>>|.)$/,'');
    updateDisplay(); return;
  }
  if(t.id==='equals'||t.id==='equals2'){ compute(); return; }
  const v = t.dataset.i;
  if(v!==undefined){
    if(mode==='logic' && /^[A-F]$/.test(v) && base<16){ return; } // ignore hex in non-hex
    if(mode==='logic' && /^[0-9]$/.test(v) && parseInt(v) >= base){ return; }
    // Add spaces around logic operators for clarity
    if(['AND','OR','XOR','NOT','NAND','NOR','<<','>>'].includes(v)){
      expr += ' '+v+' ';
    } else {
      expr += v;
    }
    updateDisplay();
  }
});

// Keyboard
document.addEventListener('keydown', e=>{
  const k = e.key;
  if(/[0-9.+\-*/()%^]/.test(k)){ expr+=k; updateDisplay(); beep(600);}
  else if(k==='Enter'||k==='='){ e.preventDefault(); compute(); }
  else if(k==='Backspace'){ expr=expr.slice(0,-1); updateDisplay(); }
  else if(k==='Escape'){ expr=''; resultEl.textContent='0'; updateDisplay(); }
});

updateDisplay();
</script>
</body>
</html>
