<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific & Logical Calculator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .calculator-container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.1);
    max-width: 520px;
    width: 100%;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .header h1 {
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .mode-toggle {
    display: flex;
    gap: 8px;
  }

  .mode-btn {
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.05);
    color: #aaa;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.3s;
  }

  .mode-btn.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border-color: transparent;
  }

  .mode-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }

  .mode-btn.active:hover {
    background: linear-gradient(135deg, #667eea, #764ba2);
  }

  .display {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
  }

  .expression {
    color: #888;
    font-size: 14px;
    word-break: break-all;
    text-align: right;
    width: 100%;
    min-height: 20px;
    margin-bottom: 8px;
  }

  .result {
    color: #fff;
    font-size: 36px;
    font-weight: 300;
    word-break: break-all;
    text-align: right;
    width: 100%;
    transition: all 0.2s;
  }

  .result.error {
    color: #ff6b6b;
    font-size: 20px;
  }

  .base-display {
    color: #667eea;
    font-size: 12px;
    margin-top: 4px;
    font-family: 'Courier New', monospace;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .btn {
    padding: 14px 8px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.4s, height 0.4s;
  }

  .btn:active::after {
    width: 200px;
    height: 200px;
  }

  .btn-number {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .btn-number:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .btn-operator {
    background: rgba(102, 126, 234, 0.2);
    color: #667eea;
    border: 1px solid rgba(102, 126, 234, 0.3);
  }

  .btn-operator:hover {
    background: rgba(102, 126, 234, 0.35);
  }

  .btn-function {
    background: rgba(118, 75, 162, 0.2);
    color: #b388ff;
    border: 1px solid rgba(118, 75, 162, 0.3);
    font-size: 12px;
  }

  .btn-function:hover {
    background: rgba(118, 75, 162, 0.35);
  }

  .btn-logical {
    background: rgba(0, 200, 150, 0.15);
    color: #00c896;
    border: 1px solid rgba(0, 200, 150, 0.25);
    font-size: 12px;
  }

  .btn-logical:hover {
    background: rgba(0, 200, 150, 0.3);
  }

  .btn-equals {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    grid-column: span 1;
    font-size: 20px;
    border: none;
  }

  .btn-equals:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
  }

  .btn-clear {
    background: rgba(255, 107, 107, 0.2);
    color: #ff6b6b;
    border: 1px solid rgba(255, 107, 107, 0.3);
  }

  .btn-clear:hover {
    background: rgba(255, 107, 107, 0.35);
  }

  .btn-memory {
    background: rgba(255, 193, 7, 0.15);
    color: #ffc107;
    border: 1px solid rgba(255, 193, 7, 0.25);
    font-size: 12px;
  }

  .btn-memory:hover {
    background: rgba(255, 193, 7, 0.3);
  }

  .btn-span-2 {
    grid-column: span 2;
  }

  .section-label {
    color: #666;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 12px 0 8px;
    grid-column: span 5;
    text-align: center;
  }

  .history-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    margin-top: 0;
  }

  .history-panel.open {
    max-height: 200px;
    margin-top: 12px;
  }

  .history-content {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 12px;
    padding: 12px;
    max-height: 180px;
    overflow-y: auto;
  }

  .history-item {
    padding: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    cursor: pointer;
    transition: background 0.2s;
    border-radius: 8px;
  }

  .history-item:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .history-item .hist-expr {
    color: #888;
    font-size: 12px;
  }

  .history-item .hist-result {
    color: #fff;
    font-size: 16px;
    font-weight: 600;
  }

  .history-toggle {
    background: none;
    border: none;
    color: #667eea;
    cursor: pointer;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .history-toggle:hover {
    background: rgba(102, 126, 234, 0.2);
  }

  .memory-indicator {
    color: #ffc107;
    font-size: 11px;
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .memory-indicator.active {
    opacity: 1;
  }

  @media (max-width: 480px) {
    .calculator-container {
      padding: 16px;
    }

    .btn {
      padding: 12px 6px;
      font-size: 12px;
      min-height: 42px;
    }

    .result {
      font-size: 28px;
    }

    .buttons {
      gap: 6px;
    }
  }

  .scrollbar::-webkit-scrollbar {
    width: 4px;
  }

  .scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }

  .scrollbar::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="calculator-container">
  <div class="header">
    <h1>⚗️ Scientific Calculator</h1>
    <div class="mode-toggle">
      <button class="mode-btn active" id="degBtn" onclick="setAngleMode('deg')">DEG</button>
      <button class="mode-btn" id="radBtn" onclick="setAngleMode('rad')">RAD</button>
      <button class="history-toggle" onclick="toggleHistory()">📜 History</button>
    </div>
  </div>

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
    <div class="base-display" id="baseDisplay"></div>
  </div>

  <div class="memory-indicator" id="memIndicator">M</div>

  <div class="buttons">
    <!-- Memory Row -->
    <button class="btn btn-memory" onclick="memoryClear()">MC</button>
    <button class="btn btn-memory" onclick="memoryRecall()">MR</button>
    <button class="btn btn-memory" onclick="memoryAdd()">M+</button>
    <button class="btn btn-memory" onclick="memorySubtract()">M−</button>
    <button class="btn btn-memory" onclick="memoryStore()">MS</button>

    <!-- Scientific Functions -->
    <div class="section-label">Scientific</div>
    <button class="btn btn-function" onclick="inputFunction('sin(')">sin</button>
    <button class="btn btn-function" onclick="inputFunction('cos(')">cos</button>
    <button class="btn btn-function" onclick="inputFunction('tan(')">tan</button>
    <button class="btn btn-function" onclick="inputFunction('asin(')">sin⁻¹</button>
    <button class="btn btn-function" onclick="inputFunction('acos(')">cos⁻¹</button>

    <button class="btn btn-function" onclick="inputFunction('atan(')">tan⁻¹</button>
    <button class="btn btn-function" onclick="inputFunction('log(')">log</button>
    <button class="btn btn-function" onclick="inputFunction('ln(')">ln</button>
    <button class="btn btn-function" onclick="inputFunction('sqrt(')">√</button>
    <button class="btn btn-function" onclick="inputFunction('cbrt(')">∛</button>

    <button class="btn btn-function" onclick="inputText('π')">π</button>
    <button class="btn btn-function" onclick="inputText('e')">e</button>
    <button class="btn btn-function" onclick="inputFunction('fact(')">n!</button>
    <button class="btn btn-function" onclick="inputText('^2')">x²</button>
    <button class="btn btn-function" onclick="inputText('^3')">x³</button>

    <button class="btn btn-function" onclick="inputText('^')">xʸ</button>
    <button class="btn btn-function" onclick="inputText('10^')">10ˣ</button>
    <button class="btn btn-function" onclick="inputText('e^')">eˣ</button>
    <button class="btn btn-function" onclick="inputText('1/')">1/x</button>
    <button class="btn btn-function" onclick="inputText('%')">%</button>

    <!-- Logical / Bitwise -->
    <div class="section-label">Logical / Bitwise</div>
    <button class="btn btn-logical" onclick="inputText('&amp;')">AND</button>
    <button class="btn btn-logical" onclick="inputText('|')">OR</button>
    <button class="btn btn-logical" onclick="inputText('^')">XOR</button>
    <button class="btn btn-logical" onclick="inputText('~')">NOT</button>
    <button class="btn btn-logical" onclick="inputText('<<')">SHL</button>

    <button class="btn btn-logical" onclick="inputText('>>')">SHR</button>
    <button class="btn btn-logical" onclick="inputText('0b')">BIN</button>
    <button class="btn btn-logical" onclick="inputText('0x')">HEX</button>
    <button class="btn btn-logical" onclick="inputText('0o')">OCT</button>
    <button class="btn btn-logical" onclick="toggleBaseMode()">BASE</button>

    <!-- Basic Operations -->
    <div class="section-label">Basic</div>
    <button class="btn btn-clear" onclick="clearAll()">AC</button>
    <button class="btn btn-clear" onclick="clearEntry()">CE</button>
    <button class="btn btn-operator" onclick="inputText('(')">(</button>
    <button class="btn btn-operator" onclick="inputText(')')">)</button>
    <button class="btn btn-operator" onclick="inputText('÷')">÷</button>

    <button class="btn btn-number" onclick="inputText('7')">7</button>
    <button class="btn btn-number" onclick="inputText('8')">8</button>
    <button class="btn btn-number" onclick="inputText('9')">9</button>
    <button class="btn btn-operator" onclick="inputText('×')">×</button>
    <button class="btn btn-operator" onclick="inputText('−')">−</button>

    <button class="btn btn-number" onclick="inputText('4')">4</button>
    <button class="btn btn-number" onclick="inputText('5')">5</button>
    <button class="btn btn-number" onclick="inputText('6')">6</button>
    <button class="btn btn-operator" onclick="inputText('+')">+</button>
    <button class="btn btn-operator" onclick="backspace()">⌫</button>

    <button class="btn btn-number" onclick="inputText('1')">1</button>
    <button class="btn btn-number" onclick="inputText('2')">2</button>
    <button class="btn btn-number" onclick="inputText('3')">3</button>
    <button class="btn btn-number" onclick="inputText('.')">.</button>
    <button class="btn btn-equals" onclick="calculate()">=</button>

    <button class="btn btn-number btn-span-2" onclick="inputText('0')">0</button>
    <button class="btn btn-number" onclick="inputText('00')">00</button>
    <button class="btn btn-number" onclick="inputText('000')">000</button>
    <button class="btn btn-number" onclick="toggleSign()">±</button>
  </div>

  <div class="history-panel" id="historyPanel">
    <div class="history-content scrollbar" id="historyContent"></div>
  </div>
</div>

<script>
  let expression = '';
  let currentResult = '0';
  let angleMode = 'deg';
  let memory = 0;
  let hasMemory = false;
  let history = [];
  let lastResult = null;

  const expressionEl = document.getElementById('expression');
  const resultEl = document.getElementById('result');
  const baseDisplayEl = document.getElementById('baseDisplay');
  const memIndicator = document.getElementById('memIndicator');
  const historyPanel = document.getElementById('historyPanel');
  const historyContent = document.getElementById('historyContent');

  function updateDisplay() {
    expressionEl.textContent = expression;
    resultEl.textContent = currentResult;
    resultEl.classList.remove('error');
  }

  function inputText(text) {
    if (lastResult !== null && !expression) {
      expression = '';
      lastResult = null;
    }
    expression += text;
    updateDisplay();
    try {
      let preview = evaluateExpression(expression);
      if (preview !== null && !isNaN(preview) && isFinite(preview)) {
        currentResult = formatNumber(preview);
        resultEl.textContent = currentResult;
      }
    } catch (e) {
      // Don't update preview on error
    }
  }

  function inputFunction(func) {
    if (lastResult !== null && !expression) {
      expression = '';
      lastResult = null;
    }
    expression += func;
    updateDisplay();
  }

  function backspace() {
    if (expression.length > 0) {
      // Check if last characters form a function name
      const funcPatterns = ['sin(', 'cos(', 'tan(', 'asin(', 'acos(', 'atan(', 'log(', 'ln(', 'sqrt(', 'cbrt(', 'fact('];
      let removed = false;
      for (let pattern of funcPatterns) {
        if (expression.endsWith(pattern)) {
          expression = expression.slice(0, -pattern.length);
          removed = true;
          break;
        }
      }
      if (!removed) {
        expression = expression.slice(0, -1);
      }
      updateDisplay();
      try {
        let preview = evaluateExpression(expression);
        if (preview !== null && !isNaN(preview) && isFinite(preview)) {
          currentResult = formatNumber(preview);
          resultEl.textContent = currentResult;
        }
      } catch (e) {
        // Don't update preview on error
      }
    }
  }

  function clearAll() {
    expression = '';
    currentResult = '0';
    lastResult = null;
    updateDisplay();
    baseDisplayEl.textContent = '';
  }

  function clearEntry() {
    expression = '';
    currentResult = '0';
    updateDisplay();
  }

  function toggleSign() {
    if (expression) {
      if (expression.startsWith('-')) {
        expression = expression.slice(1);
      } else {
        expression = '-' + expression;
      }
      updateDisplay();
      try {
        let preview = evaluateExpression(expression);
        if (preview !== null && !isNaN(preview) && isFinite(preview)) {
          currentResult = formatNumber(preview);
          resultEl.textContent = currentResult;
        }
      } catch (e) { }
    }
  }

  function setAngleMode(mode) {
    angleMode = mode;
    document.getElementById('degBtn').classList.toggle('active', mode === 'deg');
    document.getElementById('radBtn').classList.toggle('active', mode === 'rad');
  }

  function toggleBaseMode() {
    // Toggle between decimal and show binary representation
    if (currentResult !== '0' && currentResult !== 'Error') {
      let num = parseFloat(currentResult);
      if (!isNaN(num)) {
        baseDisplayEl.textContent = `BIN: ${Math.floor(num).toString(2)} | HEX: ${Math.floor(num).toString(16).toUpperCase()} | OCT: ${Math.floor(num).toString(8)}`;
      }
    }
  }

  function toggleHistory() {
    historyPanel.classList.toggle('open');
  }

  function addHistory(expr, result) {
    history.unshift({ expression: expr, result: result });
    if (history.length > 50) history.pop();
    renderHistory();
  }

  function renderHistory() {
    historyContent.innerHTML = history.map((item, i) => `
      <div class="history-item" onclick="loadHistory(${i})">
        <div class="hist-expr">${item.expression}</div>
        <div class="hist-result">${item.result}</div>
      </div>
    `).join('');
  }

  function loadHistory(index) {
    expression = history[index].expression;
    currentResult = history[index].result;
    lastResult = parseFloat(history[index].result);
    updateDisplay();
    historyPanel.classList.remove('open');
  }

  // Memory functions
  function memoryClear() {
    memory = 0;
    hasMemory = false;
    memIndicator.classList.remove('active');
  }

  function memoryRecall() {
    if (hasMemory) {
      expression += memory.toString();
      updateDisplay();
    }
  }

  function memoryAdd() {
    let val = parseFloat(currentResult) || 0;
    memory += val;
    hasMemory = true;
    memIndicator.classList.add('active');
  }

  function memorySubtract() {
    let val = parseFloat(currentResult) || 0;
    memory -= val;
    hasMemory = true;
    memIndicator.classList.add('active');
  }

  function memoryStore() {
    memory = parseFloat(currentResult) || 0;
    hasMemory = true;
    memIndicator.classList.add('active');
  }

  // Core evaluation
  function evaluateExpression(expr) {
    if (!expr.trim()) return null;

    let evalExpr = expr;

    // Replace display symbols with JS operators
    evalExpr = evalExpr.replace(/×/g, '*');
    evalExpr = evalExpr.replace(/÷/g, '/');
    evalExpr = evalExpr.replace(/−/g, '-');
    evalExpr = evalExpr.replace(/π/g, Math.PI.toString());
    evalExpr = evalExpr.replace(/e(?![x^])/g, Math.E.toString());

    // Handle percentage
    evalExpr = evalExpr.replace(/(\d+\.?\d*)%/g, '($1/100)');

    // Handle power operator
    evalExpr = evalExpr.replace(/\^/g, '**');

    // Handle factorial
    evalExpr = evalExpr.replace(/fact\(([^)]+)\)/g, 'factorial($1)');

    // Handle square root
    evalExpr = evalExpr.replace(/sqrt\(([^)]+)\)/g, 'Math.sqrt($1)');

    // Handle cube root
    evalExpr = evalExpr.replace(/cbrt\(([^)]+)\)/g, 'Math.cbrt($1)');

    // Handle logarithms
    evalExpr = evalExpr.replace(/log\(([^)]+)\)/g, 'Math.log10($1)');
    evalExpr = evalExpr.replace(/ln\(([^)]+)\)/g, 'Math.log($1)');

    // Handle trigonometric functions with angle mode
    if (angleMode === 'deg') {
      evalExpr = evalExpr.replace(/sin\(([^)]+)\)/g, 'Math.sin($1 * Math.PI / 180)');
      evalExpr = evalExpr.replace(/cos\(([^)]+)\)/g, 'Math.cos($1 * Math.PI / 180)');
      evalExpr = evalExpr.replace(/tan\(([^)]+)\)/g, 'Math.tan($1 * Math.PI / 180)');
      evalExpr = evalExpr.replace(/asin\(([^)]+)\)/g, '(Math.asin($1) * 180 / Math.PI)');
      evalExpr = evalExpr.replace(/acos\(([^)]+)\)/g, '(Math.acos($1) * 180 / Math.PI)');
      evalExpr = evalExpr.replace(/atan\(([^)]+)\)/g, '(Math.atan($1) * 180 / Math.PI)');
    } else {
      evalExpr = evalExpr.replace(/sin\(([^)]+)\)/g, 'Math.sin($1)');
      evalExpr = evalExpr.replace(/cos\(([^)]+)\)/g, 'Math.cos($1)');
      evalExpr = evalExpr.replace(/tan\(([^)]+)\)/g, 'Math.tan($1)');
      evalExpr = evalExpr.replace(/asin\(([^)]+)\)/g, 'Math.asin($1)');
      evalExpr = evalExpr.replace(/acos\(([^)]+)\)/g, 'Math.acos($1)');
      evalExpr = evalExpr.replace(/atan\(([^)]+)\)/g, 'Math.atan($1)');
    }

    // Handle 10^x and e^x
    evalExpr = evalExpr.replace(/10\*\*/g, 'Math.pow(10,');
    evalExpr = evalExpr.replace(/e\*\*/g, 'Math.exp(');

    // Handle bitwise operations (convert to integers)
    evalExpr = evalExpr.replace(/~/g, '~');
    evalExpr = evalExpr.replace(/&amp;/g, '&');

    // Handle binary, hex, octal prefixes
    evalExpr = evalExpr.replace(/0b([01]+)/gi, 'parseInt($1, 2)');
    evalExpr = evalExpr.replace(/0x([0-9a-f]+)/gi, 'parseInt($1, 16)');
    evalExpr = evalExpr.replace(/0o([0-7]+)/gi, 'parseInt($1, 8)');

    // Factorial function
    function factorial(n) {
      n = Math.floor(n);
      if (n < 0) return NaN;
      if (n === 0 || n === 1) return 1;
      if (n > 170) return Infinity;
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }

    // Safe evaluation
    try {
      // Check for balanced parentheses
      let openCount = (evalExpr.match(/\(/g) || []).length;
      let closeCount = (evalExpr.match(/\)/g) || []).length;
      if (openCount !== closeCount) {
        // Auto-close parentheses
        evalExpr += ')'.repeat(openCount - closeCount);
      }

      let result = Function('factorial', '"use strict"; return (' + evalExpr + ')')(factorial);
      return result;
    } catch (e) {
      return null;
    }
  }

  function formatNumber(num) {
    if (isNaN(num)) return 'Error';
    if (!isFinite(num)) return num > 0 ? 'Infinity' : '-Infinity';

    // Handle very large or very small numbers
    if (Math.abs(num) > 1e15 || (Math.abs(num) < 1e-10 && num !== 0)) {
      return num.toExponential(8);
    }

    // Round to avoid floating point issues
    let rounded = parseFloat(num.toPrecision(12));
    let str = rounded.toString();

    // Add commas for readability
    let parts = str.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }

  function calculate() {
    if (!expression) return;

    try {
      let result = evaluateExpression(expression);

      if (result === null || isNaN(result)) {
        currentResult = 'Error';
        resultEl.classList.add('error');
      } else {
        currentResult = formatNumber(result);
        resultEl.textContent = currentResult;
        lastResult = result;
        addHistory(expression, currentResult);
      }
    } catch (e) {
      currentResult = 'Error';
      resultEl.classList.add('error');
    }

    expression = '';
  }

  // Keyboard support
  document.addEventListener('keydown', function (e) {
    e.preventDefault();

    const key = e.key;

    if (key >= '0' && key <= '9') {
      inputText(key);
    } else if (key === '.') {
      inputText('.');
    } else if (key === '+') {
      inputText('+');
    } else if (key === '-') {
      inputText('−');
    } else if (key === '*') {
      inputText('×');
    } else if (key === '/') {
      inputText('÷');
    } else if (key === '(') {
      inputText('(');
    } else if (key === ')') {
      inputText(')');
    } else if (key === '^') {
      inputText('^');
    } else if (key === 'Enter' || key === '=') {
      calculate();
    } else if (key === 'Backspace') {
      backspace();
    } else if (key === 'Escape' || key === 'c' || key === 'C') {
      clearAll();
    } else if (key === 'p') {
      inputText('π');
    } else if (key === 's') {
      inputFunction('sin(');
    } else if (key === 'o') {
      inputFunction('cos(');
    } else if (key === 't') {
      inputFunction('tan(');
    } else if (key === 'l') {
      inputFunction('log(');
    } else if (key === 'n') {
      inputFunction('ln(');
    } else if (key === 'r') {
      inputFunction('sqrt(');
    } else if (key === 'f') {
      inputFunction('fact(');
    }
  });

  // Initialize
  updateDisplay();
</script>
