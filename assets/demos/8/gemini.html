<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Duel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
        }
        .health-bar-container {
            position: absolute;
            top: 20px;
            width: 400px;
            height: 30px;
            background: #444;
            border: 2px solid #fff;
            border-radius: 5px;
            overflow: hidden;
        }
        .health-bar {
            height: 100%;
            background: #cc0000;
            transition: width 0.2s ease-out;
        }
        #player-health-container {
            left: 20px;
        }
        #enemy-health-container {
            right: 20px;
            display: flex;
            justify-content: flex-end;
        }
        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 30px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 5px;
            border: 2px solid white;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        h1 {
            font-size: 60px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 5px red;
        }
        button {
            padding: 15px 30px;
            font-size: 24px;
            background: transparent;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-transform: uppercase;
        }
        button:hover {
            background: white;
            color: black;
        }
        #controls-info {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- UI Layer -->
    <div id="player-health-container" class="health-bar-container">
        <div id="player-health" class="health-bar" style="width: 100%;"></div>
    </div>
    
    <div id="timer">60</div>

    <div id="enemy-health-container" class="health-bar-container">
        <div id="enemy-health" class="health-bar" style="width: 100%;"></div>
    </div>

    <!-- State Overlays -->
    <div id="start-screen" class="overlay">
        <h1>Shadow Duel</h1>
        <button onclick="startGame()">Fight</button>
        <div id="controls-info">
            Player: A/D to Move, W to Jump, SPACE to Attack<br>
            Defeat the shadow AI!
        </div>
    </div>

    <div id="game-over-screen" class="overlay" style="display: none;">
        <h1 id="result-text">Game Over</h1>
        <button onclick="resetGame()">Rematch</button>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="1024" height="576"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game Constants
    const gravity = 0.7;
    const groundLevel = 500;
    let gameLoop;
    let timerId;
    let timer = 60;
    let gameState = 'START'; // START, PLAYING, OVER

    // DOM Elements
    const playerHealthBar = document.getElementById('player-health');
    const enemyHealthBar = document.getElementById('enemy-health');
    const timerElem = document.getElementById('timer');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const resultText = document.getElementById('result-text');

    // Audio Context (Simple synthesized sounds)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'hit') {
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'swing') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }
    }

    // Input state
    const keys = {
        a: { pressed: false },
        d: { pressed: false },
        w: { pressed: false }
    };

    // Helper: Rectangular Collision Detection
    function rectangularCollision({ rectangle1, rectangle2 }) {
        return (
            rectangle1.attackBox.position.x + rectangle1.attackBox.width >= rectangle2.position.x &&
            rectangle1.attackBox.position.x <= rectangle2.position.x + rectangle2.width &&
            rectangle1.attackBox.position.y + rectangle1.attackBox.height >= rectangle2.position.y &&
            rectangle1.attackBox.position.y <= rectangle2.position.y + rectangle2.height
        );
    }

    // Determine Winner
    function determineWinner() {
        clearTimeout(timerId);
        gameState = 'OVER';
        gameOverScreen.style.display = 'flex';
        
        if (player.health === enemy.health) {
            resultText.innerText = 'Draw';
        } else if (player.health > enemy.health) {
            resultText.innerText = 'Player Wins';
        } else {
            resultText.innerText = 'Enemy Wins';
        }
    }

    // Timer logic
    function decreaseTimer() {
        if (timer > 0 && gameState === 'PLAYING') {
            timerId = setTimeout(decreaseTimer, 1000);
            timer--;
            timerElem.innerText = timer;
        }

        if (timer === 0) {
            determineWinner();
        }
    }

    class Particle {
        constructor({ position, velocity, color }) {
            this.position = position;
            this.velocity = velocity;
            this.color = color;
            this.alpha = 1;
            this.radius = Math.random() * 3 + 1;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.position.x, this.position.y, this.radius, 0, Math.PI * 2, false);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }

        update() {
            this.draw();
            this.position.x += this.velocity.x;
            this.position.y += this.velocity.y;
            this.alpha -= 0.05;
        }
    }

    const particles = [];

    class Fighter {
        constructor({ position, velocity, color, isEnemy = false }) {
            this.position = position;
            this.velocity = velocity;
            this.width = 50;
            this.height = 150;
            this.color = color;
            this.isEnemy = isEnemy;
            
            this.attackBox = {
                position: { x: this.position.x, y: this.position.y },
                width: 100,
                height: 50
            };
            this.isAttacking = false;
            this.attackCooldown = 0;
            this.health = 100;
            this.dead = false;
            this.facingRight = !isEnemy;
            
            // Animation states
            this.hitFlashTimer = 0;
        }

        draw() {
            // Flash red if hit
            if (this.hitFlashTimer > 0) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                this.hitFlashTimer--;
            } else {
                ctx.fillStyle = this.color;
            }
            
            // Draw main body (Silhouette)
            ctx.fillRect(this.position.x, this.position.y, this.width, this.height);

            // Draw Attack Box (Debug/Visualizer)
            if (this.isAttacking) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(
                    this.attackBox.position.x,
                    this.attackBox.position.y,
                    this.attackBox.width,
                    this.attackBox.height
                );
            }
        }

        update() {
            if (this.dead) return;
            
            this.draw();

            // Update Attack Box position based on facing direction
            this.attackBox.position.y = this.position.y + 20;
            if (this.facingRight) {
                this.attackBox.position.x = this.position.x + this.width;
            } else {
                this.attackBox.position.x = this.position.x - this.attackBox.width;
            }

            // Movement & Physics
            this.position.x += this.velocity.x;
            this.position.y += this.velocity.y;

            // Gravity
            if (this.position.y + this.height + this.velocity.y >= groundLevel) {
                this.velocity.y = 0;
                this.position.y = groundLevel - this.height;
            } else {
                this.velocity.y += gravity;
            }

            // Screen bounds
            if (this.position.x < 0) this.position.x = 0;
            if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;

            // Cooldowns
            if (this.attackCooldown > 0) this.attackCooldown--;
        }

        attack() {
            if (this.attackCooldown === 0 && !this.dead) {
                this.isAttacking = true;
                playSound('swing');
                setTimeout(() => {
                    this.isAttacking = false;
                }, 100);
                this.attackCooldown = 30; // Frames before next attack
            }
        }

        takeHit(damage) {
            this.health -= damage;
            this.hitFlashTimer = 10;
            playSound('hit');
            
            // Create blood/shadow particles
            for(let i=0; i<10; i++) {
                particles.push(new Particle({
                    position: {
                        x: this.position.x + this.width/2,
                        y: this.position.y + this.height/4
                    },
                    velocity: {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    },
                    color: 'red'
                }));
            }

            if (this.health <= 0) {
                this.health = 0;
                this.dead = true;
                determineWinner();
            }
            
            // Knockback
            this.velocity.y = -5;
            this.velocity.x = this.facingRight ? -5 : 5;
        }
    }

    // Instantiate Fighters
    let player;
    let enemy;

    function initFighters() {
        player = new Fighter({
            position: { x: 200, y: 0 },
            velocity: { x: 0, y: 0 },
            color: 'black' // Shadow style
        });

        enemy = new Fighter({
            position: { x: 750, y: 0 },
            velocity: { x: 0, y: 0 },
            color: '#1a1a1a', // Slightly off-black to distinguish if overlap
            isEnemy: true
        });
    }

    // Draw Background
    function drawBackground() {
        // Sunset gradient
        const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGradient.addColorStop(0, '#ff7b00');
        bgGradient.addColorStop(0.5, '#ff2a00');
        bgGradient.addColorStop(1, '#330000');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ground
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);

        // Distant mountains (Silhouette)
        ctx.beginPath();
        ctx.moveTo(0, groundLevel);
        ctx.lineTo(150, 300);
        ctx.lineTo(300, groundLevel);
        ctx.lineTo(600, 200);
        ctx.lineTo(900, groundLevel);
        ctx.lineTo(canvas.width, groundLevel);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fill();
    }

    function enemyAI() {
        if (enemy.dead || player.dead) {
            enemy.velocity.x = 0;
            return;
        }

        const distanceX = player.position.x - enemy.position.x;
        
        // Face player
        enemy.facingRight = distanceX > 0;

        // Move towards player
        if (Math.abs(distanceX) > 100) {
            enemy.velocity.x = enemy.facingRight ? 3 : -3;
        } else {
            enemy.velocity.x = 0;
            // Attack randomly when close
            if (Math.random() < 0.05) {
                enemy.attack();
            }
        }
    }

    function animate() {
        if (gameState !== 'PLAYING') return;
        
        gameLoop = requestAnimationFrame(animate);

        drawBackground();

        // Handle Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            } else {
                p.update();
            }
        }

        player.update();
        enemy.update();

        // Player Movement
        player.velocity.x = 0;
        if (!player.dead) {
            if (keys.a.pressed && player.lastKey === 'a') {
                player.velocity.x = -5;
                player.facingRight = false;
            } else if (keys.d.pressed && player.lastKey === 'd') {
                player.velocity.x = 5;
                player.facingRight = true;
            }
        }

        // Run AI
        enemyAI();

        // Collision Detection - Player attacks Enemy
        if (
            player.isAttacking &&
            rectangularCollision({ rectangle1: player, rectangle2: enemy })
        ) {
            player.isAttacking = false; // Only hit once per swing
            enemy.takeHit(10);
            enemyHealthBar.style.width = enemy.health + '%';
        }

        // Collision Detection - Enemy attacks Player
        if (
            enemy.isAttacking &&
            rectangularCollision({ rectangle1: enemy, rectangle2: player })
        ) {
            enemy.isAttacking = false;
            player.takeHit(10);
            playerHealthBar.style.width = player.health + '%';
        }
    }

    // Input Listeners
    window.addEventListener('keydown', (e) => {
        if (gameState !== 'PLAYING' || player.dead) return;

        switch (e.key.toLowerCase()) {
            case 'd':
                keys.d.pressed = true;
                player.lastKey = 'd';
                break;
            case 'a':
                keys.a.pressed = true;
                player.lastKey = 'a';
                break;
            case 'w':
                if (player.velocity.y === 0) player.velocity.y = -15; // Jump
                break;
            case ' ': // Spacebar to attack
                player.attack();
                break;
        }
    });

    window.addEventListener('keyup', (e) => {
        switch (e.key.toLowerCase()) {
            case 'd':
                keys.d.pressed = false;
                break;
            case 'a':
                keys.a.pressed = false;
                break;
        }
    });

    // Game Control Functions
    function startGame() {
        startScreen.style.display = 'none';
        gameState = 'PLAYING';
        initFighters();
        drawBackground(); // Initial draw
        decreaseTimer();
        animate();
        
        // Initial setup to ensure audio context is unblocked
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function resetGame() {
        gameOverScreen.style.display = 'none';
        timer = 60;
        timerElem.innerText = timer;
        playerHealthBar.style.width = '100%';
        enemyHealthBar.style.width = '100%';
        particles.length = 0;
        gameState = 'PLAYING';
        initFighters();
        decreaseTimer();
        animate();
    }

    // Initial Render behind start screen
    initFighters();
    drawBackground();
    player.draw();
    enemy.draw();

</script>
</body>
</html>
