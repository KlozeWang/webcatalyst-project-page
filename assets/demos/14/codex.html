<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Growth Tree 3D</title>
  <style>
    :root{
      --panel-bg: rgba(18, 22, 28, 0.62);
      --panel-border: rgba(255,255,255,0.18);
      --text: #f3f7ff;
      --muted: #b9c7dc;
      --good: #83f5a0;
      --bad: #ff8f8f;
      --accent: #7ec8ff;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b1118;
      color: var(--text);
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      width: min(380px, calc(100vw - 28px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(8px);
    }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    input, button {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    input {
      flex: 1;
      outline: none;
    }
    button {
      cursor: pointer;
      transition: 0.2s ease;
      white-space: nowrap;
    }
    button:hover { transform: translateY(-1px); background: rgba(255,255,255,0.14); }
    button:active { transform: translateY(0); }
    .btn-good { border-color: rgba(131,245,160,0.45); }
    .btn-bad  { border-color: rgba(255,143,143,0.45); }
    .title {
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }
    .habitName {
      color: var(--accent);
      font-weight: 700;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
    .barWrap {
      margin-top: 8px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff8f8f, #ffd37e, #83f5a0);
      transition: width 0.5s ease;
    }
    #message {
      margin-top: 8px;
      font-size: 13px;
      min-height: 18px;
      color: #d9e7ff;
    }
    #hint {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 5;
      color: rgba(228,238,255,0.8);
      font-size: 12px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 9px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="ui">
    <div class="title">🌳 Habit Tree (3D Realistic)</div>
    <div class="row">
      <input id="habitInput" placeholder="Write your habit (e.g., Read 20 min)" maxlength="70">
      <button id="setHabitBtn">Set Habit</button>
    </div>
    <div class="row">
      <button id="doneBtn" class="btn-good">✅ I Did It Today</button>
      <button id="forgotBtn" class="btn-bad">❌ I Forgot Today</button>
    </div>
    <div style="font-size:14px;margin-top:2px;">
      Current habit: <span id="habitLabel" class="habitName">Not set</span>
    </div>
    <div class="stats">
      <div>Streak: <strong id="streak">0</strong></div>
      <div>Growth: <strong id="growth">0/18</strong></div>
      <div>Done days: <strong id="doneCount">0</strong></div>
      <div>Missed days: <strong id="missCount">0</strong></div>
      <div>Health: <strong id="healthText">70%</strong></div>
      <div>Status: <strong id="statusText">Alive</strong></div>
    </div>
    <div class="barWrap"><div id="healthBar" class="bar"></div></div>
    <div id="message"></div>
  </div>

  <div id="hint">Drag to rotate • Scroll to zoom</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const STORAGE_KEY = "habitTree3D_v1";

    let state = {
      habitName: "",
      streak: 0,
      totalDone: 0,
      totalMissed: 0,
      health: 70,
      maxBranches: 18,
      branchData: [],
      lastActionDate: "",
      lastActionType: "",
      dead: false
    };

    let scene, camera, renderer, controls;
    let tree = new THREE.Group();
    let trunk;
    let branches = [];
    let falling = [];
    let growthAnims = [];
    let barkTexture;

    const els = {
      habitInput: document.getElementById("habitInput"),
      setHabitBtn: document.getElementById("setHabitBtn"),
      doneBtn: document.getElementById("doneBtn"),
      forgotBtn: document.getElementById("forgotBtn"),
      habitLabel: document.getElementById("habitLabel"),
      streak: document.getElementById("streak"),
      growth: document.getElementById("growth"),
      doneCount: document.getElementById("doneCount"),
      missCount: document.getElementById("missCount"),
      healthText: document.getElementById("healthText"),
      statusText: document.getElementById("statusText"),
      healthBar: document.getElementById("healthBar"),
      message: document.getElementById("message"),
    };

    function localDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function parseLocalDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function daysBetween(aStr, bStr) {
      const a = parseLocalDate(aStr);
      const b = parseLocalDate(bStr);
      const ms = b - a;
      return Math.floor(ms / 86400000);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        state = { ...state, ...parsed };
        if (!Array.isArray(state.branchData)) state.branchData = [];
      } catch(e) {}
    }

    function setMessage(text, color = "#d9e7ff") {
      els.message.textContent = text;
      els.message.style.color = color;
    }

    function applyAutoMissedDays() {
      if (!state.lastActionDate) return 0;
      const today = localDateStr();
      const diff = daysBetween(state.lastActionDate, today);
      if (diff <= 1) return 0;

      const missed = diff - 1;
      state.totalMissed += missed;
      state.streak = 0;
      state.health = Math.max(0, state.health - missed * 12);

      const breaks = Math.min(missed, state.branchData.length);
      if (breaks > 0) {
        state.branchData.splice(state.branchData.length - breaks, breaks);
      }
      if (state.health <= 0) state.dead = true;

      const y = new Date();
      y.setDate(y.getDate() - 1);
      state.lastActionDate = localDateStr(y);
      state.lastActionType = "auto";
      saveState();
      return missed;
    }

    function canLogToday() {
      return state.lastActionDate !== localDateStr();
    }

    function rand(a, b) { return a + Math.random() * (b - a); }

    function createBarkTexture() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");

      const grad = ctx.createLinearGradient(0,0,256,256);
      grad.addColorStop(0, "#5d3f2a");
      grad.addColorStop(1, "#2f2017");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,256,256);

      for (let x = 0; x < 256; x += 3) {
        const shade = 18 + Math.random() * 55;
        ctx.strokeStyle = `rgba(${shade},${shade*0.7},${shade*0.5},0.25)`;
        ctx.beginPath();
        ctx.moveTo(x + Math.random()*3, 0);
        ctx.lineTo(x + Math.random()*4, 256);
        ctx.stroke();
      }
      for (let i = 0; i < 700; i++) {
        const x = Math.random()*256, y = Math.random()*256;
        const w = 1 + Math.random()*1.8, h = 3 + Math.random()*9;
        ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.18})`;
        ctx.fillRect(x, y, w, h);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 2.5);
      tex.anisotropy = 8;
      return tex;
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x9ec9ff, 14, 42);

      camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(5.5, 4.5, 8.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.getElementById("app").appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 2.1, 0);
      controls.enableDamping = true;
      controls.minDistance = 4;
      controls.maxDistance = 18;
      controls.maxPolarAngle = Math.PI * 0.49;

      const hemi = new THREE.HemisphereLight(0xbfdcff, 0x43603f, 0.9);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff3d4, 1.2);
      sun.position.set(6, 12, 4);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -12;
      sun.shadow.camera.right = 12;
      sun.shadow.camera.top = 12;
      sun.shadow.camera.bottom = -12;
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 40;
      scene.add(sun);

      const ambient = new THREE.AmbientLight(0xffffff, 0.25);
      scene.add(ambient);

      const skyGeo = new THREE.SphereGeometry(50, 32, 16);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          top: { value: new THREE.Color(0x8bc0ff) },
          bottom: { value: new THREE.Color(0xeaf5ff) }
        },
        vertexShader: `
          varying vec3 vPos;
          void main(){
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vPos;
          uniform vec3 top;
          uniform vec3 bottom;
          void main(){
            float h = normalize(vPos).y * 0.5 + 0.5;
            gl_FragColor = vec4(mix(bottom, top, pow(h, 1.4)), 1.0);
          }
        `
      });
      scene.add(new THREE.Mesh(skyGeo, skyMat));

      const groundGeo = new THREE.CircleGeometry(20, 64);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x5f8f53,
        roughness: 0.96,
        metalness: 0.02
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      barkTexture = createBarkTexture();

      createTreeRoot();

      window.addEventListener("resize", onResize);
    }

    function createTreeRoot() {
      tree = new THREE.Group();
      scene.add(tree);

      const trunkGeo = new THREE.CylinderGeometry(0.45, 0.65, 5.1, 16, 20);
      const trunkMat = new THREE.MeshStandardMaterial({
        color: state.dead ? 0x6b625c : 0x6f4b33,
        map: barkTexture,
        roughness: 0.95,
        metalness: 0.02
      });
      trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 2.55;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      tree.add(trunk);

      const rootGeo = new THREE.TorusGeometry(0.7, 0.18, 10, 24);
      const root = new THREE.Mesh(rootGeo, trunkMat);
      root.rotation.x = Math.PI / 2;
      root.position.y = 0.06;
      root.castShadow = true;
      root.receiveShadow = true;
      tree.add(root);

      state.branchData.forEach(data => buildBranch(data, false));
      refreshTreeAppearance();
      updateTrunkScale();
    }

    function branchTemplate() {
      return {
        h: rand(1.0, 4.6),
        len: rand(1.2, 2.1),
        thick: rand(0.08, 0.16),
        angle: rand(0, Math.PI * 2),
        tilt: rand(-0.95, -0.35),
        leafHue: rand(-0.08, 0.08),
        cluster: Math.floor(rand(7, 13))
      };
    }

    function buildBranch(data, animateGrow) {
      const pivot = new THREE.Group();
      pivot.position.set(0, data.h, 0);
      pivot.rotation.y = data.angle;
      pivot.rotation.z = data.tilt;
      pivot.userData.baseTilt = data.tilt;
      pivot.userData.sway = Math.random() * Math.PI * 2;

      const bGeo = new THREE.CylinderGeometry(data.thick * 0.55, data.thick, data.len, 10, 1);
      bGeo.translate(data.len / 2, 0, 0);
      const bMat = new THREE.MeshStandardMaterial({
        color: state.dead ? 0x6b625c : 0x6f4b33,
        map: barkTexture,
        roughness: 0.95,
        metalness: 0.02
      });
      const bMesh = new THREE.Mesh(bGeo, bMat);
      bMesh.castShadow = true;
      bMesh.receiveShadow = true;
      pivot.add(bMesh);

      const leaves = new THREE.Group();
      leaves.position.x = data.len;

      for (let i = 0; i < data.cluster; i++) {
        const size = rand(0.13, 0.28);
        const geo = new THREE.IcosahedronGeometry(size, 1);
        const c = new THREE.Color().setHSL(0.32 + data.leafHue + rand(-0.03, 0.03), 0.55, state.dead ? 0.28 : rand(0.30, 0.45));
        const mat = new THREE.MeshStandardMaterial({
          color: c,
          roughness: 0.85,
          metalness: 0.0
        });
        const leaf = new THREE.Mesh(geo, mat);
        leaf.position.set(rand(-0.4, 0.4), rand(-0.2, 0.35), rand(-0.4, 0.4));
        leaf.castShadow = true;
        leaves.add(leaf);
      }

      pivot.add(leaves);
      pivot.userData.leaves = leaves;

      tree.add(pivot);
      branches.push(pivot);

      if (animateGrow) {
        pivot.scale.setScalar(0.02);
        growthAnims.push({ obj: pivot, t: 0, dur: 0.9 });
      }
    }

    function refreshTreeAppearance() {
      const barkColor = state.dead ? new THREE.Color(0x6b625c) : new THREE.Color(0x6f4b33);
      trunk.material.color.copy(barkColor);

      branches.forEach(br => {
        const branchMesh = br.children[0];
        branchMesh.material.color.copy(barkColor);

        br.userData.leaves.children.forEach(leaf => {
          if (state.dead) {
            leaf.material.color.setHSL(0.09, 0.34, 0.28);
          } else {
            const hsl = {};
            leaf.material.color.getHSL(hsl);
            leaf.material.color.setHSL(0.31 + rand(-0.05,0.05), 0.55, rand(0.30, 0.45));
          }
        });
      });
    }

    function updateTrunkScale() {
      const t = state.branchData.length / state.maxBranches;
      trunk.scale.y = 0.75 + t * 0.55;
      trunk.scale.x = 0.8 + t * 0.3;
      trunk.scale.z = 0.8 + t * 0.3;
    }

    function growOne() {
      if (state.branchData.length >= state.maxBranches) return false;
      const data = branchTemplate();
      state.branchData.push(data);
      buildBranch(data, true);
      updateTrunkScale();
      return true;
    }

    function breakOneBranch() {
      if (!branches.length) return false;
      const br = branches.pop();
      state.branchData.pop();
      scene.attach(br);
      falling.push({
        obj: br,
        vy: rand(0.02, 0.05),
        rx: rand(-0.06, 0.06),
        rz: rand(-0.07, 0.07),
        life: 0
      });
      updateTrunkScale();
      return true;
    }

    function updateUI() {
      els.habitLabel.textContent = state.habitName || "Not set";
      els.habitInput.value = state.habitName;
      els.streak.textContent = state.streak;
      els.growth.textContent = `${state.branchData.length}/${state.maxBranches}`;
      els.doneCount.textContent = state.totalDone;
      els.missCount.textContent = state.totalMissed;
      els.healthText.textContent = `${Math.round(state.health)}%`;
      els.healthBar.style.width = `${Math.max(0, Math.min(100, state.health))}%`;

      let status = "Alive";
      if (state.dead) status = "Dead";
      else if (state.branchData.length >= state.maxBranches) status = "Mature 🌟";
      else if (state.health < 30) status = "Weak";
      els.statusText.textContent = status;
      els.statusText.style.color = state.dead ? "#ff9b9b" : (status.includes("Mature") ? "#a9ffbb" : "#f3f7ff");
    }

    function setHabit() {
      const v = els.habitInput.value.trim();
      if (!v) {
        setMessage("Please write a habit name first.", "#ffb3b3");
        return;
      }
      state.habitName = v;
      saveState();
      updateUI();
      setMessage(`Habit set: ${v}`, "#9fd0ff");
    }

    function tryReviveIfNeeded() {
      if (state.dead && state.health >= 25) {
        state.dead = false;
        refreshTreeAppearance();
        setMessage("Your tree is recovering 🌱 Keep going!", "#aaf7bd");
      }
    }

    function logDone() {
      if (!state.habitName) {
        setMessage("Set your habit first.", "#ffb3b3");
        return;
      }
      if (!canLogToday()) {
        setMessage("You already logged today. Come back tomorrow.", "#ffd8a8");
        return;
      }

      state.lastActionDate = localDateStr();
      state.lastActionType = "done";
      state.streak += 1;
      state.totalDone += 1;
      state.health = Math.min(100, state.health + 8);

      tryReviveIfNeeded();
      const grew = growOne();

      if (grew) {
        if (state.branchData.length >= state.maxBranches) {
          setMessage("Amazing! Your habit tree is fully grown 🌳✨", "#aaf7bd");
        } else {
          setMessage("Great job! A new branch has grown.", "#aaf7bd");
        }
      } else {
        setMessage("You maintained a mature tree. Keep consistency!", "#aaf7bd");
      }

      saveState();
      updateUI();
      refreshTreeAppearance();
    }

    function logForgot() {
      if (!state.habitName) {
        setMessage("Set your habit first.", "#ffb3b3");
        return;
      }
      if (!canLogToday()) {
        setMessage("You already logged today. Come back tomorrow.", "#ffd8a8");
        return;
      }

      state.lastActionDate = localDateStr();
      state.lastActionType = "forgot";
      state.streak = 0;
      state.totalMissed += 1;
      state.health = Math.max(0, state.health - 15);

      const broke = breakOneBranch();
      if (!broke) setMessage("No branches left... the tree is struggling.", "#ff9b9b");
      else setMessage("A branch broke because you missed your habit.", "#ff9b9b");

      if (state.health <= 0) {
        state.dead = true;
        refreshTreeAppearance();
        setMessage("Your tree has died. Restart consistency to revive it.", "#ff8f8f");
      }

      saveState();
      updateUI();
    }

    function bindUI() {
      els.setHabitBtn.addEventListener("click", setHabit);
      els.doneBtn.addEventListener("click", logDone);
      els.forgotBtn.addEventListener("click", logForgot);
      els.habitInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") setHabit();
      });
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, clock.getDelta());
      const t = performance.now() * 0.001;

      trunk.rotation.z = Math.sin(t * 0.55) * 0.012 * (state.dead ? 0.25 : 1.0);

      for (let i = 0; i < branches.length; i++) {
        const br = branches[i];
        const amp = state.dead ? 0.003 : 0.028 * (0.35 + state.health / 100);
        br.rotation.z = br.userData.baseTilt + Math.sin(t * 1.3 + br.userData.sway) * amp;
      }

      for (let i = growthAnims.length - 1; i >= 0; i--) {
        const g = growthAnims[i];
        g.t += dt / g.dur;
        const k = g.t >= 1 ? 1 : 1 - Math.pow(1 - g.t, 3);
        g.obj.scale.setScalar(Math.max(0.02, k));
        if (g.t >= 1) growthAnims.splice(i, 1);
      }

      for (let i = falling.length - 1; i >= 0; i--) {
        const f = falling[i];
        f.vy -= dt * 0.14;
        f.obj.position.y += f.vy;
        f.obj.rotation.x += f.rx;
        f.obj.rotation.z += f.rz;
        f.life += dt;
        if (f.obj.position.y < -0.2 || f.life > 8) {
          scene.remove(f.obj);
          falling.splice(i, 1);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    loadState();
    const autoMissed = applyAutoMissedDays();

    initScene();
    bindUI();
    updateUI();

    if (autoMissed > 0) {
      setMessage(`You missed ${autoMissed} day(s). Branches broke automatically.`, "#ffb3b3");
    } else {
      setMessage("Log your habit every day to grow this tree.", "#cde2ff");
    }

    animate();
  </script>
</body>
</html>
