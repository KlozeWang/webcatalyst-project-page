<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario HTML5</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Arial', sans-serif; }
canvas { display: block; image-rendering: pixelated; border-radius: 4px; box-shadow: 0 0 40px rgba(0,100,255,0.3); }
#ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: white; font-size: 14px; pointer-events: none; text-shadow: 2px 2px 0 #000; display: flex; gap: 40px; z-index: 10; }
#startScreen, #gameOverScreen, #winScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; background: rgba(0,0,0,0.85); color: white; }
#startScreen h1 { font-size: 48px; color: #e52521; text-shadow: 3px 3px 0 #7a1210; margin-bottom: 10px; }
#startScreen h2 { font-size: 20px; color: #fbd000; margin-bottom: 30px; }
.btn { padding: 15px 40px; font-size: 22px; background: #e52521; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 8px; font-weight: bold; text-shadow: 1px 1px 0 #7a1210; transition: transform 0.1s; }
.btn:hover { transform: scale(1.05); background: #ff3333; }
.controls { font-size: 14px; color: #aaa; margin-top: 20px; text-align: center; line-height: 1.8; }
#gameOverScreen h1 { font-size: 42px; color: #e52521; margin-bottom: 15px; }
#winScreen h1 { font-size: 42px; color: #fbd000; margin-bottom: 15px; }
#finalScore { font-size: 24px; color: white; margin-bottom: 20px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="ui">
    <span>MARIO <br><span id="scoreDisplay">000000</span></span>
    <span>COINS <br>🪙<span id="coinDisplay">00</span></span>
    <span>WORLD <br>1-1</span>
    <span>TIME <br><span id="timeDisplay">400</span></span>
    <span>LIVES <br><span id="livesDisplay">3</span></span>
</div>

<canvas id="gameCanvas"></canvas>

<div id="startScreen">
    <h1>SUPER MARIO</h1>
    <h2>HTML5 Edition</h2>
    <button class="btn" onclick="startGame()">START GAME</button>
    <div class="controls">
        <strong>Controls:</strong><br>
        Arrow Keys / WASD - Move & Jump<br>
        Space - Jump (hold for higher)<br>
        Shift - Run
    </div>
</div>

<div id="gameOverScreen" class="hidden">
    <h1>GAME OVER</h1>
    <div id="finalScore">Score: 0</div>
    <button class="btn" onclick="restartGame()">TRY AGAIN</button>
</div>

<div id="winScreen" class="hidden">
    <h1>🎉 YOU WIN! 🎉</h1>
    <div id="winScore">Score: 0</div>
    <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive canvas
const GAME_WIDTH = 800;
const GAME_HEIGHT = 500;
canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

// Scale canvas to fit screen
function resizeCanvas() {
    const scale = Math.min(window.innerWidth / GAME_WIDTH, window.innerHeight / GAME_HEIGHT);
    canvas.style.width = (GAME_WIDTH * scale) + 'px';
    canvas.style.height = (GAME_HEIGHT * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Audio context
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type = 'square', volume = 0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playJumpSound() { playSound(400, 0.1); setTimeout(() => playSound(600, 0.1), 50); }
function playCoinSound() { playSound(988, 0.08); setTimeout(() => playSound(1319, 0.15), 80); }
function playStompSound() { playSound(200, 0.15, 'sawtooth', 0.2); }
function playBumpSound() { playSound(150, 0.1, 'triangle', 0.2); }
function playPowerupSound() { for(let i=0;i<5;i++) setTimeout(()=>playSound(400+i*100,0.1),i*60); }
function playDeathSound() { playSound(400,0.15); setTimeout(()=>playSound(300,0.15),150); setTimeout(()=>playSound(200,0.3),300); }
function playBreakSound() { playSound(300, 0.05, 'sawtooth', 0.15); }
function playFlagSound() { let f=523; for(let i=0;i<8;i++){setTimeout(()=>playSound(f,0.15),i*100);f*=1.12;} }
function playGameOverSound() { [392,349,330,262,294,262].forEach((f,i)=>setTimeout(()=>playSound(f,0.3,'square',0.12),i*250)); }

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let coins = 0;
let lives = 3;
let timeLeft = 400;
let timeTimer = null;
let cameraX = 0;
let screenShake = 0;
let particles = [];
let floatingTexts = [];
let lastTime = 0;
let deltaTime = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

// Level data
const TILE = 32;
const LEVEL_WIDTH = 220;
const LEVEL_HEIGHT = 16;

// Tile types
const EMPTY = 0, GROUND = 1, BRICK = 2, QUESTION = 3, PIPE_TL = 4, PIPE_TR = 5, PIPE_BL = 6, PIPE_BR = 7, HARD = 8, INVISIBLE = 9, FLAG_POLE = 10, FLAG_TOP = 11;

// Level map generation
function generateLevel() {
    let map = [];
    for (let y = 0; y < LEVEL_HEIGHT; y++) {
        map[y] = new Array(LEVEL_WIDTH).fill(EMPTY);
    }
    
    // Ground
    for (let x = 0; x < LEVEL_WIDTH; x++) {
        map[14][x] = GROUND;
        map[15][x] = GROUND;
    }
    
    // Gaps
    const gaps = [[68,70],[86,88],[153,155]];
    gaps.forEach(([s,e]) => {
        for(let x=s;x<=e;x++){map[14][x]=EMPTY;map[15][x]=EMPTY;}
    });
    
    // Question blocks with coins/powerups
    const questionBlocks = [
        [16,10,'coin'],[21,10,'powerup'],[23,10,'coin'],[22,6,'coin'],
        [78,10,'coin'],[94,10,'coin'],[106,10,'powerup'],[109,10,'coin'],
        [112,10,'coin'],[129,10,'coin'],[130,10,'coin'],[170,10,'powerup']
    ];
    questionBlocks.forEach(([x,y,type]) => {
        if(y<LEVEL_HEIGHT && x<LEVEL_WIDTH) map[y][x] = QUESTION;
    });
    
    // Brick blocks
    const bricks = [
        [20,10],[22,10],[24,10],
        [77,10],[79,10],[80,10],
        [91,10],[92,10],[93,10],[95,10],
        [100,6],[101,6],[102,6],[103,6],[104,6],[105,6],
        [118,10],[119,10],[120,10],
        [128,10],[131,10],
        [168,10],[169,10],[171,10]
    ];
    bricks.forEach(([x,y]) => {
        if(y<LEVEL_HEIGHT && x<LEVEL_WIDTH) map[y][x] = BRICK;
    });
    
    // Pipes
    const pipes = [
        [28,12,2],[38,11,3],[46,10,4],[57,11,3],[163,12,2],[179,12,2]
    ];
    pipes.forEach(([x,y,h]) => {
        for(let i=0;i<h;i++){
            if(y+i<LEVEL_HEIGHT){
                map[y+i][x] = i===0 ? PIPE_TL : PIPE_BL;
                map[y+i][x+1] = i===0 ? PIPE_TR : PIPE_BR;
            }
        }
    });
    
    // Stairs (end of level)
    for(let i=0;i<8;i++){
        for(let j=0;j<=i;j++){
            map[13-j][134+i] = HARD;
        }
    }
    // Descending stairs
    for(let i=0;i<8;i++){
        for(let j=0;j<=i;j++){
            map[13-j][148-i] = HARD;
        }
    }
    // Final stairs to flag
    for(let i=0;i<9;i++){
        for(let j=0;j<=i;j++){
            map[13-j][155+i] = HARD;
        }
    }
    
    // Flag pole
    map[5][164] = FLAG_TOP;
    for(let y=6;y<=13;y++) map[y][164] = FLAG_POLE;
    
    return map;
}

let levelMap = [];

// Entities
let player = null;
let enemies = [];
let coinEntities = [];
let powerupEntities = [];
let mushrooms = [];

class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 24; this.h = 32;
        this.vx = 0; this.vy = 0;
        this.speed = 0.4;
        this.runSpeed = 0.6;
        this.maxSpeed = 3.5;
        this.runMaxSpeed = 5.5;
        this.jumpForce = -9;
        this.gravity = 0.45;
        this.friction = 0.85;
        this.onGround = false;
        this.facing = 1;
        this.state = 'small'; // small, big
        this.invincible = 0;
        this.animFrame = 0;
        this.animTimer = 0;
        this.dead = false;
        this.deathTimer = 0;
        this.won = false;
        this.flagSlide = false;
        this.flagY = 0;
        this.crouching = false;
        this.wasJumpHeld = false;
        this.jumpHeld = false;
    }
    
    update() {
        if (this.dead) {
            this.deathTimer++;
            this.vy += this.gravity;
            this.y += this.vy;
            if (this.deathTimer > 90) {
                lives--;
                if (lives <= 0) {
                    gameState = 'gameover';
                    document.getElementById('gameOverScreen').classList.remove('hidden');
                    document.getElementById('finalScore').textContent = 'Score: ' + score;
                    playGameOverSound();
                } else {
                    resetLevel();
                }
            }
            return;
        }
        
        if (this.won) {
            if (this.flagSlide) {
                if (this.y < 13 * TILE - this.h) {
                    this.y += 2;
                } else {
                    this.flagSlide = false;
                    this.x = 164 * TILE - this.w;
                    this.vx = 2;
                }
            } else {
                this.x += this.vx;
                this.vx *= 0.9;
                if (this.x > 170 * TILE) {
                    gameState = 'win';
                    document.getElementById('winScreen').classList.remove('hidden');
                    document.getElementById('winScore').textContent = 'Score: ' + score;
                    playFlagSound();
                }
            }
            return;
        }
        
        // Input
        let moveLeft = keys['ArrowLeft'] || keys['KeyA'];
        let moveRight = keys['ArrowRight'] || keys['KeyD'];
        let jumpKey = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
        let runKey = keys['ShiftLeft'] || keys['ShiftRight'];
        
        let currentMaxSpeed = runKey ? this.runMaxSpeed : this.maxSpeed;
        let currentAccel = runKey ? this.runSpeed : this.speed;
        
        if (moveLeft) {
            this.vx -= currentAccel;
            this.facing = -1;
        }
        if (moveRight) {
            this.vx += currentAccel;
            this.facing = 1;
        }
        
        if (!moveLeft && !moveRight) {
            this.vx *= this.friction;
            if (Math.abs(this.vx) < 0.1) this.vx = 0;
        }
        
        this.vx = Math.max(-currentMaxSpeed, Math.min(currentMaxSpeed, this.vx));
        
        // Jump
        if (jumpKey && this.onGround && !this.wasJumpHeld) {
            this.vy = this.jumpForce;
            this.onGround = false;
            this.wasJumpHeld = true;
            playJumpSound();
        }
        if (!jumpKey) {
            this.wasJumpHeld = false;
            if (this.vy < this.jumpForce * 0.5) {
                this.vy = this.jumpForce * 0.5;
            }
        }
        
        // Gravity
        this.vy += this.gravity;
        if (this.vy > 12) this.vy = 12;
        
        // Move X
        this.x += this.vx;
        this.resolveCollisionX();
        
        // Move Y
        this.y += this.vy;
        this.onGround = false;
        this.resolveCollisionY();
        
        // Prevent going left of camera
        if (this.x < cameraX) { this.x = cameraX; this.vx = 0; }
        
        // Fall death
        if (this.y > LEVEL_HEIGHT * TILE + 50) {
            this.die();
        }
        
        // Invincibility timer
        if (this.invincible > 0) this.invincible--;
        
        // Animation
        this.animTimer++;
        if (Math.abs(this.vx) > 0.5 && this.onGround) {
            if (this.animTimer % (Math.abs(this.vx) > 3 ? 4 : 6) === 0) {
                this.animFrame = (this.animFrame + 1) % 3;
            }
        } else if (this.onGround) {
            this.animFrame = 0;
        }
        
        // Coin collection
        for (let i = coinEntities.length - 1; i >= 0; i--) {
            let c = coinEntities[i];
            if (!c.collected && this.overlaps(c)) {
                c.collected = true;
                coins++;
                score += 200;
                playCoinSound();
                addFloatingText(c.x, c.y, '200');
                spawnParticles(c.x + 8, c.y + 8, '#fbd000', 5);
                if (coins % 100 === 0) { lives++; playPowerupSound(); }
            }
        }
        
        // Powerup collection
        for (let i = mushrooms.length - 1; i >= 0; i--) {
            let m = mushrooms[i];
            if (this.overlaps(m) && !m.active) {
                m.active = true;
                if (this.state === 'small') {
                    this.state = 'big';
                    this.h = 48;
                    this.y -= 16;
                }
                score += 1000;
                playPowerupSound();
                addFloatingText(m.x, m.y, '1000');
            }
        }
        
        // Enemy collision
        for (let e of enemies) {
            if (e.dead || e.squished) continue;
            if (this.overlaps(e)) {
                if (this.vy > 0 && this.y + this.h - this.vy <= e.y + e.h * 0.5) {
                    // Stomp
                    e.squishTimer = 30;
                    e.squished = true;
                    e.h = 8;
                    this.vy = -7;
                    score += 100;
                    playStompSound();
                    addFloatingText(e.x, e.y, '100');
                    spawnParticles(e.x + e.w/2, e.y, '#8B4513', 3);
                } else if (this.invincible <= 0) {
                    if (this.state === 'big') {
                        this.state = 'small';
                        this.h = 32;
                        this.y += 16;
                        this.invincible = 90;
                        playBumpSound();
                    } else {
                        this.die();
                    }
                }
            }
        }
        
        // Flag pole
        if (this.x + this.w > 164 * TILE && this.x < 164 * TILE + TILE && !this.won) {
            this.won = true;
            this.flagSlide = true;
            this.vx = 0;
            this.y = 5 * TILE;
            score += Math.max(0, Math.floor((13 * TILE - this.y) / TILE) * 100);
            playFlagSound();
        }
    }
    
    die() {
        if (this.dead) return;
        this.dead = true;
        this.vy = -8;
        this.vx = 0;
        playDeathSound();
        screenShake = 15;
    }
    
    resolveCollisionX() {
        let left = Math.floor(this.x / TILE);
        let right = Math.floor((this.x + this.w - 1) / TILE);
        let top = Math.floor(this.y / TILE);
        let bottom = Math.floor((this.y + this.h - 1) / TILE);
        
        for (let y = top; y <= bottom; y++) {
            for (let x = left; x <= right; x++) {
                if (y < 0 || y >= LEVEL_HEIGHT || x < 0 || x >= LEVEL_WIDTH) continue;
                let tile = levelMap[y][x];
                if (tile !== EMPTY && tile !== INVISIBLE && tile !== FLAG_POLE && tile !== FLAG_TOP) {
                    if (this.vx > 0) {
                        this.x = x * TILE - this.w;
                        this.vx = 0;
                    } else if (this.vx < 0) {
                        this.x = (x + 1) * TILE;
                        this.vx = 0;
                    }
                }
            }
        }
    }
    
    resolveCollisionY() {
        let left = Math.floor(this.x / TILE);
        let right = Math.floor((this.x + this.w - 1) / TILE);
        let top = Math.floor(this.y / TILE);
        let bottom = Math.floor((this.y + this.h - 1) / TILE);
        
        for (let y = top; y <= bottom; y++) {
            for (let x = left; x <= right; x++) {
                if (y < 0 || y >= LEVEL_HEIGHT || x < 0 || x >= LEVEL_WIDTH) continue;
                let tile = levelMap[y][x];
                if (tile !== EMPTY && tile !== INVISIBLE && tile !== FLAG_POLE && tile !== FLAG_TOP) {
                    if (this.vy > 0) {
                        this.y = y * TILE - this.h;
                        this.vy = 0;
                        this.onGround = true;
                    } else if (this.vy < 0) {
                        this.y = (y + 1) * TILE;
                        this.vy = 0;
                        // Hit block from below
                        if (tile === BRICK) {
                            if (this.state === 'big') {
                                levelMap[y][x] = EMPTY;
                                playBreakSound();
                                score += 50;
                                spawnParticles(x * TILE + 16, y * TILE + 16, '#c84c0c', 8);
                                screenShake = 5;
                            } else {
                                playBumpSound();
                                spawnParticles(x * TILE + 16, y * TILE + 16, '#c84c0c', 3);
                            }
                        } else if (tile === QUESTION) {
                            levelMap[y][x] = HARD;
                            let content = getQuestionContent(y, x);
                            if (content === 'coin') {
                                coins++;
                                score += 200;
                                playCoinSound();
                                addFloatingText(x * TILE, y * TILE - 20, '200');
                                spawnParticles(x * TILE + 16, y * TILE, '#fbd000', 5);
                            } else if (content === 'powerup') {
                                mushrooms.push({
                                    x: x * TILE, y: (y - 1) * TILE,
                                    w: 24, h: 24, vx: 2, vy: 0,
                                    active: false, activeTimer: 0
                                });
                                playPowerupSound();
                            }
                            playBumpSound();
                            spawnParticles(x * TILE + 16, y * TILE + 16, '#fbd000', 3);
                        }
                    }
                }
            }
        }
    }
    
    overlaps(entity) {
        return this.x < entity.x + entity.w && this.x + this.w > entity.x &&
               this.y < entity.y + entity.h && this.y + this.h > entity.y;
    }
    
    draw() {
        if (this.dead && this.deathTimer > 10) return;
        if (this.invincible > 0 && Math.floor(this.invincible / 3) % 2 === 0) return;
        
        let sx = this.x - cameraX;
        let sy = this.y;
        
        ctx.save();
        ctx.translate(sx + this.w/2, sy + this.h);
        ctx.scale(this.facing, 1);
        
        if (this.state === 'big') {
            // Big Mario
            // Hat
            ctx.fillStyle = '#e52521';
            ctx.fillRect(-12, -48, 24, 8);
            ctx.fillRect(-10, -52, 20, 6);
            // Face
            ctx.fillStyle = '#fbb';
            ctx.fillRect(-10, -40, 20, 12);
            // Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(2, -38, 4, 4);
            // Mustache
            ctx.fillStyle = '#4a2800';
            ctx.fillRect(-2, -32, 14, 3);
            // Body
            ctx.fillStyle = '#e52521';
            ctx.fillRect(-12, -28, 24, 12);
            // Overalls
            ctx.fillStyle = '#0050d4';
            ctx.fillRect(-12, -20, 24, 12);
            // Buttons
            ctx.fillStyle = '#fbd000';
            ctx.fillRect(-4, -18, 3, 3);
            ctx.fillRect(4, -18, 3, 3);
            // Legs
            if (!this.onGround) {
                ctx.fillStyle = '#0050d4';
                ctx.fillRect(-12, -8, 10, 8);
                ctx.fillRect(2, -12, 10, 8);
                // Shoes
                ctx.fillStyle = '#6b3300';
                ctx.fillRect(-14, -2, 12, 4);
                ctx.fillRect(4, -6, 12, 4);
            } else if (Math.abs(this.vx) > 0.5) {
                let legOff = this.animFrame === 1 ? 4 : 0;
                ctx.fillStyle = '#0050d4';
                ctx.fillRect(-12, -8 + legOff, 10, 8);
                ctx.fillRect(2, -8 - legOff, 10, 8);
                ctx.fillStyle = '#6b3300';
                ctx.fillRect(-14, -2 + legOff, 12, 4);
                ctx.fillRect(4, -2 - legOff, 12, 4);
            } else {
                ctx.fillStyle = '#0050d4';
                ctx.fillRect(-12, -8, 10, 8);
                ctx.fillRect(2, -8, 10, 8);
                ctx.fillStyle = '#6b3300';
                ctx.fillRect(-14, -2, 12, 4);
                ctx.fillRect(4, -2, 12, 4);
            }
        } else {
            // Small Mario
            // Hat
            ctx.fillStyle = '#e52521';
            ctx.fillRect(-10, -32, 20, 6);
            ctx.fillRect(-8, -36, 16, 5);
            // Face
            ctx.fillStyle = '#fbb';
            ctx.fillRect(-8, -26, 16, 10);
            // Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(2, -24, 3, 3);
            // Mustache
            ctx.fillStyle = '#4a2800';
            ctx.fillRect(-2, -19, 12, 2);
            // Body
            ctx.fillStyle = '#e52521';
            ctx.fillRect(-10, -16, 20, 8);
            // Overalls
            ctx.fillStyle = '#0050d4';
            ctx.fillRect(-10, -8, 20, 8);
            // Buttons
            ctx.fillStyle = '#fbd000';
            ctx.fillRect(-3, -7, 2, 2);
            ctx.fillRect(3, -7, 2, 2);
            // Shoes
            if (!this.onGround) {
                ctx.fillStyle = '#6b3300';
                ctx.fillRect(-12, -2, 10, 4);
                ctx.fillRect(2, -4, 10, 4);
            } else if (Math.abs(this.vx) > 0.5) {
                let legOff = this.animFrame === 1 ? 2 : 0;
                ctx.fillStyle = '#6b3300';
                ctx.fillRect(-12, -2 + legOff, 10, 4);
                ctx.fillRect(2, -2 - legOff, 10, 4);
            } else {
                ctx.fillStyle = '#6b3300';
                ctx.fillRect(-12, -2, 10, 4);
                ctx.fillRect(2, -2, 10, 4);
            }
        }
        
        ctx.restore();
    }
}

function getQuestionContent(y, x) {
    // Simple mapping - could be more complex
    if (x === 21 || x === 106 || x === 170) return 'powerup';
    return 'coin';
}

// Enemy class
class Enemy {
    constructor(x, y, type = 'goomba') {
        this.x = x; this.y = y;
        this.type = type;
        this.startX = x;
        this.vx = -1;
        this.vy = 0;
        this.w = type === 'goomba' ? 28 : 28;
        this.h = type === 'goomba' ? 28 : 32;
        this.dead = false;
        this.squished = false;
        this.squishTimer = 0;
        this.animFrame = 0;
        this.animTimer = 0;
        this.patrolDist = 80 + Math.random() * 60;
    }
    
    update() {
        if (this.dead) return;
        
        if (this.squished) {
            this.squishTimer--;
            if (this.squishTimer <= 0) this.dead = true;
            return;
        }
        
        this.vy += 0.4;
        this.x += this.vx;
        this.y += this.vy;
        
        // Simple ground collision
        let bottom = Math.floor((this.y + this.h) / TILE);
        let left = Math.floor(this.x / TILE);
        let right = Math.floor((this.x + this.w - 1) / TILE);
        
        this.onGround = false;
        for (let x = left; x <= right; x++) {
            if (bottom >= 0 && bottom < LEVEL_HEIGHT && x >= 0 && x < LEVEL_WIDTH) {
                if (levelMap[bottom][x] !== EMPTY && levelMap[bottom][x] !== INVISIBLE) {
                    this.y = bottom * TILE - this.h;
                    this.vy = 0;
                    this.onGround = true;
                }
            }
        }
        
        // Wall collision
        let side = this.vx > 0 ? Math.floor((this.x + this.w) / TILE) : Math.floor(this.x / TILE);
        let midY = Math.floor((this.y + this.h/2) / TILE);
        if (midY >= 0 && midY < LEVEL_HEIGHT && side >= 0 && side < LEVEL_WIDTH) {
            if (levelMap[midY][side] !== EMPTY && levelMap[midY][side] !== INVISIBLE) {
                this.vx *= -1;
            }
        }
        
        // Edge detection - turn around at edges
        if (this.onGround) {
            let checkX = this.vx > 0 ? Math.floor((this.x + this.w + 2) / TILE) : Math.floor((this.x - 2) / TILE);
            let checkY = Math.floor((this.y + this.h + 2) / TILE);
            if (checkY < LEVEL_HEIGHT && checkX >= 0 && checkX < LEVEL_WIDTH) {
                if (levelMap[checkY][checkX] === EMPTY || levelMap[checkY][checkX] === INVISIBLE) {
                    this.vx *= -1;
                }
            }
        }
        
        // Animation
        this.animTimer++;
        if (this.animTimer % 12 === 0) this.animFrame = (this.animFrame + 1) % 2;
        
        // Remove if too far from camera
        if (this.x < cameraX - 200 || this.x > cameraX + GAME_WIDTH + 200) {
            this.dead = true;
        }
    }
    
    draw() {
        if (this.dead) return;
        let sx = this.x - cameraX;
        let sy = this.y;
        
        if (sx < -50 || sx > GAME_WIDTH + 50) return;
        
        if (this.squished) {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(sx, sy + this.h - 8, this.w, 8);
            return;
        }
        
        if (this.type === 'goomba') {
            // Body
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(sx + 14, sy + 12, 14, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(sx, sy + 12, 28, 12);
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(sx + 5, sy + 6, 7, 8);
            ctx.fillRect(sx + 16, sy + 6, 7, 8);
            ctx.fillStyle = '#000';
            ctx.fillRect(sx + 8, sy + 8, 4, 5);
            ctx.fillRect(sx + 17, sy + 8, 4, 5);
            // Eyebrows
            ctx.fillStyle = '#000';
            ctx.fillRect(sx + 5, sy + 4, 7, 2);
            ctx.fillRect(sx + 16, sy + 4, 7, 2);
            // Feet
            ctx.fillStyle = '#000';
            let footOff = this.animFrame === 0 ? 0 : 3;
            ctx.fillRect(sx + 2, sy + 22 + footOff, 10, 6);
            ctx.fillRect(sx + 16, sy + 22 - footOff, 10, 6);
        } else if (this.type === 'koopa') {
            // Shell
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.ellipse(sx + 14, sy + 18, 14, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fbd000';
            ctx.beginPath();
            ctx.ellipse(sx + 14, sy + 20, 8, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            // Head
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.arc(sx + 14, sy + 6, 8, 0, Math.PI * 2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(sx + 16, sy + 2, 5, 5);
            ctx.fillStyle = '#000';
            ctx.fillRect(sx + 18, sy + 3, 3, 3);
            // Feet
            ctx.fillStyle = '#fbb';
            ctx.fillRect(sx + 4, sy + 26, 8, 6);
            ctx.fillRect(sx + 16, sy + 26, 8, 6);
        }
    }
}

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: -Math.random() * 5 - 2,
            life: 30 + Math.random() * 20,
            color,
            size: 2 + Math.random() * 4
        });
    }
}

function addFloatingText(x, y, text) {
    floatingTexts.push({ x, y, text, life: 40, vy: -2 });
}

// Drawing functions
function drawTile(x, y, type) {
    let sx = x * TILE - cameraX;
    let sy = y * TILE;
    
    if (sx < -TILE || sx > GAME_WIDTH + TILE) return;
    
    switch(type) {
        case GROUND:
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(sx, sy, TILE, TILE);
            ctx.fillStyle = '#e09060';
            ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(sx + 4, sy + 4, TILE - 8, TILE - 8);
            // Brick pattern
            ctx.strokeStyle = '#a03000';
            ctx.lineWidth = 1;
            ctx.strokeRect(sx, sy, TILE, TILE);
            break;
            
        case BRICK:
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(sx, sy, TILE, TILE);
            ctx.fillStyle = '#e09060';
            ctx.fillRect(sx + 1, sy + 1, 14, 14);
            ctx.fillRect(sx + 17, sy + 1, 14, 14);
            ctx.fillRect(sx + 1, sy + 17, 14, 14);
            ctx.fillRect(sx + 17, sy + 17, 14, 14);
            ctx.strokeStyle = '#8B3000';
            ctx.lineWidth = 1;
            ctx.strokeRect(sx, sy, TILE, TILE);
            break;
            
        case QUESTION:
            let pulse = Math.sin(Date.now() / 200) * 0.15 + 0.85;
            ctx.fillStyle = '#fbd000';
            ctx.fillRect(sx, sy, TILE, TILE);
            ctx.fillStyle = '#c8a000';
            ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
            ctx.fillStyle = '#fbd000';
            ctx.fillRect(sx + 4, sy + 4, TILE - 8, TILE - 8);
            // Question mark
            ctx.fillStyle = '#8B6914';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('?', sx + 16, sy + 24);
            break;
            
        case HARD:
            ctx.fillStyle = '#8B8B8B';
            ctx.fillRect(sx, sy, TILE, TILE);
            ctx.fillStyle = '#A0A0A0';
            ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(sx + 4, sy + 4, TILE - 8, TILE - 8);
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.strokeRect(sx, sy, TILE, TILE);
            break;
            
        case PIPE_TL:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(sx - 2, sy, TILE + 2, TILE);
            ctx.fillStyle = '#00d800';
            ctx.fillRect(sx, sy + 2, TILE - 4, TILE - 4);
            ctx.fillStyle = '#50ff50';
            ctx.fillRect(sx + 4, sy + 4, 6, TILE - 8);
            break;
            
        case PIPE_TR:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(sx, sy, TILE + 2, TILE);
            ctx.fillStyle = '#00d800';
            ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
            ctx.fillStyle = '#008800';
            ctx.fillRect(sx + TILE - 6, sy + 4, 4, TILE - 8);
            break;
            
        case PIPE_BL:
        case PIPE_BR:
            ctx.fillStyle = '#00a800';
            ctx.fillRect(sx, sy, TILE, TILE);
            ctx.fillStyle = '#00d800';
            ctx.fillRect(sx + 2, sy, TILE - 4, TILE);
            ctx.fillStyle = '#50ff50';
            ctx.fillRect(sx + 4, sy, 6, TILE);
            break;
            
        case FLAG_POLE:
            ctx.fillStyle = '#888';
            ctx.fillRect(sx + 14, sy, 4, TILE);
            break;
            
        case FLAG_TOP:
            ctx.fillStyle = '#888';
            ctx.fillRect(sx + 14, sy + 8, 4, TILE - 8);
            // Ball on top
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.arc(sx + 16, sy + 8, 6, 0, Math.PI * 2);
            ctx.fill();
            // Flag
            ctx.fillStyle = '#e52521';
            ctx.beginPath();
            ctx.moveTo(sx + 14, sy + 8);
            ctx.lineTo(sx - 16, sy + 16);
            ctx.lineTo(sx + 14, sy + 24);
            ctx.fill();
            break;
    }
}

function drawBackground() {
    // Sky gradient
    let grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    grad.addColorStop(0, '#5c94fc');
    grad.addColorStop(0.7, '#87CEEB');
    grad.addColorStop(1, '#b8d8f0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    
    // Clouds (parallax)
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 20; i++) {
        let cx = (i * 350 + 100) - cameraX * 0.2;
        if (cx < -200) cx += 20 * 350;
        let cy = 40 + (i % 3) * 50;
        drawCloud(cx, cy, 1 + (i % 3));
    }
    
    // Hills (parallax)
    ctx.fillStyle = '#5aad5a';
    for (let i = 0; i < 15; i++) {
        let hx = (i * 500 + 50) - cameraX * 0.4;
        if (hx < -300) hx += 15 * 500;
        drawHill(hx, 14 * TILE - cameraY(), 80 + (i % 3) * 30);
    }
    
    // Bushes (parallax)
    ctx.fillStyle = '#3a8a3a';
    for (let i = 0; i < 25; i++) {
        let bx = (i * 280 + 150) - cameraX * 0.6;
        if (bx < -200) bx += 25 * 280;
        drawBush(bx, 14 * TILE - cameraY());
    }
}

function cameraY() { return 0; }

function drawCloud(x, y, size) {
    for (let i = 0; i < size; i++) {
        ctx.beginPath();
        ctx.arc(x + i * 20, y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + i * 20 + 10, y - 10, 15, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawHill(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#4a9a4a';
    ctx.beginPath();
    ctx.arc(x + size * 0.3, y, size * 0.6, Math.PI, 0);
    ctx.fill();
}

function drawBush(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 16, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 20, y, 12, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x - 16, y, 12, Math.PI, 0);
    ctx.fill();
}

function drawMushroom(m) {
    let sx = m.x - cameraX;
    let sy = m.y;
    
    // Stem
    ctx.fillStyle = '#fbb';
    ctx.fillRect(sx + 6, sy + 12, 12, 12);
    // Cap
    ctx.fillStyle = '#e52521';
    ctx.beginPath();
    ctx.arc(sx + 12, sy + 10, 12, Math.PI, 0);
    ctx.fill();
    // Spots
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx + 6, sy + 6, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx + 18, sy + 6, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx + 12, sy + 2, 3, 0, Math.PI * 2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(sx + 8, sy + 14, 2, 3);
    ctx.fillRect(sx + 14, sy + 14, 2, 3);
}

function drawCoin(c) {
    if (c.collected) return;
    let sx = c.x - cameraX;
    let sy = c.y;
    let stretch = Math.abs(Math.sin(Date.now() / 150));
    
    ctx.fillStyle = '#fbd000';
    ctx.beginPath();
    ctx.ellipse(sx + 8, sy + 8, 6 * stretch + 2, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c8a000';
    ctx.beginPath();
    ctx.ellipse(sx + 8, sy + 8, 3 * stretch + 1, 5, 0, 0, Math.PI * 2);
    ctx.fill();
}

function updateEnemies() {
    for (let e of enemies) {
        e.update();
    }
    enemies = enemies.filter(e => !e.dead);
}

function updateMushrooms() {
    for (let m of mushrooms) {
        if (!m.active) {
            m.activeTimer++;
            if (m.activeTimer > 10) {
                m.active = true;
                m.vy = -4;
            }
        }
        if (m.active) {
            m.vy += 0.4;
            m.x += m.vx;
            m.y += m.vy;
            
            // Ground collision
            let bottom = Math.floor((m.y + m.h) / TILE);
            let left = Math.floor(m.x / TILE);
            let right = Math.floor((m.x + m.w - 1) / TILE);
            for (let x = left; x <= right; x++) {
                if (bottom >= 0 && bottom < LEVEL_HEIGHT && x >= 0 && x < LEVEL_WIDTH) {
                    if (levelMap[bottom][x] !== EMPTY && levelMap[bottom][x] !== INVISIBLE) {
                        m.y = bottom * TILE - m.h;
                        m.vy = 0;
                    }
                }
            }
            
            // Wall collision
            let side = m.vx > 0 ? Math.floor((m.x + m.w) / TILE) : Math.floor(m.x / TILE);
            let midY = Math.floor((m.y + m.h/2) / TILE);
            if (midY >= 0 && midY < LEVEL_HEIGHT && side >= 0 && side < LEVEL_WIDTH) {
                if (levelMap[midY][side] !== EMPTY && levelMap[midY][side] !== INVISIBLE) {
                    m.vx *= -1;
                }
            }
        }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function updateFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

function drawParticles() {
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 50;
        ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
    for (let ft of floatingTexts) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.globalAlpha = ft.life / 40;
        ctx.fillText(ft.text, ft.x - cameraX, ft.y);
    }
    ctx.globalAlpha = 1;
}

// Generate coins from map
function generateCoins() {
    coinEntities = [];
    for (let y = 0; y < LEVEL_HEIGHT; y++) {
        for (let x = 0; x < LEVEL_WIDTH; x++) {
            // Place coins in the air in interesting spots
            if (x === 30 && y === 11) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 31 && y === 11) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 32 && y === 11) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 50 && y === 9) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 51 && y === 9) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 80 && y === 7) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 120 && y === 11) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 121 && y === 11) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 122 && y === 11) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 140 && y === 10) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
            if (x === 141 && y === 10) coinEntities.push({x: x*TILE+4, y: y*TILE+4, w: 16, h: 16, collected: false});
        }
    }
}

function generateEnemies() {
    enemies = [];
    const enemyPositions = [
        [22, 'goomba'], [40, 'goomba'], [51, 'goomba'], [52, 'goomba'],
        [80, 'goomba'], [82, 'goomba'], [97, 'goomba'], [98, 'goomba'],
        [107, 'koopa'], [115, 'goomba'], [116, 'goomba'],
        [125, 'goomba'], [126, 'goomba'], [127, 'goomba'],
        [145, 'goomba'], [146, 'goomba'],
        [160, 'koopa'], [161, 'goomba'], [162, 'goomba']
    ];
    enemyPositions.forEach(([x, type]) => {
        enemies.push(new Enemy(x * TILE, 12 * TILE, type));
    });
}

function resetLevel() {
    levelMap = generateLevel();
    player = new Player(3 * TILE, 12 * TILE);
    cameraX = 0;
    particles = [];
    floatingTexts = [];
    mushrooms = [];
    generateCoins();
    generateEnemies();
    if (timeTimer) clearInterval(timeTimer);
    timeLeft = 400;
    timeTimer = setInterval(() => {
        if (gameState === 'playing') {
            timeLeft--;
            if (timeLeft <= 0) {
                player.die();
            }
        }
    }, 1000);
}

function startGame() {
    initAudio();
    document.getElementById('startScreen').classList.add('hidden');
    score = 0;
    coins = 0;
    lives = 3;
    gameState = 'playing';
    resetLevel();
}

function restartGame() {
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('winScreen').classList.add('hidden');
    score = 0;
    coins = 0;
    lives = 3;
    gameState = 'playing';
    resetLevel();
}

function updateUI() {
    document.getElementById('scoreDisplay').textContent = String(score).padStart(6, '0');
    document.getElementById('coinDisplay').textContent = String(coins).padStart(2, '0');
    document.getElementById('timeDisplay').textContent = timeLeft;
    document.getElementById('livesDisplay').textContent = lives;
}

// Main game loop
function gameLoop(timestamp) {
    deltaTime = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;
    
    if (gameState === 'playing') {
        player.update();
        updateEnemies();
        updateMushrooms();
        updateParticles();
        updateFloatingTexts();
        
        // Camera follow
        let targetCamX = player.x - GAME_WIDTH / 3;
        cameraX += (targetCamX - cameraX) * 0.1;
        cameraX = Math.max(0, Math.min(cameraX, LEVEL_WIDTH * TILE - GAME_WIDTH));
        
        // Screen shake
        if (screenShake > 0) {
            screenShake--;
        }
        
        updateUI();
    }
    
    // Render
    ctx.save();
    if (screenShake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake,
            (Math.random() - 0.5) * screenShake
        );
    }
    
    drawBackground();
    
    // Draw tiles
    let startTile = Math.max(0, Math.floor(cameraX / TILE) - 1);
    let endTile = Math.min(LEVEL_WIDTH, Math.ceil((cameraX + GAME_WIDTH) / TILE) + 1);
    
    for (let y = 0; y < LEVEL_HEIGHT; y++) {
        for (let x = startTile; x < endTile; x++) {
            if (levelMap[y][x] !== EMPTY) {
                drawTile(x, y, levelMap[y][x]);
            }
        }
    }
    
    // Draw entities
    for (let c of coinEntities) drawCoin(c);
    for (let m of mushrooms) drawMushroom(m);
    for (let e of enemies) e.draw();
    if (player) player.draw();
    drawParticles();
    drawFloatingTexts();
    
    ctx.restore();
    
    requestAnimationFrame(gameLoop);
}

// Initialize
levelMap = generateLevel();
player = new Player(3 * TILE, 12 * TILE);
generateCoins();
generateEnemies();
requestAnimationFrame(gameLoop);
</script>
