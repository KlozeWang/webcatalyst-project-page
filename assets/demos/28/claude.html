<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo da Cobrinha 🐍</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    overflow: hidden;
    padding: 10px;
  }
  h1 {
    margin-bottom: 10px;
    text-shadow: 0 0 10px #4ecca3;
    font-size: clamp(1.5rem, 5vw, 2.5rem);
  }
  #score {
    font-size: 1.3rem;
    margin-bottom: 10px;
    color: #4ecca3;
  }
  #gameContainer {
    position: relative;
    border: 3px solid #4ecca3;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(78, 204, 163, 0.5);
    background: #0a0a1f;
  }
  canvas {
    display: block;
    border-radius: 7px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    text-align: center;
    padding: 20px;
  }
  .overlay h2 { font-size: 2rem; margin-bottom: 15px; color: #4ecca3; }
  .overlay p { margin-bottom: 20px; font-size: 1rem; }
  button {
    background: #4ecca3;
    color: #0a0a1f;
    border: none;
    padding: 12px 30px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.1); }
  .hidden { display: none; }
  #controls {
    margin-top: 15px;
    display: none;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 5px;
  }
  #controls button {
    padding: 0;
    font-size: 1.5rem;
    border-radius: 10px;
  }
  .ctrl-up { grid-column: 2; grid-row: 1; }
  .ctrl-left { grid-column: 1; grid-row: 2; }
  .ctrl-right { grid-column: 3; grid-row: 2; }
  .ctrl-down { grid-column: 2; grid-row: 3; }
  @media (max-width: 600px) {
    #controls { display: grid; }
  }
</style>
</head>
<body>
  <h1>🐍 Cobrinha das Frutas</h1>
  <div id="score">Pontos: 0 | Recorde: 0</div>
  <div id="gameContainer">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="startScreen" class="overlay">
      <h2>Bem-vindo!</h2>
      <p>Use as setas ou WASD para mover.<br>Coma as frutas e cresça!</p>
      <button onclick="startGame()">Começar</button>
    </div>
    <div id="gameOverScreen" class="overlay hidden">
      <h2>Game Over!</h2>
      <p id="finalScore">Pontos: 0</p>
      <button onclick="startGame()">Jogar Novamente</button>
    </div>
  </div>
  <div id="controls">
    <button class="ctrl-up" onclick="setDir(0,-1)">▲</button>
    <button class="ctrl-left" onclick="setDir(-1,0)">◀</button>
    <button class="ctrl-right" onclick="setDir(1,0)">▶</button>
    <button class="ctrl-down" onclick="setDir(0,1)">▼</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
const tiles = canvas.width / grid;
let snake, dir, nextDir, fruit, score, highScore, gameLoop, speed, running;
const fruits = ['🍎','🍓','🍊','🍇','🍉','🍌','🍑','🥝'];
let currentFruit = '🍎';

highScore = parseInt(localStorage.getItem('snakeHigh') || '0');
updateScore();

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = dir;
  score = 0;
  speed = 120;
  placeFruit();
  running = true;
  updateScore();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
}

function placeFruit() {
  while(true) {
    fruit = {x: Math.floor(Math.random()*tiles), y: Math.floor(Math.random()*tiles)};
    if (!snake.some(s => s.x===fruit.x && s.y===fruit.y)) break;
  }
  currentFruit = fruits[Math.floor(Math.random()*fruits.length)];
}

function tick() {
  if (!running) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x<0||head.x>=tiles||head.y<0||head.y>=tiles||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x===fruit.x && head.y===fruit.y) {
    score += 10;
    beep(660, 0.1);
    placeFruit();
    if (speed > 60) {
      speed -= 3;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
    updateScore();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0a0a1f';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // grid
  ctx.strokeStyle = 'rgba(78,204,163,0.05)';
  for(let i=0;i<tiles;i++){
    ctx.beginPath(); ctx.moveTo(i*grid,0); ctx.lineTo(i*grid,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*grid); ctx.lineTo(canvas.width,i*grid); ctx.stroke();
  }
  // snake
  snake.forEach((s,i) => {
    const t = i/snake.length;
    ctx.fillStyle = i===0 ? '#4ecca3' : `hsl(${160 - t*40}, 60%, ${50-t*15}%)`;
    ctx.fillRect(s.x*grid+1, s.y*grid+1, grid-2, grid-2);
    if (i===0) {
      ctx.fillStyle = '#000';
      const ex = s.x*grid + grid/2 + dir.x*4;
      const ey = s.y*grid + grid/2 + dir.y*4;
      ctx.beginPath(); ctx.arc(ex-3,ey-3,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex+3,ey+3,2,0,Math.PI*2); ctx.fill();
    }
  });
  // fruit
  ctx.font = grid+'px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(currentFruit, fruit.x*grid+grid/2, fruit.y*grid+grid/2);
}

function gameOver() {
  running = false;
  clearInterval(gameLoop);
  beep(150,0.3);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHigh', highScore);
  }
  document.getElementById('finalScore').textContent = `Pontos: ${score}`;
  document.getElementById('gameOverScreen').classList.remove('hidden');
  updateScore();
}

function updateScore() {
  document.getElementById('score').textContent = `Pontos: ${score||0} | Recorde: ${highScore}`;
}

function setDir(x,y) {
  if (!running) return;
  if (dir.x === -x && dir.y === -y) return;
  nextDir = {x,y};
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowup'||k==='w') setDir(0,-1);
  else if (k==='arrowdown'||k==='s') setDir(0,1);
  else if (k==='arrowleft'||k==='a') setDir(-1,0);
  else if (k==='arrowright'||k==='d') setDir(1,0);
});

// Audio
let actx;
function beep(freq, dur) {
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type='square';
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.1, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  } catch(e){}
}
</script>
</body>
</html>
