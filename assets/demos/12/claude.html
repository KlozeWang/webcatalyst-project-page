<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ramp Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #1a1a2e, #16213e);
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, #87ceeb 0%, #ffb6c1 60%, #654321 100%);
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 24px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    z-index: 10;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.6);
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  .screen h1 { font-size: 60px; margin-bottom: 20px; color: #ffd700; text-shadow: 3px 3px 0 #ff4500; }
  .screen p { font-size: 18px; margin-bottom: 20px; max-width: 500px; line-height: 1.5; }
  button {
    padding: 15px 40px;
    font-size: 22px;
    background: #ffd700;
    color: #1a1a2e;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s;
  }
  button:hover { transform: scale(1.1); }
  .hidden { display: none !important; }
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div id="controls">← → or A/D to move • SPACE to jump</div>
  
  <div id="startScreen" class="screen">
    <h1>🏃 Ramp Runner</h1>
    <p>Walk up and down the ramps, collect golden coins, and jump over red spikes! How many points can you get?</p>
    <button onclick="startGame()">Start Game</button>
  </div>
  
  <div id="gameOverScreen" class="screen hidden">
    <h1>Game Over!</h1>
    <p>You hit a spike!</p>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button onclick="startGame()">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key===' ') e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Touch controls
let touchX = null;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchX = t.clientX;
  if (t.clientY < H/2) keys[' '] = true;
});
canvas.addEventListener('touchmove', e => { if(e.touches[0]) touchX = e.touches[0].clientX; });
canvas.addEventListener('touchend', () => { touchX = null; keys[' '] = false; });

// Audio
const AC = window.AudioContext || window.webkitAudioContext;
let audio;
function beep(freq, dur=0.1, type='sine', vol=0.2) {
  if(!audio) audio = new AC();
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audio.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.stop(audio.currentTime + dur);
}

// Ramp height function
function rampY(x) {
  return H * 0.65 + Math.sin(x * 0.005) * 80 + Math.sin(x * 0.012) * 40;
}

let player, cameraX, coins, spikes, score, best = parseInt(localStorage.getItem('rampBest')||'0'), gameState = 'start';
document.getElementById('best').textContent = best;

function spawnCoin(x) {
  coins.push({ x, y: rampY(x) - 40 - Math.random()*60, r: 12, collected: false, bob: Math.random()*Math.PI*2 });
}
function spawnSpike(x) {
  spikes.push({ x, y: rampY(x), w: 25, h: 30 });
}

function initGame() {
  player = { x: 100, y: rampY(100) - 30, vx: 0, vy: 0, w: 24, h: 40, onGround: false, facing: 1, animTime: 0 };
  cameraX = 0;
  coins = [];
  spikes = [];
  score = 0;
  for (let i = 1; i < 20; i++) {
    if (Math.random() < 0.7) spawnCoin(300 + i * 150 + Math.random()*80);
    if (i > 2 && Math.random() < 0.35) spawnSpike(400 + i * 200 + Math.random()*80);
  }
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  initGame();
  gameState = 'play';
}

function gameOver() {
  gameState = 'over';
  if (score > best) { best = score; localStorage.setItem('rampBest', best); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('gameOverScreen').classList.remove('hidden');
  beep(150, 0.4, 'sawtooth', 0.3);
}

function update(dt) {
  if (gameState !== 'play') return;
  
  // Input
  let moveDir = 0;
  if (keys['arrowleft'] || keys['a']) moveDir = -1;
  if (keys['arrowright'] || keys['d']) moveDir = 1;
  if (touchX !== null) {
    if (touchX < W/2) moveDir = -1; else moveDir = 1;
  }
  
  const speed = 280;
  player.vx = moveDir * speed;
  if (moveDir !== 0) player.facing = moveDir;
  
  // Jump
  if ((keys[' '] || keys['w'] || keys['arrowup']) && player.onGround) {
    player.vy = -550;
    player.onGround = false;
    beep(500, 0.1, 'square', 0.15);
  }
  
  // Gravity
  player.vy += 1400 * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  if (player.x < 50) player.x = 50;
  
  // Ground collision
  const groundY = rampY(player.x) - player.h/2;
  if (player.y >= groundY) {
    player.y = groundY;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }
  
  player.animTime += dt * Math.abs(player.vx) * 0.02;
  
  // Camera
  cameraX += ((player.x - W * 0.35) - cameraX) * 0.1;
  if (cameraX < 0) cameraX = 0;
  
  // Coins
  coins.forEach(c => {
    c.bob += dt * 3;
    if (!c.collected) {
      const dx = c.x - player.x, dy = c.y - player.y;
      if (dx*dx + dy*dy < (c.r + 20)*(c.r + 20)) {
        c.collected = true;
        score += 10;
        document.getElementById('score').textContent = score;
        beep(800, 0.08, 'sine', 0.2);
        beep(1200, 0.1, 'sine', 0.15);
      }
    }
  });
  
  // Spikes
  for (const s of spikes) {
    if (Math.abs(s.x - player.x) < (s.w/2 + 12) && player.y + player.h/2 > s.y - s.h + 5) {
      gameOver();
      return;
    }
  }
  
  // Spawn more ahead
  const farthest = Math.max(...coins.map(c=>c.x), ...spikes.map(s=>s.x), player.x);
  while (farthest < player.x + 2000) {
    const nx = farthest + 150 + Math.random() * 200;
    if (Math.random() < 0.7) spawnCoin(nx);
    if (Math.random() < 0.4) spawnSpike(nx + 80);
    break;
  }
  
  // Cleanup
  coins = coins.filter(c => c.x > cameraX - 100 && !c.collected || (c.x > cameraX - 100));
  coins = coins.filter(c => !c.collected);
  spikes = spikes.filter(s => s.x > cameraX - 100);
}

function drawRamp() {
  ctx.fillStyle = '#3a5f3a';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 10) {
    const wx = x + cameraX;
    ctx.lineTo(x, rampY(wx));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  
  // Grass top
  ctx.strokeStyle = '#5fa55f';
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (let x = 0; x <= W + 20; x += 10) {
    const wx = x + cameraX;
    const y = rampY(wx);
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawPlayer() {
  const px = player.x - cameraX;
  const py = player.y;
  
  // Body
  ctx.save();
  ctx.translate(px, py);
  
  const bounce = player.onGround ? Math.abs(Math.sin(player.animTime)) * 3 : 0;
  ctx.translate(0, -bounce);
  
  // Legs
  ctx.fillStyle = '#2c3e50';
  const legSwing = player.onGround ? Math.sin(player.animTime) * 6 : 0;
  ctx.fillRect(-8, 5, 6, 15 + legSwing);
  ctx.fillRect(2, 5, 6, 15 - legSwing);
  
  // Body
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(-10, -10, 20, 18);
  
  // Head
  ctx.fillStyle = '#fdbcb4';
  ctx.beginPath();
  ctx.arc(0, -18, 9, 0, Math.PI*2);
  ctx.fill();
  
  // Eye
  ctx.fillStyle = '#000';
  ctx.fillRect(player.facing > 0 ? 2 : -5, -20, 3, 3);
  
  // Hair
  ctx.fillStyle = '#5d2906';
  ctx.beginPath();
  ctx.arc(0, -22, 8, Math.PI, 0);
  ctx.fill();
  
  ctx.restore();
}

function drawCoin(c) {
  const x = c.x - cameraX;
  const y = c.y + Math.sin(c.bob) * 5;
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(x, y, c.r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#b8860b';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', x, y);
}

function drawSpike(s) {
  const x = s.x - cameraX;
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.moveTo(x - s.w/2, s.y);
  ctx.lineTo(x, s.y - s.h);
  ctx.lineTo(x + s.w/2, s.y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#8b1a1a';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 350) - cameraX * 0.3) % (W + 200);
    const x = cx < -100 ? cx + W + 200 : cx;
    const y = 50 + (i%3) * 40;
    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI*2);
    ctx.arc(x+22, y-5, 22, 0, Math.PI*2);
    ctx.arc(x+45, y, 25, 0, Math.PI*2);
    ctx.fill();
  }
}

function render() {
  // Sky gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#87ceeb');
  g.addColorStop(0.7, '#ffd1a4');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  
  drawClouds();
  drawRamp();
  coins.forEach(drawCoin);
  spikes.forEach(drawSpike);
  if (gameState === 'play' || gameState === 'over') drawPlayer();
}

let lastTime = performance.now();
function loop(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000);
  lastTime = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
