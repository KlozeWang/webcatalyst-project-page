<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventure Rurale: Apprendre le Français</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1, h2, .font-title {
            font-family: 'Fredoka One', cursive;
        }

        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        .emoji-btn {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            user-select: none;
        }

        .emoji-btn:hover {
            transform: scale(1.15);
        }

        .emoji-btn:active {
            transform: scale(0.95);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .pop {
            animation: pop 0.3s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .slide-container {
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 4px solid #22c55e;
        }

        .chalkboard {
            background-color: #2c3e50;
            color: white;
            border: 8px solid #8B4513;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active bg-green-50">
        <div class="slide-container p-8 text-center bg-white">
            <h1 class="text-4xl md:text-6xl text-green-600 mb-4 font-title">Leçon Interactive</h1>
            <h2 class="text-2xl md:text-3xl text-gray-700 mb-6 font-title">L'apprentissage du français en milieu rural</h2>
            <p class="text-lg text-gray-600 mb-8">Testez votre vocabulaire ! Écoutez le son et trouvez la bonne image correspondant au mot français.</p>
            <button onclick="startGame()" class="bg-green-500 hover:bg-green-600 text-white font-title text-2xl py-4 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                Commencer / Start
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen bg-blue-50">
        <div class="absolute top-4 left-4 text-xl font-bold text-gray-600">Diapo: <span id="slide-num">1</span>/<span id="total-slides">3</span></div>
        <div class="absolute top-4 right-4 text-xl font-bold text-green-600">Score: <span id="score">0</span></div>

        <div class="slide-container flex flex-col h-[80vh]">
            <!-- Header/Prompt -->
            <div id="slide-header" class="p-6 text-center text-white transition-colors duration-500">
                <h2 id="theme-title" class="text-2xl font-title mb-2 opacity-80">Thème</h2>
                <div class="chalkboard p-4 my-2">
                    <p class="text-lg text-gray-300 mb-1">Trouvez :</p>
                    <h3 id="target-word" class="text-4xl md:text-5xl font-title text-yellow-300">Mot</h3>
                </div>
            </div>

            <!-- Interactive Area -->
            <div class="flex-grow p-6 bg-white flex justify-center items-center">
                <div id="items-grid" class="grid grid-cols-2 md:grid-cols-4 gap-8">
                    <!-- Emojis injected here -->
                </div>
            </div>
            
            <div id="feedback" class="h-12 text-center text-xl font-bold flex items-center justify-center"></div>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen bg-green-50">
        <div class="slide-container p-8 text-center bg-white">
            <h1 class="text-5xl text-green-600 mb-4 font-title">Fin de la leçon !</h1>
            <p class="text-2xl text-gray-700 mb-2">Votre score :</p>
            <p id="final-score" class="text-6xl font-title text-yellow-500 mb-8">0</p>
            
            <div id="evaluation" class="text-xl mb-8 text-gray-600"></div>

            <button onclick="resetGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-title text-xl py-3 px-6 rounded-full shadow-lg transition transform hover:scale-105">
                Rejouer / Play Again
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio API Setup ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1, 0.2); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.2, 0.2), 200); // G5
        }

        function playWrongSound() {
            playTone(300, 'sawtooth', 0.3, 0.1);
            setTimeout(() => playTone(250, 'sawtooth', 0.4, 0.1), 150);
        }

        function playNextSlideSound() {
            playTone(400, 'triangle', 0.1, 0.05);
        }

        // --- Game Data ---
        const slidesData = [
            {
                theme: "La Ferme (The Farm)",
                headerBg: "bg-green-600",
                items: [
                    { fr: "la vache", en: "cow", emoji: "🐄" },
                    { fr: "le cochon", en: "pig", emoji: "🐖" },
                    { fr: "la poule", en: "chicken", emoji: "🐔" },
                    { fr: "le tracteur", en: "tractor", emoji: "🚜" }
                ]
            },
            {
                theme: "Le Potager (The Vegetable Garden)",
                headerBg: "bg-orange-500",
                items: [
                    { fr: "la carotte", en: "carrot", emoji: "🥕" },
                    { fr: "la tomate", en: "tomato", emoji: "🍅" },
                    { fr: "la pomme de terre", en: "potato", emoji: "🥔" },
                    { fr: "le maïs", en: "corn", emoji: "🌽" }
                ]
            },
            {
                theme: "La Nature (Nature)",
                headerBg: "bg-teal-600",
                items: [
                    { fr: "l'arbre", en: "tree", emoji: "🌳" },
                    { fr: "la fleur", en: "flower", emoji: "🌻" },
                    { fr: "le champignon", en: "mushroom", emoji: "🍄" },
                    { fr: "la rivière", en: "river", emoji: "💧" }
                ]
            },
            {
                theme: "Le Marché du Village (Village Market)",
                headerBg: "bg-red-500",
                items: [
                    { fr: "le pain", en: "bread", emoji: "🥖" },
                    { fr: "le fromage", en: "cheese", emoji: "🧀" },
                    { fr: "le vin", en: "wine", emoji: "🍷" },
                    { fr: "le miel", en: "honey", emoji: "🍯" }
                ]
            }
        ];

        // --- Game State ---
        let currentSlideIndex = 0;
        let score = 0;
        let targetItem = null;
        let canClick = false;

        // --- DOM Elements ---
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            end: document.getElementById('end-screen')
        };
        const els = {
            slideNum: document.getElementById('slide-num'),
            totalSlides: document.getElementById('total-slides'),
            score: document.getElementById('score'),
            themeTitle: document.getElementById('theme-title'),
            targetWord: document.getElementById('target-word'),
            itemsGrid: document.getElementById('items-grid'),
            slideHeader: document.getElementById('slide-header'),
            feedback: document.getElementById('feedback'),
            finalScore: document.getElementById('final-score'),
            evaluation: document.getElementById('evaluation')
        };

        // --- Functions ---
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function startGame() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            score = 0;
            currentSlideIndex = 0;
            els.totalSlides.textContent = slidesData.length;
            els.score.textContent = score;
            switchScreen('game');
            loadSlide();
        }

        function loadSlide() {
            canClick = false;
            els.feedback.textContent = "";
            const slide = slidesData[currentSlideIndex];
            
            els.slideNum.textContent = currentSlideIndex + 1;
            els.themeTitle.textContent = slide.theme;
            
            // Update header color
            els.slideHeader.className = `p-6 text-center text-white transition-colors duration-500 ${slide.headerBg}`;

            // Pick a random target
            targetItem = slide.items[Math.floor(Math.random() * slide.items.length)];
            els.targetWord.textContent = targetItem.fr;

            // Render items
            els.itemsGrid.innerHTML = '';
            
            // Shuffle items for display
            const shuffledItems = [...slide.items].sort(() => Math.random() - 0.5);

            shuffledItems.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'emoji-btn flex items-center justify-center bg-gray-100 rounded-2xl w-24 h-24 md:w-32 md:h-32 text-6xl md:text-7xl shadow-md border-4 border-transparent hover:border-gray-300';
                btn.textContent = item.emoji;
                btn.onclick = () => handleItemClick(item, btn);
                els.itemsGrid.appendChild(btn);
            });

            setTimeout(() => { canClick = true; }, 300);
        }

        function handleItemClick(clickedItem, element) {
            if (!canClick) return;

            if (clickedItem.fr === targetItem.fr) {
                // Correct
                canClick = false;
                score += 10;
                els.score.textContent = score;
                playCorrectSound();
                
                element.classList.add('pop');
                element.classList.remove('bg-gray-100');
                element.classList.add('bg-green-200', 'border-green-500');
                
                els.feedback.innerHTML = `<span class="text-green-500">✅ Très bien ! (${clickedItem.en})</span>`;

                setTimeout(() => {
                    currentSlideIndex++;
                    if (currentSlideIndex < slidesData.length) {
                        playNextSlideSound();
                        loadSlide();
                    } else {
                        endGame();
                    }
                }, 1500);

            } else {
                // Wrong
                playWrongSound();
                element.classList.add('shake', 'bg-red-200', 'border-red-500');
                els.feedback.innerHTML = `<span class="text-red-500">❌ Non, c'est ${clickedItem.fr}. Try again!</span>`;
                
                setTimeout(() => {
                    element.classList.remove('shake', 'bg-red-200', 'border-red-500');
                    element.classList.add('bg-gray-100');
                }, 500);
                
                // Deduct point for wrong guess, min 0
                if(score > 0) {
                    score -= 2;
                    els.score.textContent = score;
                }
            }
        }

        function endGame() {
            switchScreen('end');
            const maxScore = slidesData.length * 10;
            els.finalScore.textContent = `${score} / ${maxScore}`;
            
            let evalText = "";
            if (score === maxScore) evalText = "Parfait ! Un vrai paysan français ! 🥖🍷";
            else if (score >= maxScore * 0.7) evalText = "Très bien ! Vous connaissez la campagne. 🚜";
            else evalText = "Pas mal, mais il faut visiter la France rurale plus souvent ! 🐄";
            
            els.evaluation.textContent = evalText;
        }

        function resetGame() {
            startGame();
        }

    </script>
</body>
</html>
