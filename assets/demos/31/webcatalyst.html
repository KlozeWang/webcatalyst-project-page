<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Puzzle Game</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  overflow-x: hidden;
}

h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  letter-spacing: 2px;
}

.subtitle {
  font-size: 1rem;
  color: #aaa;
  margin-bottom: 20px;
}

.upload-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.upload-btn {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 32px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 50px;
  color: #fff;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.upload-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
}

.upload-btn input[type="file"] {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.difficulty-section {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.difficulty-btn {
  padding: 8px 20px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 25px;
  color: #fff;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.difficulty-btn:hover, .difficulty-btn.active {
  background: rgba(255, 255, 255, 0.2);
  border-color: #667eea;
  color: #667eea;
}

.game-container {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.game-container.visible {
  display: flex;
}

.stats-bar {
  display: flex;
  gap: 30px;
  background: rgba(255, 255, 255, 0.05);
  padding: 12px 30px;
  border-radius: 50px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-label {
  font-size: 0.75rem;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: #667eea;
}

.puzzle-board {
  position: relative;
  width: 400px;
  height: 400px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  padding: 8px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.tiles-container {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  overflow: hidden;
}

.tile {
  position: absolute;
  background-size: 400px 400px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.8);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
}

.tile:hover {
  filter: brightness(1.1);
  z-index: 10;
}

.tile.empty {
  background: rgba(255, 255, 255, 0.03) !important;
  cursor: default;
  border: 2px dashed rgba(255, 255, 255, 0.1);
}

.tile.correct {
  box-shadow: inset 0 0 0 2px rgba(76, 175, 80, 0.5);
}

.controls {
  display: flex;
  gap: 15px;
}

.control-btn {
  padding: 10px 24px;
  border: none;
  border-radius: 25px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.shuffle-btn {
  background: linear-gradient(135deg, #f093fb, #f5576c);
  color: #fff;
  box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
}

.shuffle-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(245, 87, 108, 0.6);
}

.reset-btn {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.reset-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.preview-section {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.preview-label {
  font-size: 0.85rem;
  color: #888;
}

.preview-image {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 12px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.win-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(10px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}

.win-overlay.visible {
  display: flex;
  animation: fadeIn 0.5s ease;
}

.win-content {
  text-align: center;
  animation: scaleIn 0.5s ease;
}

.win-content h2 {
  font-size: 3rem;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #f093fb, #f5576c, #667eea);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.win-content p {
  font-size: 1.2rem;
  color: #aaa;
  margin-bottom: 20px;
}

.win-stats {
  display: flex;
  gap: 30px;
  justify-content: center;
  margin-bottom: 20px;
}

.win-stat {
  text-align: center;
}

.win-stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: #667eea;
}

.win-stat-label {
  font-size: 0.85rem;
  color: #888;
}

.confetti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  z-index: 1001;
  pointer-events: none;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scaleIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes confettiFall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

@keyframes tileMove {
  from {
    transform: scale(0.8);
    opacity: 0.5;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.tile.moving {
  animation: tileMove 0.2s ease;
}

@media (max-width: 500px) {
  h1 { font-size: 1.8rem; }
  .puzzle-board {
    width: 320px;
    height: 320px;
  }
  .tile {
    background-size: 320px 320px !important;
  }
  .stats-bar {
    gap: 20px;
    padding: 10px 20px;
  }
}
</style>
</head>
<body>

<h1>🧩 Photo Puzzle</h1>
<p class="subtitle">Upload a photo and solve the puzzle!</p>

<div class="upload-section" id="uploadSection">
  <label class="upload-btn">
    📷 Choose Photo from Gallery
    <input type="file" id="photoInput" accept="image/*">
  </label>
  <div class="difficulty-section">
    <button class="difficulty-btn active" data-size="3">3×3</button>
    <button class="difficulty-btn" data-size="4">4×4</button>
    <button class="difficulty-btn" data-size="5">5×5</button>
  </div>
</div>

<div class="game-container" id="gameContainer">
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="moveCount">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Time</span>
      <span class="stat-value" id="timer">00:00</span>
    </div>
    <div class="stat">
      <span class="stat-label">Grid</span>
      <span class="stat-value" id="gridSize">3×3</span>
    </div>
  </div>

  <div class="puzzle-board">
    <div class="tiles-container" id="tilesContainer"></div>
  </div>

  <div class="controls">
    <button class="control-btn shuffle-btn" id="shuffleBtn">🔀 Shuffle</button>
    <button class="control-btn reset-btn" id="resetBtn">🔄 Reset</button>
    <button class="control-btn reset-btn" id="changePhotoBtn">📷 Change Photo</button>
  </div>

  <div class="preview-section">
    <span class="preview-label">Original Photo</span>
    <img class="preview-image" id="previewImage" src="" alt="Preview">
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-content">
    <h2>🎉 Puzzle Solved!</h2>
    <p>Congratulations! You completed the puzzle!</p>
    <div class="win-stats">
      <div class="win-stat">
        <div class="win-stat-value" id="winMoves">0</div>
        <div class="win-stat-label">Moves</div>
      </div>
      <div class="win-stat">
        <div class="win-stat-value" id="winTime">00:00</div>
        <div class="win-stat-label">Time</div>
      </div>
    </div>
    <button class="control-btn shuffle-btn" id="playAgainBtn">🔄 Play Again</button>
  </div>
</div>

<script>
const photoInput = document.getElementById('photoInput');
const uploadSection = document.getElementById('uploadSection');
const gameContainer = document.getElementById('gameContainer');
const tilesContainer = document.getElementById('tilesContainer');
const moveCountEl = document.getElementById('moveCount');
const timerEl = document.getElementById('timer');
const gridSizeEl = document.getElementById('gridSize');
const previewImage = document.getElementById('previewImage');
const winOverlay = document.getElementById('winOverlay');
const winMoves = document.getElementById('winMoves');
const winTime = document.getElementById('winTime');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');
const changePhotoBtn = document.getElementById('changePhotoBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const difficultyBtns = document.querySelectorAll('.difficulty-btn');

let gridSize = 3;
let tiles = [];
let emptyIndex = 0;
let moves = 0;
let timer = null;
let seconds = 0;
let gameStarted = false;
let photoSrc = '';
let boardSize = 400;

// Handle photo upload
photoInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      photoSrc = event.target.result;
      previewImage.src = photoSrc;
      uploadSection.style.display = 'none';
      gameContainer.classList.add('visible');
      initGame();
    };
    reader.readAsDataURL(file);
  }
});

// Difficulty selection
difficultyBtns.forEach(btn => {
  btn.addEventListener('click', function() {
    difficultyBtns.forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    gridSize = parseInt(this.dataset.size);
    if (photoSrc) {
      initGame();
    }
  });
});

// Shuffle button
shuffleBtn.addEventListener('click', shuffle Puzzle);

// Reset button
resetBtn.addEventListener('click', resetGame);

// Change photo button
changePhotoBtn.addEventListener('click', function() {
  gameContainer.classList.remove('visible');
  uploadSection.style.display = 'flex';
  photoInput.value = '';
  photoSrc = '';
  previewImage.src = '';
  stopTimer();
  moves = 0;
  seconds = 0;
  moveCountEl.textContent = '0';
  timerEl.textContent = '00:00';
});

// Play again button
playAgainBtn.addEventListener('click', function() {
  winOverlay.classList.remove('visible');
  shufflePuzzle();
});

function initGame() {
  stopTimer();
  moves = 0;
  seconds = 0;
  gameStarted = false;
  moveCountEl.textContent = '0';
  timerEl.textContent = '00:00';
  gridSizeEl.textContent = `${gridSize}×${gridSize}`;
  
  // Adjust board size for mobile
  if (window.innerWidth <= 500) {
    boardSize = 320;
  } else {
    boardSize = 400;
  }
  
  tilesContainer.style.width = boardSize + 'px';
  tilesContainer.style.height = boardSize + 'px';
  
  createTiles();
  shufflePuzzle();
}

function createTiles() {
  tilesContainer.innerHTML = '';
  tiles = [];
  const totalTiles = gridSize * gridSize;
  const tileSize = boardSize / gridSize;
  
  for (let i = 0; i < totalTiles; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.width = tileSize + 'px';
    tile.style.height = tileSize + 'px';
    
    const row = Math.floor(i / gridSize);
    const col = i % gridSize;
    
    // Calculate background position
    const bgX = (col / (gridSize - 1)) * 100;
    const bgY = (row / (gridSize - 1)) * 100;
    
    tile.style.backgroundImage = `url(${photoSrc})`;
    tile.style.backgroundSize = `${boardSize}px ${boardSize}px`;
    tile.style.backgroundPosition = `${bgX}% ${bgY}%`;
    tile.style.left = (col * tileSize) + 'px';
    tile.style.top = (row * tileSize) + 'px';
    tile.dataset.index = i;
    tile.dataset.correctIndex = i;
    
    // Add number overlay for harder difficulties
    if (gridSize >= 4) {
      tile.textContent = i + 1;
      tile.style.fontSize = (tileSize / 5) + 'px';
    }
    
    tile.addEventListener('click', () => handleTileClick(i));
    tilesContainer.appendChild(tile);
    tiles.push(tile);
  }
  
  // Set empty tile (last tile)
  emptyIndex = totalTiles - 1;
  tiles[emptyIndex].classList.add('empty');
  tiles[emptyIndex].textContent = '';
}

function handleTileClick(originalIndex) {
  if (!gameStarted) {
    gameStarted = true;
    startTimer();
  }
  
  // Find current position of the clicked tile
  const currentPos = tiles.findIndex(t => parseInt(t.dataset.correctIndex) === originalIndex);
  
  if (currentPos === -1) return;
  
  // Check if adjacent to empty tile
  if (isAdjacent(currentPos, emptyIndex)) {
    swapTiles(currentPos, emptyIndex);
    moves++;
    moveCountEl.textContent = moves;
    
    // Check win
    if (checkWin()) {
      setTimeout(() => showWin(), 300);
    }
  }
}

function isAdjacent(pos1, pos2) {
  const row1 = Math.floor(pos1 / gridSize);
  const col1 = pos1 % gridSize;
  const row2 = Math.floor(pos2 / gridSize);
  const col2 = pos2 % gridSize;
  
  return (Math.abs(row1 - row2) + Math.abs(col1 - col2)) === 1;
}

function swapTiles(pos1, pos2) {
  const tile1 = tiles[pos1];
  const tile2 = tiles[pos2];
  
  const tileSize = boardSize / gridSize;
  
  // Swap positions
  const tempRow1 = Math.floor(pos1 / gridSize);
  const tempCol1 = pos1 % gridSize;
  const tempRow2 = Math.floor(pos2 / gridSize);
  const tempCol2 = pos2 % gridSize;
  
  tile1.style.left = (tempCol2 * tileSize) + 'px';
  tile1.style.top = (tempRow2 * tileSize) + 'px';
  tile2.style.left = (tempCol1 * tileSize) + 'px';
  tile2.style.top = (tempRow1 * tileSize) + 'px';
  
  // Swap in array
  tiles[pos1] = tile2;
  tiles[pos2] = tile1;
  
  // Update empty index
  if (pos1 === emptyIndex) {
    emptyIndex = pos2;
  } else if (pos2 === emptyIndex) {
    emptyIndex = pos1;
  }
  
  // Update classes
  tile1.classList.toggle('empty');
  tile2.classList.toggle('empty');
  
  // Add moving animation
  tile1.classList.add('moving');
  tile2.classList.add('moving');
  setTimeout(() => {
    tile1.classList.remove('moving');
    tile2.classList.remove('moving');
  }, 200);
  
  // Check if tiles are in correct position
  updateCorrectIndicators();
}

function updateCorrectIndicators() {
  tiles.forEach((tile, index) => {
    if (!tile.classList.contains('empty')) {
      if (parseInt(tile.dataset.correctIndex) === index) {
        tile.classList.add('correct');
      } else {
        tile.classList.remove('correct');
      }
    }
  });
}

function shufflePuzzle() {
  // Reset to solved state first
  createTiles();
  
  // Perform random valid moves to shuffle
  const totalMoves = gridSize * gridSize * 20;
  let lastPos = -1;
  
  for (let i = 0; i < totalMoves; i++) {
    const adjacentPositions = getAdjacentPositions(emptyIndex);
    // Avoid undoing the last move
    const filtered = adjacentPositions.filter(pos => pos !== lastPos);
    const randomPos = filtered[Math.floor(Math.random() * filtered.length)];
    
    lastPos = emptyIndex;
    swapTiles(randomPos, emptyIndex);
  }
  
  moves = 0;
  moveCountEl.textContent = '0';
  stopTimer();
  seconds = 0;
  timerEl.textContent = '00:00';
  gameStarted = false;
  
  updateCorrectIndicators();
}

function getAdjacentPositions(pos) {
  const row = Math.floor(pos / gridSize);
  const col = pos % gridSize;
  const adjacent = [];
  
  if (row > 0) adjacent.push(pos - gridSize); // up
  if (row < gridSize - 1) adjacent.push(pos + gridSize); // down
  if (col > 0) adjacent.push(pos - 1); // left
  if (col < gridSize - 1) adjacent.push(pos + 1); // right
  
  return adjacent;
}

function checkWin() {
  for (let i = 0; i < tiles.length; i++) {
    if (parseInt(tiles[i].dataset.correctIndex) !== i) {
      return false;
    }
  }
  return true;
}

function showWin() {
  stopTimer();
  winMoves.textContent = moves;
  winTime.textContent = formatTime(seconds);
  winOverlay.classList.add('visible');
  createConfetti();
}

function createConfetti() {
  const colors = ['#f093fb', '#f5576c', '#667eea', '#4facfe', '#00f2fe', '#43e97b', '#fa709a', '#fee140'];
  
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
    confetti.style.animationDelay = Math.random() * 2 + 's';
    confetti.style.width = (Math.random() * 8 + 5) + 'px';
    confetti.style.height = (Math.random() * 8 + 5) + 'px';
    document.body.appendChild(confetti);
    
    setTimeout(() => confetti.remove(), 4000);
  }
}

function startTimer() {
  stopTimer();
  timer = setInterval(() => {
    seconds++;
    timerEl.textContent = formatTime(seconds);
  }, 1000);
}

function stopTimer() {
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
}

function formatTime(sec) {
  const minutes = Math.floor(sec / 60);
  const remainingSeconds = sec % 60;
  return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
}

function resetGame() {
  stopTimer();
  moves = 0;
  seconds = 0;
  gameStarted = false;
  moveCountEl.textContent = '0';
  timerEl.textContent = '00:00';
  createTiles();
  updateCorrectIndicators();
}

// Handle window resize
window.addEventListener('resize', () => {
  if (photoSrc && gameContainer.classList.contains('visible')) {
    if (window.innerWidth <= 500) {
      boardSize = 320;
    } else {
      boardSize = 400;
    }
    tilesContainer.style.width = boardSize + 'px';
    tilesContainer.style.height = boardSize + 'px';
    
    const tileSize = boardSize / gridSize;
    tiles.forEach((tile, index) => {
      tile.style.width = tileSize + 'px';
      tile.style.height = tileSize + 'px';
      tile.style.backgroundSize = `${boardSize}px ${boardSize}px`;
      
      const row = Math.floor(index / gridSize);
      const col = index % gridSize;
      tile.style.left = (col * tileSize) + 'px';
      tile.style.top = (row * tileSize) + 'px';
    });
  }
});
</script>

</body>
</html>
