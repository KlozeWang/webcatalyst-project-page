<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Persib eFootball Mini</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #001f3f, #003366); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #app { width: 100%; max-width: 900px; padding: 12px; }
  h1 { text-align: center; font-size: clamp(20px, 4vw, 32px); margin-bottom: 10px; text-shadow: 0 2px 8px #000; color: #00bfff; }
  .screen { display: none; }
  .screen.active { display: block; }
  .leagues { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .league-btn { padding: 8px 14px; background: #0066cc; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; }
  .league-btn.active { background: #ff6600; }
  .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 50vh; overflow-y: auto; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 8px; }
  .team { padding: 10px; background: linear-gradient(135deg,#1a5490,#0d2e52); border-radius: 6px; cursor: pointer; text-align: center; font-size: 13px; border: 2px solid transparent; transition: 0.2s; }
  .team:hover { border-color: #ff6600; transform: scale(1.05); }
  .team.selected { border-color: #ffcc00; background: linear-gradient(135deg,#ff6600,#cc3300); }
  .panel { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  button.primary { padding: 12px 24px; background: linear-gradient(135deg,#ff6600,#cc3300); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
  button.primary:hover { transform: translateY(-2px); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  #gameCanvas { display: block; width: 100%; height: auto; background: #2d8b2d; border-radius: 8px; border: 3px solid #fff; touch-action: none; }
  .score-bar { display: flex; justify-content: space-around; align-items: center; padding: 10px; background: rgba(0,0,0,0.6); border-radius: 8px; margin-bottom: 8px; font-size: 18px; font-weight: bold; }
  .timer { color: #ffcc00; }
  .controls-info { text-align: center; font-size: 12px; color: #ccc; margin-top: 6px; }
  .gameover { text-align: center; padding: 20px; }
  .gameover h2 { font-size: 36px; margin-bottom: 16px; color: #ffcc00; }
  #touchControls { display: none; position: relative; height: 140px; margin-top: 8px; }
  #joystick { position: absolute; left: 20px; bottom: 10px; width: 110px; height: 110px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid #fff; }
  #stick { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; }
  #shootBtn { position: absolute; right: 20px; bottom: 10px; width: 90px; height: 90px; background: #ff6600; border-radius: 50%; border: none; color: white; font-size: 16px; font-weight: bold; }
  @media (max-width: 700px) { #touchControls { display: block; } }
</style>
</head>
<body>
<div id="app">
  <h1>⚽ PERSIB eFOOTBALL ⚽</h1>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <div class="panel">
      <h3 style="margin-bottom:8px">Pilih Liga:</h3>
      <div class="leagues" id="leagueList"></div>
      <h3 style="margin-bottom:8px">Tim Kamu:</h3>
      <div class="teams" id="teamList"></div>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:8px">Lawan (acak/pilih):</h3>
      <div class="teams" id="opponentList"></div>
    </div>
    <div style="text-align:center">
      <button class="primary" id="startBtn">⚽ MULAI PERTANDINGAN</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="score-bar">
      <span id="homeName">Persib</span>
      <span id="scoreText">0 - 0</span>
      <span id="awayName">Lawan</span>
      <span class="timer" id="timerText">90'</span>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="controls-info">WASD/Panah = Gerak | SPASI = Tembak | Selesaikan dalam 90 detik!</div>
    <div id="touchControls">
      <div id="joystick"><div id="stick"></div></div>
      <button id="shootBtn">SHOOT</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overScreen" class="screen">
    <div class="gameover panel">
      <h2 id="resultText">Hasil</h2>
      <p id="finalScore" style="font-size:24px;margin-bottom:20px">0 - 0</p>
      <button class="primary" id="rematchBtn">🔄 Main Lagi</button>
      <button class="primary" id="menuBtn" style="margin-left:8px;background:linear-gradient(135deg,#0066cc,#003366)">🏠 Menu</button>
    </div>
  </div>
</div>

<script>
const LEAGUES = {
  "Liga 1 Indonesia": ["Persib Bandung","Persija Jakarta","Arema FC","Bali United","Borneo FC","PSM Makassar","PSIS Semarang","Persebaya Surabaya","Madura United","Bhayangkara FC","Persita Tangerang","Dewa United","RANS Nusantara","Persikabo","PSS Sleman","Barito Putera"],
  "Premier League": ["Manchester City","Arsenal","Liverpool","Manchester United","Chelsea","Tottenham","Newcastle","Aston Villa"],
  "La Liga": ["Real Madrid","Barcelona","Atletico Madrid","Sevilla","Real Sociedad","Valencia","Villarreal","Real Betis"],
  "Serie A": ["Juventus","Inter Milan","AC Milan","Napoli","AS Roma","Lazio","Atalanta","Fiorentina"],
  "Bundesliga": ["Bayern Munich","Borussia Dortmund","RB Leipzig","Bayer Leverkusen","Eintracht Frankfurt"],
  "Ligue 1": ["PSG","Marseille","Lyon","Monaco","Lille","Nice"]
};

let currentLeague = "Liga 1 Indonesia";
let myTeam = "Persib Bandung";
let oppTeam = "Persija Jakarta";

const leagueList = document.getElementById('leagueList');
const teamList = document.getElementById('teamList');
const oppList = document.getElementById('opponentList');

function renderLeagues() {
  leagueList.innerHTML = '';
  Object.keys(LEAGUES).forEach(l => {
    const b = document.createElement('button');
    b.className = 'league-btn' + (l === currentLeague ? ' active' : '');
    b.textContent = l;
    b.onclick = () => { currentLeague = l; renderLeagues(); renderTeams(); };
    leagueList.appendChild(b);
  });
}
function renderTeams() {
  teamList.innerHTML = ''; oppList.innerHTML = '';
  LEAGUES[currentLeague].forEach(t => {
    const d = document.createElement('div');
    d.className = 'team' + (t === myTeam ? ' selected' : '');
    d.textContent = t;
    d.onclick = () => { myTeam = t; renderTeams(); };
    teamList.appendChild(d);
  });
  // opponent from all teams
  const all = Object.values(LEAGUES).flat();
  all.forEach(t => {
    const d = document.createElement('div');
    d.className = 'team' + (t === oppTeam ? ' selected' : '');
    d.textContent = t;
    d.onclick = () => { oppTeam = t; renderTeams(); };
    oppList.appendChild(d);
  });
}
renderLeagues(); renderTeams();

// Audio
const AC = window.AudioContext || window.webkitAudioContext;
let audio = null;
function beep(freq=440, dur=0.1, type='sine', vol=0.2){
  if(!audio) audio = new AC();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime+dur);
  o.start(); o.stop(audio.currentTime+dur);
}
function goalSound(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.25),i*100)); }

// Screens
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Game
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let game = null;

function initGame(){
  game = {
    player: { x: W*0.3, y: H/2, r: 14, color: '#1e90ff' },
    ai: { x: W*0.7, y: H/2, r: 14, color: '#ff3333' },
    ball: { x: W/2, y: H/2, r: 8, vx: 0, vy: 0 },
    score: [0,0],
    time: 90,
    keys: {},
    joy: {x:0,y:0,active:false},
    running: true,
    lastTime: performance.now(),
    timeAcc: 0
  };
  document.getElementById('homeName').textContent = myTeam;
  document.getElementById('awayName').textContent = oppTeam;
  updateScore();
}
function updateScore(){
  document.getElementById('scoreText').textContent = `${game.score[0]} - ${game.score[1]}`;
  document.getElementById('timerText').textContent = Math.ceil(game.time)+"'";
}

function resetPositions(scorer){
  game.player.x = W*0.3; game.player.y = H/2;
  game.ai.x = W*0.7; game.ai.y = H/2;
  game.ball.x = W/2; game.ball.y = H/2; game.ball.vx=0; game.ball.vy=0;
}

const GOAL_TOP = H/2 - 60, GOAL_BOT = H/2 + 60;

function drawField(){
  ctx.fillStyle = '#2d8b2d'; ctx.fillRect(0,0,W,H);
  // stripes
  for(let i=0;i<10;i++){ if(i%2){ ctx.fillStyle='rgba(0,0,0,0.07)'; ctx.fillRect(i*W/10,0,W/10,H);} }
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.strokeRect(10,10,W-20,H-20);
  ctx.beginPath(); ctx.moveTo(W/2,10); ctx.lineTo(W/2,H-10); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,50,0,Math.PI*2); ctx.stroke();
  // goals
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.fillRect(0, GOAL_TOP, 10, GOAL_BOT-GOAL_TOP);
  ctx.fillRect(W-10, GOAL_TOP, 10, GOAL_BOT-GOAL_TOP);
  // penalty area
  ctx.strokeRect(10, H/2-100, 80, 200);
  ctx.strokeRect(W-90, H/2-100, 80, 200);
}
function drawCircle(o){ ctx.beginPath(); ctx.fillStyle=o.color; ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();}

function update(dt){
  if(!game.running) return;
  game.time -= dt;
  if(game.time <= 0){ endGame(); return; }
  
  // player input
  const p = game.player;
  let dx=0, dy=0;
  const k = game.keys;
  if(k['ArrowUp']||k['w']) dy-=1;
  if(k['ArrowDown']||k['s']) dy+=1;
  if(k['ArrowLeft']||k['a']) dx-=1;
  if(k['ArrowRight']||k['d']) dx+=1;
  if(game.joy.active){ dx += game.joy.x; dy += game.joy.y; }
  const len = Math.hypot(dx,dy);
  if(len>0){ dx/=len; dy/=len; }
  const speed = 200;
  p.x += dx*speed*dt; p.y += dy*speed*dt;
  p.x = Math.max(p.r, Math.min(W-p.r, p.x));
  p.y = Math.max(p.r, Math.min(H-p.r, p.y));

  // AI movement - chase ball or defend
  const ai = game.ai;
  const b = game.ball;
  let targetX = b.x, targetY = b.y;
  // if ball on opponent side, attack to player goal (left)
  if(b.x > W*0.4){ targetX = b.x - 20; }
  else { targetX = Math.max(W*0.55, b.x); targetY = H/2;}
  const adx = targetX-ai.x, ady = targetY-ai.y;
  const al = Math.hypot(adx,ady);
  if(al>1){ ai.x += (adx/al)*160*dt; ai.y += (ady/al)*160*dt; }
  ai.x = Math.max(ai.r, Math.min(W-ai.r, ai.x));
  ai.y = Math.max(ai.r, Math.min(H-ai.r, ai.y));

  // AI shoot if near ball and on player side
  const aiToBall = Math.hypot(ai.x-b.x, ai.y-b.y);
  if(aiToBall < ai.r + b.r + 4 && ai.x > b.x){
    // shoot toward left goal
    const tx = 0, ty = H/2;
    const sdx = tx-b.x, sdy = ty-b.y;
    const sl = Math.hypot(sdx,sdy);
    b.vx = (sdx/sl)*420; b.vy = (sdy/sl)*420;
    beep(300,0.05,'square');
  }

  // ball physics
  b.x += b.vx*dt; b.y += b.vy*dt;
  b.vx *= 0.985; b.vy *= 0.985;
  if(b.y < b.r+10){ b.y=b.r+10; b.vy*=-0.7; }
  if(b.y > H-b.r-10){ b.y=H-b.r-10; b.vy*=-0.7; }

  // Goals
  if(b.x < 15 && b.y>GOAL_TOP && b.y<GOAL_BOT){
    game.score[1]++; goalSound(); updateScore(); resetPositions();
  } else if(b.x < b.r){ b.x=b.r; b.vx*=-0.7; }
  if(b.x > W-15 && b.y>GOAL_TOP && b.y<GOAL_BOT){
    game.score[0]++; goalSound(); updateScore(); resetPositions();
  } else if(b.x > W-b.r){ b.x=W-b.r; b.vx*=-0.7; }

  // Player-ball collision (dribble)
  const pdb = Math.hypot(p.x-b.x, p.y-b.y);
  if(pdb < p.r+b.r){
    const ang = Math.atan2(b.y-p.y, b.x-p.x);
    b.x = p.x + Math.cos(ang)*(p.r+b.r);
    b.y = p.y + Math.sin(ang)*(p.r+b.r);
    // soft push
    b.vx = b.vx*0.3 + dx*120; b.vy = b.vy*0.3 + dy*120;
  }
  // AI-ball collision
  const adb = Math.hypot(ai.x-b.x, ai.y-b.y);
  if(adb < ai.r+b.r){
    const ang = Math.atan2(b.y-ai.y, b.x-ai.x);
    b.x = ai.x + Math.cos(ang)*(ai.r+b.r);
    b.y = ai.y + Math.sin(ang)*(ai.r+b.r);
  }

  updateScore();
}

function shoot(){
  const p = game.player, b = game.ball;
  const d = Math.hypot(p.x-b.x, p.y-b.y);
  if(d < p.r+b.r+15){
    const tx = W, ty = H/2;
    const ang = Math.atan2(ty-b.y, tx-b.x);
    b.vx = Math.cos(ang)*500; b.vy = Math.sin(ang)*500;
    beep(600,0.08,'square');
  }
}

function render(){
  drawField();
  drawCircle(game.player);
  drawCircle(game.ai);
  // ball
  ctx.beginPath(); ctx.fillStyle='#fff'; ctx.arc(game.ball.x,game.ball.y,game.ball.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
}

function loop(now){
  if(!game) return;
  const dt = Math.min(0.05,(now-game.lastTime)/1000);
  game.lastTime = now;
  update(dt); render();
  if(game.running) requestAnimationFrame(loop);
}

function endGame(){
  game.running = false;
  const [a,b] = game.score;
  let res = 'SERI! 🤝';
  if(a>b) res = `MENANG! 🏆 ${myTeam}`;
  else if(b>a) res = `KALAH 😢`;
  document.getElementById('resultText').textContent = res;
  document.getElementById('finalScore').textContent = `${myTeam} ${a} - ${b} ${oppTeam}`;
  showScreen('overScreen');
}

// Controls
window.addEventListener('keydown', e=>{ if(game){ game.keys[e.key]=true; if(e.key===' '){ shoot(); e.preventDefault(); } }});
window.addEventListener('keyup', e=>{ if(game) game.keys[e.key]=false; });

// Touch joystick
const joy = document.getElementById('joystick'), stick = document.getElementById('stick');
function joyHandle(e){
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  const r = joy.getBoundingClientRect();
  const cx = r.left+r.width/2, cy=r.top+r.height/2;
  let dx = t.clientX-cx, dy=t.clientY-cy;
  const max = r.width/2;
  const l = Math.hypot(dx,dy);
  if(l>max){ dx=dx/l*max; dy=dy/l*max; }
  stick.style.left=(30+dx)+'px'; stick.style.top=(30+dy)+'px';
  if(game){ game.joy.x = dx/max; game.joy.y = dy/max; game.joy.active=true; }
}
function joyEnd(){ stick.style.left='30px'; stick.style.top='30px'; if(game){game.joy.active=false; game.joy.x=0; game.joy.y=0;} }
joy.addEventListener('touchstart', joyHandle); joy.addEventListener('touchmove', joyHandle); joy.addEventListener('touchend', joyEnd);
document.getElementById('shootBtn').addEventListener('touchstart', e=>{e.preventDefault(); shoot();});
document.getElementById('shootBtn').addEventListener('click', shoot);

document.getElementById('startBtn').onclick = ()=>{
  if(myTeam === oppTeam){ alert('Pilih lawan yang berbeda!'); return; }
  showScreen('gameScreen');
  initGame();
  requestAnimationFrame(loop);
};
document.getElementById('rematchBtn').onclick = ()=>{
  showScreen('gameScreen'); initGame(); requestAnimationFrame(loop);
};
document.getElementById('menuBtn').onclick = ()=> showScreen('startScreen');
</script>
</body>
</html>
