// ============ MATCH ENGINE ============
const FIELD_W = 1000;
const FIELD_H = 600;
const GOAL_W = 10;
const GOAL_H = 140;
const BALL_R = 5;
const PLAYER_R = 10;
const PLAYER_SPEED = 2.5;
const BALL_FRICTION = 0.985;
const SHOOT_POWER = 8;

let fieldOffsetX = 0;
let fieldOffsetY = 0;

let ball = { x: 500, y: 300, vx: 0, vy: 0, owner: null };
let homePlayers = [];
let awayPlayers = [];
let particles = [];
let camera = { x: 0, y: 0, zoom: 1 };

function initMatch(homeTeam, awayTeam) {
  ball = { x: 500, y: 300, vx: 0, vy: 0, owner: null };
  scoreBoard = { home: 0, away: 0 };
  matchTime = 0;
  matchMinute = 0;
  matchSecond = 0;
  matchHalf = 1;
  kickOffTeam = 'home';
  freeKick = false;
  cornerKick = false;
  penaltyKick = false;
  penaltyResult = '';
  penaltyTimer = 0;
  lastGoalTeam = 'home';
  particles = [];
  showGoalAnimation = false;
  goalAnimationTimer = 0;

  homePlayers = [];
  awayPlayers = [];

  const formations = {
    home: [[0,0],[-1,-1],[-1,1],[0,-2],[0,2],[-2,-1],[-2,1],[-3,-1],[-3,1],[-3,0],[-4,0]],
    away: [[0,0],[1,-1],[1,1],[0,-2],[0,2],[2,-1],[2,1],[3,-1],[3,1],[3,0],[4,0]]
  };

  for (let i = 0; i < 11; i++) {
    const pos = formations.home[i];
    homePlayers.push({
      x: 500 + pos[0] * 60,
      y: 300 + pos[1] * 40,
      vx: 0, vy: 0,
      team: 'home',
      playerIndex: i,
      hasBall: false,
      stamina: 100,
      role: getRole(i),
      targetX: 500 + pos[0] * 60,
      targetY: 300 + pos[1] * 40,
      color: homeTeam.color,
      color2: homeTeam.color2,
      name: homeTeam.players[i] || 'Player ' + i,
      speed: PLAYER_SPEED * (0.8 + Math.random() * 0.4)
    });
  }

  for (let i = 0; i < 11; i++) {
    const pos = formations.away[i];
    awayPlayers.push({
      x: 500 + pos[0] * 60,
      y: 300 + pos[1] * 40,
      vx: 0, vy: 0,
      team: 'away',
      playerIndex: i,
      hasBall: false,
      stamina: 100,
      role: getRole(i),
      targetX: 500 + pos[0] * 60,
      targetY: 300 + pos[1] * 40,
      color: awayTeam.color,
      color2: awayTeam.color2,
      name: awayTeam.players[i] || 'Player ' + i,
      speed: PLAYER_SPEED * (0.8 + Math.random() * 0.4)
    });
  }

  matchData = { home: homeTeam, away: awayTeam };
  matchPhase = 'playing';
  gameState = 'match';
}

function getRole(i) {
  if (i === 0) return 'GK';
  if (i <= 3) return 'DEF';
  if (i <= 5) return 'MID';
  return 'FWD';
}

function resetPositions(scoringTeam) {
  ball = { x: 500, y: 300, vx: 0, vy: 0, owner: null };
  kickOffTeam = scoringTeam === 'home' ? 'away' : 'home';
  const formations = {
    home: [[0,0],[-1,-1],[-1,1],[0,-2],[0,2],[-2,-1],[-2,1],[-3,-1],[-3,1],[-3,0],[-4,0]],
    away: [[0,0],[1,-1],[1,1],[0,-2],[0,2],[2,-1],[2,1],[3,-1],[3,1],[3,0],[4,0]]
  };
  for (let i = 0; i < 11; i++) {
    const pos = formations.home[i];
    homePlayers[i].x = 500 + pos[0] * 60;
    homePlayers[i].y = 300 + pos[1] * 40;
    homePlayers[i].vx = 0; homePlayers[i].vy = 0;
    homePlayers[i].hasBall = false;
    homePlayers[i].targetX = 500 + pos[0] * 60;
    homePlayers[i].targetY = 300 + pos[1] * 40;
  }
  for (let i = 0; i < 11; i++) {
    const pos = formations.away[i];
    awayPlayers[i].x = 500 + pos[0] * 60;
    awayPlayers[i].y = 300 + pos[1] * 40;
    awayPlayers[i].vx = 0; awayPlayers[i].vy = 0;
    awayPlayers[i].hasBall = false;
    awayPlayers[i].targetX = 500 + pos[0] * 60;
    awayPlayers[i].targetY = 300 + pos[1] * 40;
  }
}

function dist(a, b) { return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2); }

function updateMatch(dt) {
  if (matchPhase !== 'playing') return;

  matchSecond += dt * 60 * matchSpeed;
  if (matchSecond >= 60) {
    matchSecond = 0;
    matchMinute++;
  }

  if (matchMinute >= 45 && matchHalf === 1) {
    matchPhase = 'halftime';
    return;
  }
  if (matchMinute >= 90 && matchHalf === 2) {
    matchPhase = 'fulltime';
    return;
  }

  const homeTeam = matchData.home;
  const awayTeam = matchData.away;

  // Player control
  const controlledPlayer = getControlledPlayer();

  if (controlledPlayer) {
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.sqrt(dx * dx + dy * dy);
      dx /= len; dy /= len;
      controlledPlayer.x += dx * controlledPlayer.speed * 1.5;
      controlledPlayer.y += dy * controlledPlayer.speed * 1.5;
    }

    if (keys['Space'] && controlledPlayer.hasBall) {
      shootBall(controlledPlayer, 'home');
      keys['Space'] = false;
    }
    if (keys['KeyJ'] && controlledPlayer.hasBall) {
      passBall(controlledPlayer, 'home');
      keys['KeyJ'] = false;
    }
    if (keys['KeyK']) {
      sprint(controlledPlayer);
    }
  }

  // AI for home team (non-controlled)
  for (let p of homePlayers) {
    if (p === controlledPlayer) continue;
    updateAIMovement(p, 'home', homeTeam);
  }

  // AI for away team
  for (let p of awayPlayers) {
    updateAIMovement(p, 'away', awayTeam);
  }

  // Ball physics
  if (ball.owner) {
    ball.x = ball.owner.x + ball.owner.vx * 0.5;
    ball.y = ball.owner.y + ball.owner.vy * 0.5;
    ball.vx = 0;
    ball.vy = 0;
  } else {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= BALL_FRICTION;
    ball.vy *= BALL_FRICTION;

    if (Math.abs(ball.vx) < 0.01) ball.vx = 0;
    if (Math.abs(ball.vy) < 0.01) ball.vy = 0;

    // Ball bounds
    if (ball.y < 10) { ball.y = 10; ball.vy *= -0.5; }
    if (ball.y > FIELD_H - 10) { ball.y = FIELD_H - 10; ball.vy *= -0.5; }

    // Goal check
    if (ball.x < 15 && ball.y > 300 - GOAL_H / 2 && ball.y < 300 + GOAL_H / 2) {
      scoreGoal('away');
      return;
    }
    if (ball.x > FIELD_W - 15 && ball.y > 300 - GOAL_H / 2 && ball.y < 300 + GOAL_H / 2) {
      scoreGoal('home');
      return;
    }

    if (ball.x < -10 || ball.x > FIELD_W + 10) {
      // Throw in - give to nearest player
      let nearest = null, minD = Infinity;
      for (let p of [...homePlayers, ...awayPlayers]) {
        const d = dist(p, ball);
        if (d < minD) { minD = d; nearest = p; }
      }
      if (nearest) { ball.owner = nearest; nearest.hasBall = true; }
      ball.vx = 0; ball.vy = 0;
    }
  }

  // Player-ball collision
  for (let p of [...homePlayers, ...awayPlayers]) {
    const d = dist(p, ball);
    if (d < PLAYER_R + BALL_R + 5) {
      if (!ball.owner || ball.owner !== p) {
        if (ball.owner) ball.owner.hasBall = false;
        ball.owner = p;
        p.hasBall = true;
      }
    }
  }

  // Player-player collision
  const allPlayers = [...homePlayers, ...awayPlayers];
  for (let i = 0; i < allPlayers.length; i++) {
    for (let j = i + 1; j < allPlayers.length; j++) {
      const d = dist(allPlayers[i], allPlayers[j]);
      if (d < PLAYER_R * 2) {
        const overlap = PLAYER_R * 2 - d;
        const dx = (allPlayers[j].x - allPlayers[i].x) / d;
        const dy = (allPlayers[j].y - allPlayers[i].y) / d;
        allPlayers[i].x -= dx * overlap * 0.5;
        allPlayers[i].y -= dy * overlap * 0.5;
        allPlayers[j].x += dx * overlap * 0.5;
        allPlayers[j].y += dy * overlap * 0.5;

        // Tackle
        if (allPlayers[i].hasBall && allPlayers[j].team !== allPlayers[i].team && Math.random() < 0.02) {
          allPlayers[i].hasBall = false;
          ball.owner = allPlayers[j];
          allPlayers[j].hasBall = true;
        }
        if (allPlayers[j].hasBall && allPlayers[i].team !== allPlayers[j].team && Math.random() < 0.02) {
          allPlayers[j].hasBall = false;
          ball.owner = allPlayers[i];
          allPlayers[i].hasBall = true;
        }
      }
    }
  }

  // Particles
  particles = particles.filter(p => p.life > 0);
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
    p.vy += 0.1;
  }
}

function getControlledPlayer() {
  let nearest = null, minD = Infinity;
  for (let p of homePlayers) {
    const d = dist(p, ball);
    if (d < minD) { minD = d; nearest = p; }
  }
  return nearest;
}

function updateAIMovement(p, team, teamData) {
  const isAttacking = (team === 'home' && ball.x > 500) || (team === 'away' && ball.x < 500);
  const isDefending = !isAttacking;

  if (p.hasBall) {
    // Move toward opponent goal
    const goalX = team === 'home' ? FIELD_W - 20 : 20;
    const goalY = 300;
    const dx = goalX - p.x;
    const dy = goalY - p.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > 100) {
      p.x += (dx / d) * p.speed * 0.8;
      p.y += (dy / d) * p.speed * 0.8;
    }
    // Shoot if close
    if (d < 250 && Math.random() < 0.03) {
      shootBall(p, team);
    }
    // Pass
    if (Math.random() < 0.005) {
      passBall(p, team);
    }
  } else {
    if (isAttacking) {
      // Move toward ball
      const dx = ball.x - p.x;
      const dy = ball.y - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > 15) {
        p.x += (dx / d) * p.speed * 0.7;
        p.y += (dy / d) * p.speed * 0.7;
      }
    } else {
      // Defend - stay between ball and goal
      const goalX = team === 'home' ? 20 : FIELD_W - 20;
      const goalY = 300;
      const midX = (ball.x + goalX) / 2;
      const midY = (ball.y + goalY) / 2;
      const targetX = p.targetX + (midX - p.targetX) * 0.3;
      const targetY = p.targetY + (midY - p.targetY) * 0.3;
      const dx = targetX - p.x;
      const dy = targetY - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > 10) {
        p.x += (dx / d) * p.speed * 0.5;
        p.y += (dy / d) * p.speed * 0.5;
      }
    }
  }

  // Keep in bounds
  p.x = Math.max(15, Math.min(FIELD_W - 15, p.x));
  p.y = Math.max(15, Math.min(FIELD_H - 15, p.y));

  p.vx = 0;
  p.vy = 0;
}

function shootBall(player, team) {
  player.hasBall = false;
  ball.owner = null;
  const goalX = team === 'home' ? FIELD_W - 20 : 20;
  const goalY = 300 + (Math.random() - 0.5) * GOAL_H * 0.6;
  const dx = goalX - player.x;
  const dy = goalY - player.y;
  const d = Math.sqrt(dx * dx + dy * dy);
  ball.vx = (dx / d) * SHOOT_POWER * (0.7 + Math.random() * 0.6);
  ball.vy = (dy / d) * SHOOT_POWER * (0.7 + Math.random() * 0.6);
}

function passBall(player, team) {
  player.hasBall = false;
  ball.owner = null;
  let nearest = null, minD = Infinity;
  for (let p of team === 'home' ? homePlayers : awayPlayers) {
    if (p === player) continue;
    const d = dist(p, player);
    if (d < minD) { minD = d; nearest = p; }
  }
  if (nearest) {
    const dx = nearest.x - player.x;
    const dy = nearest.y - player.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    ball.vx = (dx / d) * 5;
    ball.vy = (dy / d) * 5;
  }
}

function sprint(player) {
  player.speed = PLAYER_SPEED * 1.5;
  player.stamina -= 0.5;
  if (player.stamina <= 0) player.stamina = 0;
}

function scoreGoal(team) {
  if (team === 'home') scoreBoard.home++;
  else scoreBoard.away++;

  lastGoalTeam = team;
  showGoalAnimation = true;
  goalAnimationTimer = 120;
  goalMinute = matchMinute;

  const scorer = team === 'home' ?
    homePlayers.filter(p => dist(p, ball) < 100)[0]?.name || 'Player' :
    awayPlayers.filter(p => dist(p, ball) < 100)[0]?.name || 'Player';
  goalScorer = scorer;

  // Celebration particles
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: team === 'home' ? FIELD_W - 50 : 50,
      y: 300,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 2,
      color: team === 'home' ? matchData.home.color : matchData.away.color,
      size: 3 + Math.random() * 4
    });
  }

  setTimeout(() => {
    resetPositions(team);
    showGoalAnimation = false;
  }, 2000);
}

// ============ LEAGUE SYSTEM ============
function initLeague() {
  leagueTable = [];
  const teams = selectedLeague === 'liga1' ? TEAMS.liga1 : TEAMS.international;
  teams.forEach((t, i) => {
    leagueTable.push({
      ...t,
      index: i,
      played: 0, won: 0, drawn: 0, lost: 0,
      gf: 0, ga: 0, gd: 0, points: 0
    });
  });
  generateFixtures();
}

let fixtures = [];
let fixtureIndex = 0;

function generateFixtures() {
  fixtures = [];
  const teams = selectedLeague === 'liga1' ? TEAMS.liga1 : TEAMS.international;
  for (let i = 0; i < teams.length; i++) {
    for (let j = i + 1; j < teams.length; j++) {
      fixtures.push({ home: i, away: j, played: false, homeScore: 0, awayScore: 0 });
      fixtures.push({ home: j, away: i, played: false, homeScore: 0, awayScore: 0 });
    }
  }
  // Shuffle
  for (let i = fixtures.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fixtures[i], fixtures[j]] = [fixtures[j], fixtures[i]];
  }
  fixtureIndex = 0;
}

function playNextMatch() {
  if (fixtureIndex >= fixtures.length) {
    showLeagueTable = true;
    return;
  }

  const fix = fixtures[fixtureIndex];
  const homeTeam = selectedLeague === 'liga1' ? TEAMS.liga1[fix.home] : TEAMS.international[fix.home];
  const awayTeam = selectedLeague === 'liga1' ? TEAMS.liga1[fix.away] : TEAMS.international[fix.away];

  // Simulate
  const homeStr = homeTeam.strength;
  const awayStr = awayTeam.strength;
  const homeAdv = 5;
  const diff = homeStr - awayStr + homeAdv;

  let homeGoals = 0, awayGoals = 0;
  const totalGoals = Math.floor(Math.random() * 5);
  for (let i = 0; i < totalGoals; i++) {
    if (Math.random() * 100 < 50 + diff / 2) homeGoals++;
    else awayGoals++;
  }

  fix.homeScore = homeGoals;
  fix.awayScore = awayGoals;
  fix.played = true;

  // Update league table
  leagueTable[fix.home].played++;
  leagueTable[fix.home].gf += homeGoals;
  leagueTable[fix.home].ga += awayGoals;
  leagueTable[fix.home].gd = leagueTable[fix.home].gf - leagueTable[fix.home].ga;
  if (homeGoals > awayGoals) { leagueTable[fix.home].won++; leagueTable[fix.home].points += 3; }
  else if (homeGoals === awayGoals) { leagueTable[fix.home].drawn++; leagueTable[fix.home].points += 1; }
  else { leagueTable[fix.home].lost++; }

  leagueTable[fix.away].played++;
  leagueTable[fix.away].gf += awayGoals;
  leagueTable[fix.away].ga += homeGoals;
  leagueTable[fix.away].gd = leagueTable[fix.away].gf - leagueTable[fix.away].ga;
  if (awayGoals > homeGoals) { leagueTable[fix.away].won++; leagueTable[fix.away].points += 3; }
  else if (awayGoals === homeGoals) { leagueTable[fix.away].drawn++; leagueTable[fix.away].points += 1; }
  else { leagueTable[fix.away].lost++; }

  fixtureIndex++;

  // Show result
  matchResult = { home: homeTeam, away: awayTeam, homeScore, awayScore };
  gameState = 'matchResult';
}

function sortLeagueTable() {
  leagueTable.sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.gd !== a.gd) return b.gd - a.gd;
    return b.gf - a.gf;
  });
}

function drawMatch() {
  // Calculate field position on screen
  const scale = Math.min(canvas.width / (FIELD_W + 100), canvas.height / (FIELD_H + 100)) * 0.85;
  fieldOffsetX = (canvas.width - FIELD_W * scale) / 2;
  fieldOffsetY = (canvas.height - FIELD_H * scale) / 2;

  ctx.save();
  ctx.translate(fieldOffsetX, fieldOffsetY);
  ctx.scale(scale, scale);

  // Draw field
  drawField();

  // Draw players
  const allPlayers = [...homePlayers, ...awayPlayers];
  const sortedPlayers = allPlayers.sort((a, b) => a.y - b.y);

  for (let p of sortedPlayers) {
    drawPlayer(p);
  }

  // Draw ball
  drawBall();

  // Draw particles
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // Draw HUD
  drawMatchHUD();

  // Goal animation
  if (showGoalAnimation && goalAnimationTimer > 0) {
    drawGoalAnimation();
  }

  // Halftime / Fulltime overlay
  if (matchPhase === 'halftime') drawOverlay('HALF TIME', 'Tekan SPACE untuk lanjutkan');
  if (matchPhase === 'fulltime') {
    drawOverlay('FULL TIME', 'Tekan SPACE untuk lihat hasil');
  }
}

function drawField() {
  // Grass
  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);

  // Grass stripes
  for (let i = 0; i < FIELD_W; i += 80) {
    ctx.fillStyle = i % 160 === 0 ? '#388e3c' : '#2e7d32';
    ctx.fillRect(i, 0, 80, FIELD_H);
  }

  // Lines
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;

  // Border
  ctx.strokeRect(5, 5, FIELD_W - 10, FIELD_H - 10);

  // Center line
  ctx.beginPath();
  ctx.moveTo(FIELD_W / 2, 5);
  ctx.lineTo(FIELD_W / 2, FIELD_H - 5);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(FIELD_W / 2, FIELD_H / 2, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Center dot
  ctx.beginPath();
  ctx.arc(FIELD_W / 2, FIELD_H / 2, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // Penalty areas
  ctx.strokeRect(5, FIELD_H / 2 - 120, 120, 240);
  ctx.strokeRect(FIELD_W - 125, FIELD_H / 2 - 120, 120, 240);

  // Goal areas
  ctx.strokeRect(5, FIELD_H / 2 - 60, 50, 120);
  ctx.strokeRect(FIELD_W - 55, FIELD_H / 2 - 60, 50, 120);

  // Penalty spots
  ctx.beginPath();
  ctx.arc(110, FIELD_H / 2, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(FIELD_W - 110, FIELD_H / 2, 3, 0, Math.PI * 2);
  ctx.fill();

  // Penalty arcs
  ctx.beginPath();
  ctx.arc(110, FIELD_H / 2, 60, -0.7, 0.7);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(FIELD_W - 110, FIELD_H / 2, 60, Math.PI - 0.7, Math.PI + 0.7);
  ctx.stroke();

  // Corner arcs
  ctx.beginPath();
  ctx.arc(5, 5, 15, 0, Math.PI / 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(FIELD_W - 5, 5, 15, Math.PI / 2, Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(FIELD_W - 5, FIELD_H - 5, 15, Math.PI, Math.PI * 1.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(5, FIELD_H - 5, 15, Math.PI * 1.5, Math.PI * 2);
  ctx.stroke();

  // Goals
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(0, FIELD_H / 2 - GOAL_H / 2, 8, GOAL_H);
  ctx.fillRect(FIELD_W - 8, FIELD_H / 2 - GOAL_H / 2, 8, GOAL_H);

  // Goal net pattern
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 0.5;
  for (let y = FIELD_H / 2 - GOAL_H / 2; y < FIELD_H / 2 + GOAL_H / 2; y += 10) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(8, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(FIELD_W - 8, y);
    ctx.lineTo(FIELD_W, y);
    ctx.stroke();
  }
}

function drawPlayer(p) {
  const isControlled = p === getControlledPlayer();

  // Shadow
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + 4, PLAYER_R, PLAYER_R * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Player body
  ctx.beginPath();
  ctx.arc(p.x, p.y, PLAYER_R, 0, Math.PI * 2);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.strokeStyle = isControlled ? '#ffd600' : p.color2;
  ctx.lineWidth = isControlled ? 3 : 1.5;
  ctx.stroke();

  // Player number
  ctx.fillStyle = p.color2;
  ctx.font = 'bold 9px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText(p.playerIndex + 1, p.x, p.y + 3);

  // Player name
  ctx.fillStyle = '#fff';
  ctx.font = '8px "Segoe UI", Arial';
  ctx.fillText(p.name, p.x, p.y - PLAYER_R - 4);

  // Control indicator
  if (isControlled) {
    ctx.beginPath();
    ctx.arc(p.x, p.y - PLAYER_R - 12, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd600';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - PLAYER_R - 18);
    ctx.lineTo(p.x - 5, p.y - PLAYER_R - 25);
    ctx.lineTo(p.x + 5, p.y - PLAYER_R - 25);
    ctx.closePath();
    ctx.fillStyle = '#ffd600';
    ctx.fill();
  }

  // Has ball indicator
  if (p.hasBall) {
    ctx.beginPath();
    ctx.arc(p.x + PLAYER_R - 2, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
}

function drawBall() {
  // Shadow
  ctx.beginPath();
  ctx.ellipse(ball.x + 2, ball.y + 3, BALL_R, BALL_R * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Ball pattern
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = '#333';
  ctx.fill();
}

function drawGoalAnimation() {
  const alpha = Math.min(1, goalAnimationTimer / 30);
  ctx.fillStyle = `rgba(0,0,0,${alpha * 0.6})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.globalAlpha = alpha;

  const scale = 1 + (120 - goalAnimationTimer) / 120 * 0.5;
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(scale, scale);

  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 72px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffd600';
  ctx.shadowBlur = 30;
  ctx.fillText('GOOOL!!!', 0, -20);

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px "Segoe UI", Arial';
  ctx.fillText(`${goalScorer}`, 0, 30);

  ctx.font = '20px "Segoe UI", Arial';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`${goalMinute}'`, 0, 60);

  ctx.restore();
  goalAnimationTimer--;
}

  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 48px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);

  ctx.fillStyle = '#fff';
  ctx.font = '20px "Segoe UI", Arial';
  ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
}

function drawLeagueTable() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a1628');
  grad.addColorStop(1, '#1a237e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 36px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  const leagueName = selectedLeague === 'liga1' ? 'Liga 1 Indonesia' : 'Liga Internasional';
  ctx.fillText(leagueName, canvas.width / 2, 45);

  sortLeagueTable();

  const tableW = Math.min(900, canvas.width - 40);
  const tableX = canvas.width / 2 - tableW / 2;
  const tableY = 70;
  const rowH = 35;
  const colW = [40, 30, 120, 40, 40, 40, 40, 40, 40, 60]; // pos, badge, name, P, W, D, L, GF, GA, GD, Pts

  // Header
  ctx.fillStyle = 'rgba(255,215,0,0.2)';
  ctx.fillRect(tableX, tableY, tableW, rowH);
  ctx.strokeStyle = '#ffd600';
  ctx.lineWidth = 1;
  ctx.strokeRect(tableX, tableY, tableW, rowH);

  let xOff = tableX;
  const headers = ['#', '', 'Tim', 'M', 'Mn', 'S', 'K', 'GM', 'GK', 'SG', 'Poin'];
  headers.forEach((h, i) => {
    ctx.fillStyle = '#ffd600';
    ctx.font = 'bold 12px "Segoe UI", Arial';
    ctx.textAlign = 'center';
    ctx.fillText(h, xOff + colW[i] / 2, tableY + 22);
    xOff += colW[i];
  });

  // Rows
  leagueTable.forEach((team, i) => {
    const y = tableY + rowH + i * rowH;
    const isPersib = team.name === 'Persib Bandung';
    ctx.fillStyle = isPersib ? 'rgba(255,215,0,0.15)' : i % 2 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)';
    ctx.fillRect(tableX, y, tableW, rowH);

    xOff = tableX;

    // Position
    ctx.fillStyle = i < 2 ? '#ffd600' : i < 4 ? '#4caf50' : '#aaa';
    ctx.font = 'bold 13px "Segoe UI", Arial';
    ctx.textAlign = 'center';
    ctx.fillText(i + 1, xOff + colW[0] / 2, y + 22);
    xOff += colW[0];

    // Badge
    ctx.beginPath();
    ctx.arc(xOff + 15, y + rowH / 2, 12, 0, Math.PI * 2);
    ctx.fillStyle = team.color;
    ctx.fill();
    ctx.strokeStyle = team.color2;
    ctx.lineWidth = 1;
    ctx.stroke();
    xOff += colW[1];

    // Name
    ctx.fillStyle = isPersib ? '#ffd600' : '#fff';
    ctx.font = isPersib ? 'bold 13px "Segoe UI", Arial' : '12px "Segoe UI", Arial';
    ctx.textAlign = 'left';
    ctx.fillText(team.name, xOff + 5, y + 22);
    xOff += colW[2];

    // Stats
    const stats = [team.played, team.won, team.drawn, team.lost, team.gf, team.ga, team.gd, team.points];
    stats.forEach((s, si) => {
      ctx.fillStyle = si === 7 ? '#ffd600' : '#ccc';
      ctx.font = '12px "Segoe UI", Arial';
      ctx.textAlign = 'center';
      ctx.fillText(s, xOff + colW[3 + si] / 2, y + 22);
      xOff += colW[3 + si];
    });
  });

  // Legend
  const legendY = tableY + rowH + leagueTable.length * rowH + 15;
  ctx.fillStyle = '#ffd600';
  ctx.font = '10px "Segoe UI", Arial';
  ctx.textAlign = 'left';
  ctx.fillText('🥇 Liga Champions | 🥈 Liga Europa | Persib: Highlighted', tableX, legendY);

  // Next match button
  const btnW = 220, btnH = 40;
  const btnX = canvas.width / 2 - btnW / 2;
  const btnY2 = legendY + 30;

  ctx.fillStyle = 'rgba(255,215,0,0.2)';
  ctx.fillRect(btnX, btnY2, btnW, btnH);
  ctx.strokeStyle = '#ffd600';
  ctx.lineWidth = 2;
  ctx.strokeRect(btnX, btnY2, btnW, btnH);
  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 18px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('⚽ Main Pertandingan Berikutnya', canvas.width / 2, btnY2 + 26);

  // Back button
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(20, canvas.height - 50, 120, 35);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, canvas.height - 50, 120, 35);
  ctx.fillStyle = '#fff';
  ctx.font = '16px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('← Kembali', 80, canvas.height - 28);
}

function drawMatchResult() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a1628');
  grad.addColorStop(1, '#1a237e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const result = matchResult;
  if (!result) return;

  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 36px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('HASIL PERTANDINGAN', canvas.width / 2, 60);

  // Scoreboard
  const sbW = 500, sbH = 120;
  const sbX = canvas.width / 2 - sbW / 2;
  const sbY = 90;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(sbX, sbY, sbW, sbH);
  ctx.strokeStyle = '#ffd600';
  ctx.lineWidth = 2;
  ctx.strokeRect(sbX, sbY, sbW, sbH);

  // Home team
  ctx.fillStyle = result.home.color;
  ctx.fillRect(sbX + 10, sbY + 10, 80, 100);
  ctx.fillStyle = result.home.color2;
  ctx.font = 'bold 14px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText(result.home.short, sbX + 50, sbY + 55);
  ctx.font = '11px "Segoe UI", Arial';
  ctx.fillText(result.home.name, sbX + 50, sbY + 75);

  // Score
  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 48px "Segoe UI", Arial';
  ctx.fillText(`${result.homeScore} - ${result.awayScore}`, canvas.width / 2, sbY + 75);

  // Away team
  ctx.fillStyle = result.away.color;
  ctx.fillRect(sbX + sbW - 90, sbY + 10, 80, 100);
  ctx.fillStyle = result.away.color2;
  ctx.font = 'bold 14px "Segoe UI", Arial';
  ctx.fillText(result.away.short, sbX + sbW - 50, sbY + 55);
  ctx.font = '11px "Segoe UI", Arial';
  ctx.fillText(result.away.name, sbX + sbW - 50, sbY + 75);

  // Winner
  const winner = result.homeScore > result.awayScore ? result.home : result.awayScore > result.homeScore ? result.away : null;
  if (winner) {
    ctx.fillStyle = '#4caf50';
    ctx.font = 'bold 20px "Segoe UI", Arial';
    ctx.fillText(`🏆 ${winner.name} Menang!`, canvas.width / 2, sbY + sbH + 40);
  } else {
    ctx.fillStyle = '#ff9800';
    ctx.font = 'bold 20px "Segoe UI", Arial';
    ctx.fillText('🤝 Seri!', canvas.width / 2, sbY + sbH + 40);
  }

  // Buttons
  const btnW = 200, btnH = 40;
  const btnY2 = sbY + sbH + 70;

  // Next match
  ctx.fillStyle = 'rgba(255,215,0,0.2)';
  ctx.fillRect(canvas.width / 2 - btnW - 10, btnY2, btnW, btnH);
  ctx.strokeStyle = '#ffd600';
  ctx.lineWidth = 2;
  ctx.strokeRect(canvas.width / 2 - btnW - 10, btnY2, btnW, btnH);
  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 16px "Segoe UI", Arial';
  ctx.fillText('⚽ Pertandingan Berikutnya', canvas.width / 2 - btnW / 2 - 10, btnY2 + 26);

  // League table
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(canvas.width / 2 + 10, btnY2, btnW, btnH);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(canvas.width / 2 + 10, btnY2, btnW, btnH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Segoe UI", Arial';
  ctx.fillText('📊 Tabel Liga', canvas.width / 2 + btnW / 2 + 10, btnY2 + 26);
}

function drawSettings() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a1628');
  grad.addColorStop(1, '#1a237e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 36px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('PENGATURAN', canvas.width / 2, 60);

  const settings = [
    { label: 'Kecepatan Pertandingan', value: matchSpeed === 1 ? 'Normal' : matchSpeed === 2 ? 'Cepat' : 'Sangat Cepat', key: 'speed' },
    { label: 'Kontrol Player', value: 'Manual (Arrow Keys)', key: 'control' },
    { label: 'Musik', value: 'On', key: 'music' },
    { label: 'Efek Suara', value: 'On', key: 'sfx' }
  ];

  settings.forEach((s, i) => {
    const y = 120 + i * 70;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(canvas.width / 2 - 200, y, 400, 55);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.strokeRect(canvas.width / 2 - 200, y, 400, 55);

    ctx.fillStyle = '#fff';
    ctx.font = '18px "Segoe UI", Arial';
    ctx.textAlign = 'left';
    ctx.fillText(s.label, canvas.width / 2 - 180, y + 33);

    ctx.fillStyle = '#ffd600';
    ctx.font = 'bold 16px "Segoe UI", Arial';
    ctx.textAlign = 'right';
    ctx.fillText(s.value, canvas.width / 2 + 180, y + 33);
  });

  // Back
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(20, canvas.height - 50, 120, 35);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, canvas.height - 50, 120, 35);
  ctx.fillStyle = '#fff';
  ctx.font = '16px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('← Kembali', 80, canvas.height - 28);
}

function drawAwards() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a1628');
  grad.addColorStop(1, '#1a237e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffd600';
  ctx.font = 'bold 36px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('🏆 PENGHARGAAN', canvas.width / 2, 60);

  const awards = [
    { title: 'Juara Liga 1', count: trophyCount, icon: '🏆' },
    { title: 'Gol Terbaik', count: 0, icon: '⚽' },
    { title: 'Player of the Match', count: 0, icon: '⭐' },
    { title: 'Clean Sheet', count: 0, icon: '🧤' }
  ];

  awards.forEach((a, i) => {
    const y = 120 + i * 80;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(canvas.width / 2 - 200, y, 400, 65);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.strokeRect(canvas.width / 2 - 200, y, 400, 65);

    ctx.font = '40px "Segoe UI", Arial';
    ctx.textAlign = 'center';
    ctx.fillText(a.icon, canvas.width / 2 - 150, y + 45);

    ctx.fillStyle = '#fff';
    ctx.font = '18px "Segoe UI", Arial';
    ctx.textAlign = 'left';
    ctx.fillText(a.title, canvas.width / 2 - 100, y + 42);

    ctx.fillStyle = '#ffd600';
    ctx.font = 'bold 24px "Segoe UI", Arial';
    ctx.textAlign = 'right';
    ctx.fillText(a.count.toString(), canvas.width / 2 + 180, y + 42);
  });

  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(20, canvas.height - 50, 120, 35);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, canvas.height - 50, 120, 35);
  ctx.fillStyle = '#fff';
  ctx.font = '16px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.fillText('← Kembali', 80, canvas.height - 28);
}

// ============ INPUT HANDLING ============
function handleMenuInput() {
  if (mouse.clicked) {
    const menuItems = ['⚽ MAIN KOMPETISI', '📊 TABEL LIGA', '👥 PILIH TIM', '🏆 PENGHARGAAN', '⚙️ PENGATURAN'];
    const itemHeight = 55;
    const startY = canvas.height * 0.55;

    menuItems.forEach((item, i) => {
      const y = startY + i * itemHeight;
      if (mouse.y > y - 20 && mouse.y < y + 20 && mouse.x > canvas.width / 2 - 200 && mouse.x < canvas.width / 2 + 200) {
        menuSelection = i;
      }
    });

    if (mouse.y > startY - 20 && mouse.y < startY + itemHeight * 5 + 20) {
      switch (menuSelection) {
        case 0: gameState = 'teamSelect'; break;
        case 1: gameState = 'leagueTable'; break;
        case 2: gameState = 'teamSelect'; break;
        case 3: gameState = 'awards'; break;
        case 4: gameState = 'settings'; break;
      }
    }
  }

  if (keys['ArrowUp']) { menuSelection = (menuSelection - 1 + 5) % 5; keys['ArrowUp'] = false; }
  if (keys['ArrowDown']) { menuSelection = (menuSelection + 1) % 5; keys['ArrowDown'] = false; }
  if (keys['Enter'] || keys['Space']) {
    keys['Enter'] = false; keys['Space'] = false;
    switch (menuSelection) {
      case 0: gameState = 'teamSelect'; break;
      case 1: gameState = 'leagueTable'; break;
      case 2: gameState = 'teamSelect'; break;
      case 3: gameState = 'awards'; break;
      case 4: gameState = 'settings'; break;
    }
  }
}

function handleTeamSelectInput() {
  if (mouse.clicked) {
    const teams = selectedLeague === 'liga1' ? TEAMS.liga1 : TEAMS.international;
    const cols = 4;
    const cardW = 200, cardH = 70;
    const startX = canvas.width / 2 - (cols * (cardW + 15)) / 2 + cardW / 2;
    const startY2 = 155;

    teams.forEach((team, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = startX - cardW / 2 + col * (cardW + 15);
      const y = startY2 + row * (cardH + 15);

      if (mouse.x > x && mouse.x < x + cardW && mouse.y > y && mouse.y < y + cardH) {
        selectedTeam = i;
      }
    });

    // League selector
    const btnW = 180, btnH = 35;
    const btnY = 100;
    const ligaBtnX = canvas.width / 2 - btnW - 10;
    const intlBtnX = canvas.width / 2 + 10;

    if (mouse.x > ligaBtnX && mouse.x < ligaBtnX + btnW && mouse.y > btnY && mouse.y < btnY + btnH) {
      selectedLeague = 'liga1';
      selectedTeam = 0;
    }
    if (mouse.x > intlBtnX && mouse.x < intlBtnX + btnW && mouse.y > btnY && mouse.y < btnY + btnH) {
      selectedLeague = 'international';
      selectedTeam = 0;
    }

    // Back button
    if (mouse.x > 20 && mouse.x < 140 && mouse.y > canvas.height - 50 && mouse.y < canvas.height - 15) {
      gameState = 'menu';
    }
  }

  if (keys['Escape']) { keys['Escape'] = false; gameState = 'menu'; }
}

function handleMatchInput() {
  if (keys['Escape']) { keys['Escape'] = false; gameState = 'menu'; }

  if (matchPhase === 'halftime') {
    if (keys['Space']) {
      keys['Space'] = false;
      matchHalf = 2;
      matchMinute = 45;
      matchSecond = 0;
      matchPhase = 'playing';
      // Reset stamina
      homePlayers.forEach(p => p.stamina = Math.min(100, p.stamina + 30));
      awayPlayers.forEach(p => p.stamina = Math.min(100, p.stamina + 30));
    }
  }

  if (matchPhase === 'fulltime') {
    if (keys['Space']) {
      keys['Space'] = false;
      gameState = 'matchResult';
    }
  }
}

function handleLeagueTableInput() {
  if (mouse.clicked) {
    const tableW = Math.min(900, canvas.width - 40);
    const tableX = canvas.width / 2 - tableW / 2;
    const tableY = 70;
    const rowH = 35;

    // Next match button
    const btnW = 220, btnH = 40;
    const btnX = canvas.width / 2 - btnW / 2;
    const btnY2 = tableY + rowH + leagueTable.length * rowH + 15 + 30;

    if (mouse.x > btnX && mouse.x < btnX + btnW && mouse.y > btnY2 && mouse.y < btnY2 + btnH) {
      playNextMatch();
    }

    // Back button
    if (mouse.x > 20 && mouse.x < 140 && mouse.y > canvas.height - 50 && mouse.y < canvas.height - 15) {
      gameState = 'menu';
    }
  }

  if (keys['Escape']) { keys['Escape'] = false; gameState = 'menu'; }
}

function handleMatchResultInput() {
  if (mouse.clicked) {
    const result = matchResult;
    if (!result) return;

    const sbW = 500, sbH = 120;
    const sbX = canvas.width / 2 - sbW / 2;
    const sbY = 90;
    const btnW = 200, btnH = 40;
    const btnY2 = sbY + sbH + 70;

    // Next match
    if (mouse.x > canvas.width / 2 - btnW - 10 && mouse.x < canvas.width / 2 - 10 && mouse.y > btnY2 && mouse.y < btnY2 + btnH) {
      playNextMatch();
    }

    // League table
    if (mouse.x > canvas.width / 2 + 10 && mouse.x < canvas.width / 2 + 10 + btnW && mouse.y > btnY2 && mouse.y < btnY2 + btnH) {
      gameState = 'leagueTable';
    }
  }

  if (keys['Space'] || keys['Enter']) {
    keys['Space'] = false; keys['Enter'] = false;
    playNextMatch();
  }
  if (keys['Escape']) { keys['Escape'] = false; gameState = 'menu'; }
}

function handleSettingsInput() {
  if (mouse.clicked) {
    const settings = [
      { y: 120, key: 'speed' },
      { y: 190, key: 'control' },
      { y: 260, key: 'music' },
      { y: 330, key: 'sfx' }
    ];

    settings.forEach(s => {
      if (mouse.x > canvas.width / 2 - 100 && mouse.x < canvas.width / 2 + 100 && mouse.y > s.y && mouse.y < s.y + 55) {
        if (s.key === 'speed') {
          matchSpeed = matchSpeed === 1 ? 2 : matchSpeed === 2 ? 3 : 1;
        }
      }
    });

    if (mouse.x > 20 && mouse.x < 140 && mouse.y > canvas.height - 50 && mouse.y < canvas.height - 15) {
      gameState = 'menu';
    }
  }

  if (keys['Escape']) { keys['Escape'] = false; gameState = 'menu'; }
}

// ============ MAIN LOOP ============
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  switch (gameState) {
    case 'menu':
      drawMenu();
      handleMenuInput();
      break;
    case 'teamSelect':
      drawTeamSelect();
      handleTeamSelectInput();
      break;
    case 'match':
      updateMatch(dt);
      drawMatch();
      handleMatchInput();
      break;
    case 'leagueTable':
      drawLeagueTable();
      handleLeagueTableInput();
      break;
    case 'matchResult':
      drawMatchResult();
      handleMatchResultInput();
      break;
    case 'settings':
      drawSettings();
      handleSettingsInput();
      break;
    case 'awards':
      drawAwards();
      if (mouse.clicked) {
        if (mouse.x > 20 && mouse.x < 140 && mouse.y > canvas.height - 50 && mouse.y < canvas.height - 15) {
          gameState = 'menu';
        }
      }
      if (keys['Escape']) { keys['Escape'] = false; gameState = 'menu'; }
      break;
  }

  mouse.clicked = false;
  requestAnimationFrame(gameLoop);
}

// ============ INIT ============
initLeague();
requestAnimationFrame(gameLoop);
</script>
