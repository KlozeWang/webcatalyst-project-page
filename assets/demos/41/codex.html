<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lansana Games</title>
  <style>
    :root{
      --bg1:#0a0f1f;
      --bg2:#111a35;
      --accent:#35f2ff;
      --accent2:#8eff6a;
      --danger:#ff4b6e;
      --text:#eaf3ff;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1b2a57 0%, var(--bg1) 45%, #04070f 100%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .game-wrap{
      width:min(96vw, 900px);
      aspect-ratio:16/9;
      position:relative;
      border:2px solid #2b3f7a;
      border-radius:16px;
      box-shadow:0 0 30px #000a, inset 0 0 30px #0ff2;
      overflow:hidden;
      background: linear-gradient(180deg, var(--bg2), #070d1a);
    }
    canvas{
      width:100%;
      height:100%;
      display:block;
      background: transparent;
    }
    .hud{
      position:absolute;
      inset:0;
      pointer-events:none;
      padding:10px 14px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      font-weight:700;
      text-shadow:0 2px 8px #000;
    }
    .brand{
      color:var(--accent);
      letter-spacing:.5px;
      font-size:clamp(14px,2.5vw,22px);
    }
    .stats{
      display:flex;
      gap:14px;
      font-size:clamp(12px,2.2vw,18px);
    }
    .badge{
      background:#0c163399;
      border:1px solid #3f5ea9;
      padding:6px 10px;
      border-radius:10px;
    }
    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg, #03071399, #02040cdd);
      backdrop-filter: blur(2px);
      transition:opacity .2s ease;
    }
    .panel{
      width:min(90%,520px);
      background:#0b1430f2;
      border:1px solid #4063b0;
      border-radius:14px;
      padding:24px;
      text-align:center;
      box-shadow:0 10px 30px #000a;
    }
    h1{
      margin:0 0 8px;
      color:var(--accent);
      font-size:clamp(30px,6vw,52px);
      letter-spacing:1px;
    }
    p{
      margin:8px 0;
      line-height:1.4;
      color:#d8e8ff;
    }
    .btn{
      margin-top:16px;
      border:0;
      background:linear-gradient(180deg, #4cf7ff, #1fb6f2);
      color:#00111f;
      font-weight:900;
      letter-spacing:.5px;
      border-radius:10px;
      padding:12px 18px;
      cursor:pointer;
      font-size:16px;
      box-shadow:0 6px 16px #1fb6f277;
    }
    .btn:hover{filter:brightness(1.08);}
    .hidden{opacity:0; pointer-events:none;}
    .controls{
      position:absolute;
      left:0; right:0; bottom:10px;
      display:flex;
      justify-content:center;
      gap:16px;
      pointer-events:auto;
    }
    .ctrl{
      width:68px;height:68px;border-radius:50%;
      border:1px solid #5d78bf;
      background:#0b1738cc;
      color:#dff5ff;
      font-size:28px;font-weight:900;
      display:flex;align-items:center;justify-content:center;
      user-select:none;
      touch-action:none;
    }
    .ctrl:active{transform:scale(.96); background:#16306dcc;}
    @media (min-width: 900px){
      .controls{display:none;}
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <div class="hud">
      <div class="brand">Lansana Games</div>
      <div class="stats">
        <div class="badge">Pontuação: <span id="score">0</span></div>
        <div class="badge">Vidas: <span id="lives">3</span></div>
        <div class="badge">Nível: <span id="level">1</span></div>
      </div>
    </div>

    <div id="startOverlay" class="overlay">
      <div class="panel">
        <h1>Lansana Games</h1>
        <p>Colete os <strong>diamantes</strong> e desvie das <strong>bombas</strong>.</p>
        <p><strong>Teclado:</strong> ← → ou A/D</p>
        <p><strong>Celular:</strong> use os botões na tela</p>
        <button id="startBtn" class="btn">JOGAR</button>
      </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <div class="panel">
        <h1>Fim de Jogo</h1>
        <p>Sua pontuação: <strong id="finalScore">0</strong></p>
        <p>Recorde: <strong id="bestScore">0</strong></p>
        <button id="restartBtn" class="btn">JOGAR NOVAMENTE</button>
      </div>
    </div>

    <div class="controls">
      <div id="leftBtn" class="ctrl">◀</div>
      <div id="rightBtn" class="ctrl">▶</div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const levelEl = document.getElementById('level');

      const startOverlay = document.getElementById('startOverlay');
      const gameOverOverlay = document.getElementById('gameOverOverlay');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const finalScoreEl = document.getElementById('finalScore');
      const bestScoreEl = document.getElementById('bestScore');

      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');

      const W = canvas.width;
      const H = canvas.height;

      let running = false;
      let gameOver = false;
      let score = 0;
      let lives = 3;
      let level = 1;
      let spawnTimer = 0;
      let spawnInterval = 900;
      let lastTime = 0;
      let worldSpeed = 210;
      let stars = [];

      const keys = { left:false, right:false };
      const bestKey = 'lansana_best_score';
      let bestScore = Number(localStorage.getItem(bestKey) || 0);

      const player = {
        x: W/2,
        y: H - 85,
        w: 78,
        h: 30,
        speed: 520,
        glow: 0
      };

      function resetGame(){
        running = true;
        gameOver = false;
        score = 0;
        lives = 3;
        level = 1;
        spawnTimer = 0;
        spawnInterval = 900;
        worldSpeed = 210;
        stars = [];
        player.x = W/2;
        player.glow = 0;
        updateHUD();
        startOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
      }

      function updateHUD(){
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        levelEl.textContent = level;
      }

      function spawnItem(){
        const kind = Math.random() < 0.72 ? 'gem' : 'bomb';
        const size = kind === 'gem' ? (24 + Math.random()*10) : (26 + Math.random()*12);
        stars.push({
          kind,
          x: 30 + Math.random() * (W - 60),
          y: -40,
          size,
          speed: worldSpeed + Math.random()*160,
          rot: Math.random()*Math.PI*2,
          vr: (Math.random()*2 - 1)*2
        });
      }

      function collide(a,b){
        return (
          Math.abs(a.x - b.x) * 2 < (a.w + b.w) &&
          Math.abs(a.y - b.y) * 2 < (a.h + b.h)
        );
      }

      function endGame(){
        running = false;
        gameOver = true;
        if(score > bestScore){
          bestScore = score;
          localStorage.setItem(bestKey, String(bestScore));
        }
        finalScoreEl.textContent = score;
        bestScoreEl.textContent = bestScore;
        gameOverOverlay.classList.remove('hidden');
      }

      function drawBackground(t){
        ctx.clearRect(0,0,W,H);
        const g = ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0, '#121f45');
        g.addColorStop(1, '#050914');
        ctx.fillStyle = g;
        ctx.fillRect(0,0,W,H);

        // moving grid
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.strokeStyle = '#57d6ff';
        ctx.lineWidth = 1;
        const offset = (t*0.04)%40;
        for(let y=0; y<H; y+=40){
          ctx.beginPath();
          ctx.moveTo(0, y+offset);
          ctx.lineTo(W, y+offset);
          ctx.stroke();
        }
        for(let x=0; x<W; x+=60){
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawPlayer(dt){
        const halfW = player.w/2;
        player.x = Math.max(halfW + 10, Math.min(W-halfW-10, player.x));
        player.glow = Math.max(0, player.glow - dt*0.004);

        ctx.save();
        ctx.translate(player.x, player.y);
        // glow
        const glowR = 45 + player.glow*40;
        const glow = ctx.createRadialGradient(0,0,5,0,0,glowR);
        glow.addColorStop(0,'#9dfdff99');
        glow.addColorStop(1,'#9dfdff00');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(0,0,glowR,0,Math.PI*2); ctx.fill();

        // ship
        ctx.fillStyle = '#26d8ff';
        ctx.beginPath();
        ctx.moveTo(-player.w/2, player.h/2);
        ctx.lineTo(0, -player.h/2 - 8);
        ctx.lineTo(player.w/2, player.h/2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#8eff6a';
        ctx.fillRect(-10, player.h/2 - 2, 20, 8);
        ctx.restore();
      }

      function drawGem(item){
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot);
        ctx.fillStyle = '#8eff6a';
        ctx.strokeStyle = '#d8ffc8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0,-item.size);
        ctx.lineTo(item.size*0.75,0);
        ctx.lineTo(0,item.size);
        ctx.lineTo(-item.size*0.75,0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawBomb(item){
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot);
        ctx.fillStyle = '#ff4b6e';
        ctx.beginPath();
        ctx.arc(0,0,item.size*0.72,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#2a0a13';
        ctx.beginPath();
        ctx.arc(-item.size*0.18,-item.size*0.08,4,0,Math.PI*2);
        ctx.arc(item.size*0.18,-item.size*0.08,4,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle='#ffb0c0';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(0,-item.size*0.72);
        ctx.lineTo(item.size*0.4,-item.size*1.2);
        ctx.stroke();
        ctx.restore();
      }

      function burst(x,y,color){
        for(let i=0;i<12;i++){
          particles.push({
            x,y,
            vx:(Math.random()*2-1)*260,
            vy:(Math.random()*2-1)*260,
            life:420+Math.random()*280,
            max:700,
            color,
            s:2+Math.random()*3
          });
        }
      }

      const particles = [];
      function updateParticles(dt){
        for(let i=particles.length-1;i>=0;i--){
          const p = particles[i];
          p.life -= dt;
          p.x += p.vx*dt/1000;
          p.y += p.vy*dt/1000;
          p.vy += 220*dt/1000;
          if(p.life<=0) particles.splice(i,1);
        }
      }

      function drawParticles(){
        for(const p of particles){
          ctx.globalAlpha = Math.max(0,p.life/p.max);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x,p.y,p.s,p.s);
        }
        ctx.globalAlpha = 1;
      }

      function update(dt){
        if(!running) return;

        const move = (keys.left?-1:0) + (keys.right?1:0);
        player.x += move * player.speed * dt/1000;

        spawnTimer += dt;
        if(spawnTimer >= spawnInterval){
          spawnTimer = 0;
          spawnItem();
          if(Math.random()<0.2) spawnItem();
        }

        worldSpeed += dt * 0.004;
        level = 1 + Math.floor(score / 120);
        spawnInterval = Math.max(280, 900 - level*45);

        const pBox = {x:player.x,y:player.y,w:player.w,h:player.h};

        for(let i=stars.length-1;i>=0;i--){
          const it = stars[i];
          it.y += it.speed * dt/1000;
          it.rot += it.vr * dt/1000;

          const box = {x:it.x,y:it.y,w:it.size*1.3,h:it.size*1.3};
          if(collide(pBox, box)){
            if(it.kind === 'gem'){
              score += 10;
              player.glow = Math.min(1, player.glow + 0.25);
              burst(it.x,it.y,'#8eff6a');
            } else {
              lives -= 1;
              burst(it.x,it.y,'#ff4b6e');
              if(lives <= 0){
                stars.splice(i,1);
                updateHUD();
                endGame();
                return;
              }
            }
            stars.splice(i,1);
            updateHUD();
            continue;
          }

          if(it.y > H + 60){
            if(it.kind === 'gem'){
              // small penalty for missed gem
              score = Math.max(0, score - 2);
              updateHUD();
            }
            stars.splice(i,1);
          }
        }

        updateParticles(dt);
      }

      function render(t){
        drawBackground(t);

        for(const it of stars){
          if(it.kind==='gem') drawGem(it);
          else drawBomb(it);
        }

        drawPlayer(16);
        drawParticles();

        if(!running && !gameOver){
          ctx.fillStyle = '#ffffffcc';
          ctx.font = 'bold 38px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Prepare-se para jogar!', W/2, H*0.8);
        }
      }

      function loop(ts){
        if(!lastTime) lastTime = ts;
        const dt = Math.min(40, ts - lastTime);
        lastTime = ts;
        update(dt);
        render(ts);
        requestAnimationFrame(loop);
      }

      function keySet(e, isDown){
        const k = e.key.toLowerCase();
        if(k === 'arrowleft' || k === 'a') keys.left = isDown;
        if(k === 'arrowright' || k === 'd') keys.right = isDown;
        if((k === ' ' || k === 'enter') && isDown){
          if(!running) resetGame();
        }
      }

      window.addEventListener('keydown', e => keySet(e,true));
      window.addEventListener('keyup', e => keySet(e,false));

      function bindHold(btn, dir){
        const start = (e) => { e.preventDefault(); keys[dir] = true; };
        const end = (e) => { e.preventDefault(); keys[dir] = false; };
        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointercancel', end);
        btn.addEventListener('pointerleave', end);
      }
      bindHold(leftBtn,'left');
      bindHold(rightBtn,'right');

      startBtn.addEventListener('click', resetGame);
      restartBtn.addEventListener('click', resetGame);

      bestScoreEl.textContent = bestScore;
      updateHUD();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
