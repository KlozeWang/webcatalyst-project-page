<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lansana Games</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #08121f 0%, #12324f 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      user-select: none;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }
    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,.4);
      font-size: 16px;
    }
    .badge {
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 8px 12px;
      backdrop-filter: blur(8px);
    }
    .centerOverlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .panel {
      pointer-events: auto;
      max-width: 520px;
      width: min(92vw, 520px);
      background: rgba(5,10,20,.68);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      padding: 22px 20px 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 6vw, 52px);
      letter-spacing: 1px;
    }
    p {
      margin: 8px 0;
      line-height: 1.45;
      color: rgba(255,255,255,.88);
    }
    .btn {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      color: #06203a;
      background: linear-gradient(180deg, #7fe3ff 0%, #51bfff 100%);
      box-shadow: 0 10px 25px rgba(54,166,255,.35);
      cursor: pointer;
      pointer-events: auto;
    }
    .btn:active { transform: translateY(1px); }
    .small {
      margin-top: 14px;
      font-size: 13px;
      opacity: .85;
    }
    .hidden { display: none !important; }
    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
    .pad {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .touchBtn {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color: white;
      font-size: 22px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }
    .touchBtn:active, .touchBtn.active {
      background: rgba(127,227,255,.28);
      border-color: rgba(127,227,255,.6);
    }
    @media (pointer:fine) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="ui">
    <div class="topbar">
      <div class="badge">Lansana Games</div>
      <div class="badge">Score: <span id="score">0</span> | Vidas: <span id="lives">3</span></div>
    </div>

    <div id="menu" class="centerOverlay">
      <div class="panel">
        <h1>Lansana Games</h1>
        <p>Desvie dos obstáculos, colete moedas e sobreviva o maior tempo possível.</p>
        <p><b>Controles:</b> setas ← → ou A/D no teclado. No celular, use os botões.</p>
        <button id="startBtn" class="btn">Jogar</button>
        <div class="small">Boa sorte!</div>
      </div>
    </div>

    <div id="gameover" class="centerOverlay hidden">
      <div class="panel">
        <h1>Fim de Jogo</h1>
        <p>Sua pontuação final foi <b><span id="finalScore">0</span></b>.</p>
        <button id="restartBtn" class="btn">Jogar novamente</button>
      </div>
    </div>

    <div class="controls">
      <div class="pad">
        <button class="touchBtn" id="leftBtn">⟵</button>
        <button class="touchBtn" id="rightBtn">⟶</button>
      </div>
      <div class="badge">Colete as moedas!</div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const menu = document.getElementById('menu');
      const gameover = document.getElementById('gameover');
      const finalScore = document.getElementById('finalScore');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');

      let W = 0, H = 0, dpr = 1;
      function resize() {
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      const keys = { left: false, right: false };
      let running = false;
      let score = 0;
      let lives = 3;
      let lastTime = 0;
      let spawnTimer = 0;
      let coinTimer = 0;
      let stars = [];

      const player = {
        x: 0,
        y: 0,
        w: 44,
        h: 44,
        vx: 0,
        speed: 420
      };

      const obstacles = [];
      const coins = [];

      function resetGame() {
        score = 0;
        lives = 3;
        spawnTimer = 0;
        coinTimer = 0;
        obstacles.length = 0;
        coins.length = 0;
        stars = Array.from({ length: 90 }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.8 + 0.4,
          s: Math.random() * 0.7 + 0.2
        }));
        player.x = W / 2 - player.w / 2;
        player.y = H - 110;
        player.vx = 0;
        scoreEl.textContent = score;
        livesEl.textContent = lives;
      }

      function startGame() {
        resetGame();
        running = true;
        menu.classList.add('hidden');
        gameover.classList.add('hidden');
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      function endGame() {
        running = false;
        finalScore.textContent = score;
        gameover.classList.remove('hidden');
      }

      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', startGame);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if ((e.key === 'Enter' || e.key === ' ') && !running) startGame();
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      });

      function bindTouch(btn, dir) {
        const down = () => { keys[dir] = true; btn.classList.add('active'); };
        const up = () => { keys[dir] = false; btn.classList.remove('active'); };
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); down(); });
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', up);
      }
      bindTouch(leftBtn, 'left');
      bindTouch(rightBtn, 'right');

      function spawnObstacle() {
        const size = 26 + Math.random() * 28;
        obstacles.push({
          x: Math.random() * (W - size),
          y: -size - 10,
          w: size,
          h: size,
          vy: 170 + Math.random() * 210,
          hue: 10 + Math.random() * 20
        });
      }

      function spawnCoin() {
        const r = 10 + Math.random() * 6;
        coins.push({
          x: r + Math.random() * (W - r * 2),
          y: -r - 10,
          r,
          vy: 140 + Math.random() * 160,
          spin: Math.random() * Math.PI * 2
        });
      }

      function rectHit(a, b) {
        return a.x < b.x + b.w &&
               a.x + a.w > b.x &&
               a.y < b.y + b.h &&
               a.y + a.h > b.y;
      }

      function drawBackground(dt) {
        ctx.clearRect(0, 0, W, H);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#08121f');
        g.addColorStop(1, '#133b5c');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        stars.forEach(s => {
          s.y += s.s * (30 + score * 0.3) * dt;
          if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        });

        const horizon = H * 0.72;
        const glow = ctx.createRadialGradient(W/2, horizon, 20, W/2, horizon, W * 0.7);
        glow.addColorStop(0, 'rgba(76,192,255,0.18)');
        glow.addColorStop(1, 'rgba(76,192,255,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, horizon - 160, W, 320);

        ctx.fillStyle = 'rgba(4,18,28,0.65)';
        ctx.fillRect(0, horizon, W, H - horizon);

        ctx.strokeStyle = 'rgba(127,227,255,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, horizon);
        ctx.lineTo(W, horizon);
        ctx.stroke();
      }

      function drawPlayer() {
        const x = player.x, y = player.y;
        ctx.save();
        ctx.translate(x + player.w / 2, y + player.h / 2);

        ctx.shadowColor = 'rgba(0,0,0,.35)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#78e4ff';
        ctx.beginPath();
        ctx.roundRect(-player.w/2, -player.h/2, player.w, player.h, 12);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#0b2b40';
        ctx.beginPath();
        ctx.roundRect(-12, -8, 24, 18, 7);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-8, -2, 2.5, 0, Math.PI * 2);
        ctx.arc(8, -2, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawObstacle(o) {
        ctx.save();
        ctx.translate(o.x + o.w/2, o.y + o.h/2);
        ctx.fillStyle = `hsl(${o.hue} 90% 58%)`;
        ctx.shadowColor = 'rgba(255,80,40,.25)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(-o.w/2, -o.h/2, o.w, o.h, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.25)';
        ctx.fillRect(-o.w/4, -o.h/2 + 5, o.w/2, 4);
        ctx.restore();
      }

      function drawCoin(c) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.spin);
        ctx.shadowColor = 'rgba(255, 215, 0, .35)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffd84d';
        ctx.beginPath();
        ctx.arc(0, 0, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff7b0';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, c.r - 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function loop(now) {
        if (!running) return;
        const dt = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;

        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx *= 0.82;

        player.x += player.vx * dt;
        player.x = Math.max(8, Math.min(W - player.w - 8, player.x));

        spawnTimer += dt;
        coinTimer += dt;
        const obstacleRate = Math.max(0.42, 0.95 - score * 0.004);
        const coinRate = 1.15;

        if (spawnTimer >= obstacleRate) {
          spawnTimer = 0;
          spawnObstacle();
          if (Math.random() < 0.15) spawnObstacle();
        }
        if (coinTimer >= coinRate) {
          coinTimer = 0;
          spawnCoin();
        }

        obstacles.forEach(o => o.y += o.vy * dt);
        coins.forEach(c => { c.y += c.vy * dt; c.spin += dt * 5; });

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          if (o.y > H + 60) {
            obstacles.splice(i, 1);
            score += 1;
            scoreEl.textContent = score;
            continue;
          }
          if (rectHit(player, o)) {
            obstacles.splice(i, 1);
            lives -= 1;
            livesEl.textContent = lives;
            if (lives <= 0) {
              endGame();
              draw();
              return;
            }
          }
        }

        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          if (c.y > H + 40) {
            coins.splice(i, 1);
            continue;
          }
          const dx = (player.x + player.w / 2) - c.x;
          const dy = (player.y + player.h / 2) - c.y;
          if (Math.hypot(dx, dy) < c.r + 24) {
            coins.splice(i, 1);
            score += 5;
            scoreEl.textContent = score;
          }
        }

        draw(dt);
        requestAnimationFrame(loop);
      }

      function draw(dt = 0) {
        drawBackground(dt);
        coins.forEach(drawCoin);
        obstacles.forEach(drawObstacle);
        drawPlayer();

        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Lansana Games', W / 2, 34);
      }

      resetGame();
      draw(0);
    })();
  </script>
</body>
</html>
