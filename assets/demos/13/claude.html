  #stage{padding:2rem 1rem;max-width:980px;margin:0 auto;font-size:13px;line-height:1.25;white-space:pre;}
  .glow{color:#f3e7b3;text-shadow:0 0 8px #c8a44a,0 0 18px #6b4a14;}
  .dim{color:#544a36;}

  .blue{color:#7aa6c8;text-shadow:0 0 6px #143a5a;}

  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  .fade{opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s ease;}
  .fade.on{opacity:1;transform:none;}
  .controls{position:fixed;bottom:10px;right:14px;font-size:11px;color:#544a36;}
  button{background:transparent;border:1px solid #544a36;color:#c8b88a;padding:4px 10px;cursor:pointer;font-family:inherit;}
  button:hover{border-color:#c8a44a;color:#f3e7b3;}
  hr{border:none;border-top:1px dashed #322c1c;margin:1.4rem 0;}
  @media(max-width:680px){#stage{font-size:9px;}}
</style>
</head>

function render(){
  S.innerHTML='';
  blocks.forEach((b,i)=>{
    const d=document.createElement('div');
    d.className='fade '+b.cls;
    d.textContent=b.txt;
    S.appendChild(d);
    setTimeout(()=>d.classList.add('on'), 250+i*420);
  });
}
render();
document.getElementById('replay').onclick=render;

// subtle ambient drone
let ac;
document.body.addEventListener('click',()=>{
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const o1=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
  o1.frequency.value=72; o2.frequency.value=108;
  o1.type='sine'; o2.type='triangle';
  g.gain.value=0.025;
  o1.connect(g); o2.connect(g); g.connect(ac.destination);
  o1.start(); o2.start();
},{once:true});
</script>
</body>
