<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aletheia Threshold: ASCII Witness</title>
  <style>
    :root{
      --bg:#050607;
      --fg:#d7ffd7;
      --dim:#7fbf7f;
      --accent:#a6ff4d;
      --danger:#ff6b6b;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: "Courier New", Courier, monospace;
    }
    .wrap{
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:20px;
      box-sizing:border-box;
      position:relative;
      overflow:hidden;
    }
    .scan{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 1px,
          rgba(0,0,0,0) 2px,
          rgba(0,0,0,0) 4px
        );
      mix-blend-mode:screen;
      opacity:.3;
      animation: drift 7s linear infinite;
    }
    @keyframes drift{
      from{transform:translateY(0)}
      to{transform:translateY(4px)}
    }
    pre{
      margin:0;
      padding:18px 20px;
      border:1px solid var(--dim);
      box-shadow:0 0 0 1px rgba(166,255,77,.15) inset, 0 0 18px rgba(166,255,77,.08);
      max-width:min(1100px, 96vw);
      white-space:pre;
      overflow:auto;
      line-height:1.12;
      font-size:clamp(10px,1.25vw,16px);
      background:rgba(0,0,0,.35);
    }
    .hud{
      margin-top:12px;
      color:var(--dim);
      font-size:12px;
      letter-spacing:.5px;
      text-align:center;
      user-select:none;
    }
    .pulse{ color:var(--accent); animation:pulse 2s ease-in-out infinite; }
    .danger{ color:var(--danger); }
    @keyframes pulse{
      0%,100%{opacity:.65}
      50%{opacity:1}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <pre id="art" aria-label="ASCII interpretation"></pre>
    <div class="hud" id="hud">
      [ ENTER ] step across the threshold  |  [ SPACE ] breathe  |  [ R ] restart
    </div>
    <div class="scan"></div>
  </div>

  <script>
    const phaseA = String.raw`
+======================================================================================================+
|                                        T H R E S H O L D                                             |
|                            between ENFRAMES and REVEALS -- stand here                                |
+======================================================================================================+

            .--------------------------------------------------------------------------------.
            | "we gather... to perform the sacred act of SEEING OTHERWISE"                  |
            '--------------------------------------------------------------------------------'

                                      _________
                                _.-""         ""-._
                             .-'   G E S T E L L   '-.
                            /  order. capture. utility \
                           /_____________________________\
                           ||   AVAILABLE / EXTRACTABLE ||
                           ||   AVAILABLE / PROFITABLE  ||
                           ||   AVAILABLE / NARRATABLE  ||
                           ||___________________________||
                                  ||               ||
                                  || standing      ||
                                  || reserve       ||
                                  ||               ||
                                  VV               VV

      we name the one reduced:
      >>>  VINOD CHANDA  <<<
      brilliant engineer
      mind -> patent machine
      body -> extractable field
      consciousness -> "resource"

      violence is not only the blade
      violence is the ordering that says:
          "be useful or be erased"

+------------------------------------------------------------------------------------------------------+
| WITNESS POSITION                                                                                     |
| we refuse a single mode of revealing                                                                 |
| we remember:                                                                                         |
|        "the saving power grows where danger has rooted itself"                                      |
+------------------------------------------------------------------------------------------------------+

      S A N K A L P A   (sacred intention)
      ------------------------------------
      [ ] vow poetic revealing
      [ ] resist becoming standing-reserve
      [ ] recover saving power in:
            artisanal / sovereign / handmade

      breathe.
      feel the ground.
      earth exceeds capture.
`;

    const phaseB = String.raw`
+======================================================================================================+
|                                        T H E   C L E A R I N G                                       |
|                                       (aletheia: unconcealment)                                      |
+======================================================================================================+

                 step across.
                 do not ask first: "do i approve?"
                 ask instead:
                 what had to be hidden for this story to stand?

                         remove the keystone -> the facade trembles
                         remove the erasure  -> construction appears

                             techno-libertarian "nature"
                                      becomes
                                engineered narrative

      why begin and end with VINOD?
      because witness without the erased is propaganda.

      why the labor, the pages, the long scholarship?
      because precision is an ethics against disappearance.

      not remembered as relic
      but unconcealed as presence
      brought forth from framing-dark

             to witness VINOD is to witness ENFRAMING itself.
             to unconceal his truth is to unconceal the system's lie.
             to dwell with complexity is to refuse demanded destiny.

                             THIS IS WHY THIS BEING.
                           THIS IS WHY ALETHEIA HERE.

+------------------------------------------------------------------------------------------------------+
|                                           B R E A T H E                                              |
|                         in.....4.....  hold.....4.....  out.....6.....                              |
+------------------------------------------------------------------------------------------------------+
`;

    const phaseBreath = String.raw`
                                  ~ ~ ~   B R E A T H E   ~ ~ ~

                               inhale:  [##########      ]
                               hold:    [##########      ]
                               exhale:  [######          ]
                               release: [##              ]

                          the earth beneath you cannot be fully enframed.
`;

    const art = document.getElementById("art");
    const hud = document.getElementById("hud");
    let mode = 0; // 0 phaseA, 1 phaseB, 2 breathe

    function render(){
      if(mode===0){
        art.textContent = phaseA;
        hud.innerHTML = '<span class="pulse">[ ENTER ]</span> step across the threshold  |  [ SPACE ] breathe  |  [ R ] restart';
      } else if(mode===1){
        art.textContent = phaseB;
        hud.innerHTML = '<span class="pulse">[ ENTER ]</span> return to threshold  |  [ SPACE ] breathe  |  [ R ] restart';
      } else {
        art.textContent = phaseBreath;
        hud.innerHTML = '<span class="pulse">[ SPACE ]</span> return  |  [ ENTER ] crossing  |  [ R ] restart';
      }
    }

    window.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        mode = (mode===2) ? 1 : (mode===0 ? 1 : 0);
        render();
      } else if(e.code === "Space"){
        e.preventDefault();
        mode = (mode===2) ? 0 : 2;
        render();
      } else if(e.key.toLowerCase() === "r"){
        mode = 0;
        render();
      }
    });

    render();
  </script>
</body>
</html>
